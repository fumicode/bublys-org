<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>メモ</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="1 枚ごとに世界線を持つメモ。書き換えるたびに枝が伸びるので、いつでも前の形へ戻れるし、そこから別の形へ進める。"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <!--
      ★ **最初の画面**（JS が届くまでのあいだ、ここが出ている）。
        SPA は JS を落として走らせるまで何も無いので、素の HTML のままだと**完全な白画面**になる。
        React は最初の描画でこの中身をそっくり置き換えるので、消す手当ては要らない。
    -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: radial-gradient(120% 120% at 50% 0%, hsl(40, 55%, 28%) 0%, hsl(40, 55%, 19%) 60%, hsl(40, 50%, 12%) 100%);
          color: #f7f0e2;
          font: 400 16px/1.7 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
          letter-spacing: 0.02em;
          text-align: center;
          padding: 24px;
        "
      >
        <div style="font-size: 26px; font-weight: 600; letter-spacing: 0.04em">メモ</div>
        <div style="opacity: 0.45; font-size: 13px">読み込んでいます…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
