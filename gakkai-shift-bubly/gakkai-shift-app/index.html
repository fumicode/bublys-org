<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>学会シフト ── 当番表を、試しながら作る</title>
    <base href="/" />

    <meta name="description" content="学会の当番表（シフト）を、世界線で分岐させて見比べながら作るアプリ。シフトントンの前身。" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  </head>
  <body>
    <!--
      ★ **最初の画面**（JS が届くまでのあいだ、ここが出ている）。
        SPA は JS を落として走らせるまで何も無いので、素の HTML のままだと**完全な白画面**になる。
        React は最初の描画でこの中身をそっくり置き換えるので、消す手当ては要らない。
    -->
    <div id="root">
      <div
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 14px;
          background: radial-gradient(120% 120% at 50% 0%, hsl(215, 45%, 26%) 0%, hsl(215, 45%, 17%) 60%, hsl(215, 40%, 11%) 100%);
          color: #e9eef7;
          font: 400 16px/1.7 -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
          letter-spacing: 0.02em;
          text-align: center;
          padding: 24px;
        "
      >
        <div style="font-size: 26px; font-weight: 600; letter-spacing: 0.04em">学会シフト</div>
        <div style="opacity: 0.8">当番表を、試しながら作る</div>
        <div style="opacity: 0.45; font-size: 13px">読み込んでいます…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
