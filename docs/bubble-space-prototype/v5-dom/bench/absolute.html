<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>v5-dom bench —— absolute（left/top）</title>
<style>
  /* ★ ここは全案で共通。変えない */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d14;color:#e6ebf5;overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  /* 泡の要素は入力を受けない。当たり判定は placements から（driver.js が1つで受ける） */
  #stage *{pointer-events:none}

  .bub{position:absolute;border:1px solid}
  .bub.imp{border-style:dashed}
  .ttl{position:absolute;white-space:nowrap;line-height:1}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { start } from "./driver.js";

/* いちばん素朴：泡1つに div 1つ。left / top / width / height を毎フレーム書く（scale は使わない） */
const els = new Map();

function render(ps, api) {
  const frag = document.createDocumentFragment();
  for (const p of ps) {
    const el = document.createElement("div");
    el.className = "bub" + (p.implicit ? " imp" : "");
    el.style.borderColor = p.implicit ? "hsl(215 30% 62% / .45)" : `hsl(${p.hue} 70% 62% / .55)`;
    if (!p.implicit) el.style.background = `hsl(${p.hue} 70% 62% / .16)`;
    const t = document.createElement("span");
    t.className = "ttl";
    t.textContent = p.implicit ? "" : p.title;
    t.style.color = `hsl(${p.hue} 70% 78%)`;
    el.appendChild(t);
    els.set(p.id, { el, t });
    frag.appendChild(el);
  }
  api.stage.appendChild(frag);
  update(ps, api);
}

function update(ps, api) {
  for (let n = 0; n < ps.length; n++) {
    const p = ps[n], e = els.get(p.id);
    const s = e.el.style;
    if (!(p.alpha > 0) || p.w < 0.5) { s.display = "none"; continue; }
    s.display = "block";
    s.left = p.x + "px";
    s.top = p.y + "px";
    s.width = p.w + "px";
    s.height = p.h + "px";
    s.borderRadius = 8 * p.scale + "px";
    s.opacity = p.alpha;
    s.zIndex = n;
    const fs = Math.max(4, 12 * p.scale);
    e.t.style.fontSize = fs + "px";
    e.t.style.left = 8 * p.scale + "px";
    e.t.style.top = 16 * p.scale - fs + "px";
  }
}

start({ name: "absolute", render, update });
</script>
</body>
</html>
