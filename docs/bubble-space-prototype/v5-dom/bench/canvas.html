<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>v5-dom bench —— canvas（基準）</title>
<style>
  /* ★ ここは全案で共通。変えない */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d14;color:#e6ebf5;overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  /* 泡の要素は入力を受けない。当たり判定は placements から（driver.js が1つで受ける） */
  #stage *{pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { start } from "./driver.js";

/* 基準：canvas に毎フレーム全部描き直す（v4/lab.html と同じやり方） */
let g = null, W = 0, H = 0, dpr = 1;

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}

function render(ps, api) {
  const cv = document.createElement("canvas");
  W = api.W; H = api.H; dpr = api.dpr;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px`;
  api.stage.appendChild(cv);
  g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  update(ps, api);
}

function update(ps, api) {
  g.clearRect(0, 0, W, H);
  for (let n = 0; n < ps.length; n++) {
    const p = ps[n];
    if (!(p.alpha > 0) || p.w < 0.5) continue;
    g.globalAlpha = p.alpha;
    roundRect(p.x, p.y, p.w, p.h, 8 * p.scale);
    if (!p.implicit) { g.fillStyle = `hsl(${p.hue} 70% 62% / .16)`; g.fill(); }
    g.lineWidth = 1;
    g.setLineDash(p.implicit ? [4, 4] : []);
    g.strokeStyle = p.implicit ? "hsl(215 30% 62% / .45)" : `hsl(${p.hue} 70% 62% / .55)`;
    g.stroke();
    if (p.implicit) continue;
    const fs = Math.max(4, 12 * p.scale);
    g.font = `${fs}px -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif`;
    g.fillStyle = `hsl(${p.hue} 70% 78%)`;
    g.fillText(p.title, p.x + 8 * p.scale, p.y + 16 * p.scale);
  }
  g.globalAlpha = 1;
  g.setLineDash([]);
}

start({ name: "canvas", render, update });
</script>
</body>
</html>
