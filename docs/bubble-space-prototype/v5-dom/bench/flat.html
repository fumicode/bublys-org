<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>v5-dom bench —— flat（平らな transform）</title>
<style>
  /* ★ ここは全案で共通。変えない */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0d14;color:#e6ebf5;overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  /* 泡の要素は入力を受けない。当たり判定は placements から（driver.js が1つで受ける） */
  #stage *{pointer-events:none}

  /* ── ここから案の分 ──────────────────────────────────────────────
     DOM を入れ子にしない。全部の泡を #stage の兄弟にする。
     要素の素の大きさは「レンズを通す前の箱」bw×bh。倍率は transform の scale ひとつ。
     公理が「合成はここ1回だけ・深さ n でも scale は数値1つ」と言うので、これで足りる。
     角丸 8px も字 12px も箱の座標で書いておけば、scale が勝手に 8*scale・12*scale にする。

     枠だけは scale に乗せてはいけない（canvas は 1 画面px）。
     border-width を書くと layout が起きるので、**paint しか動かない inset box-shadow** で描く。 */
  .bub{position:absolute;left:0;top:0;transform-origin:0 0;border:0;border-radius:8px}
  .bub.imp{border:1px dashed hsl(215 30% 62% / .45)}   /* 点線は box-shadow で描けない。見えない親だけ枠のまま */
  /* 題名。原点を行の下（＝ベースライン側）に置く。倍率の下限は自分の scale で作る（layout を呼ばない） */
  .ttl{position:absolute;left:8px;top:4px;font-size:12px;line-height:1;white-space:nowrap;
       transform-origin:0 100%}
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { start } from "./driver.js";

/* 平らな transform
     ・DOM は1段（#stage > .bub × n）。合成の木の深さは 1
     ・毎フレーム書くのは transform 1行だけ。layout は drag でも wheel でも 0 回
     ・箱（bw/bh）・重なり順・透明度・枠の太さ・字の下限は **変わったときだけ** 書く
     ・⑤「触っていない泡は画面の上で動かない」ので、drag では動いた泡だけが書き換わる */

const els = new Map();

function render(ps, api) {
  const frag = document.createDocumentFragment();
  for (const p of ps) {
    const el = document.createElement("div");
    el.className = p.implicit ? "bub imp" : "bub";
    el.dataset.id = p.id;
    if (!p.implicit) el.style.background = `hsl(${p.hue} 70% 62% / .16)`;
    const t = document.createElement("span");
    t.className = "ttl";
    t.textContent = p.implicit ? "" : p.title;
    t.style.color = `hsl(${p.hue} 70% 78%)`;
    el.appendChild(t);
    els.set(p.id, { el, t, ring: p.implicit ? null : `hsl(${p.hue} 70% 62% / .55)`,
                    bw: -1, bh: -1, z: -1, a: -1, s: NaN, k: 1, x: NaN, y: NaN, on: true });
    frag.appendChild(el);
  }
  api.stage.appendChild(frag);
  update(ps, api);
}

function update(ps, api) {
  for (let n = 0; n < ps.length; n++) {
    const p = ps[n], e = els.get(p.id), s = e.el.style;
    if (!(p.alpha > 0) || p.w < 0.5) { if (e.on) { s.display = "none"; e.on = false; } continue; }
    if (!e.on) { s.display = ""; e.on = true; }

    // 箱が伸びたとき（resize）だけ。ここだけが layout を呼ぶ
    if (e.bw !== p.bw) { s.width  = p.bw + "px"; e.bw = p.bw; }
    if (e.bh !== p.bh) { s.height = p.bh + "px"; e.bh = p.bh; }

    // ★ 合成済みの値をそのまま1行で。⑤ で動いていない泡は、ここを素通りする
    if (e.x !== p.x || e.y !== p.y || e.s !== p.scale) {
      s.transform = "translate(" + p.x + "px," + p.y + "px) scale(" + p.scale + ")";
      e.x = p.x; e.y = p.y;
    }

    if (e.s !== p.scale) {                    // 倍率が変わったときだけ。どちらも paint しか動かさない
      if (e.ring) s.boxShadow = "inset 0 0 0 " + (1 / p.scale) + "px " + e.ring;  // 枠 1 画面px
      const k = p.scale < 1 / 3 ? 1 / (3 * p.scale) : 1;   // 字の下限 4px を、字自身の scale で作る
      if (e.k !== k) { e.t.style.transform = k === 1 ? "" : "scale(" + k + ")"; e.k = k; }
      e.s = p.scale;
    }

    if (e.z !== n) { s.zIndex = n; e.z = n; }
    if (e.a !== p.alpha) { s.opacity = p.alpha; e.a = p.alpha; }
  }
}

start({ name: "flat", render, update });
</script>
</body>
</html>
