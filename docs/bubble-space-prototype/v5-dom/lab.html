<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bubble-lab v5-dom</title>
<style>
  :root{--bg:#0b0d14;--panel:#141824;--line:#2a3145;--fg:#e6ebf5;--dim:#8b95ad;--accent:#6ee7ff;
    --move:#7ee2a8;--fix:#ff9db1;--own:#ffd479;
    --f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  #bar{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    padding:6px 12px 3px;display:flex;flex-direction:column;gap:5px}
  .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .lbl{color:var(--dim);font-size:11px;letter-spacing:.04em;white-space:nowrap;margin-right:2px}
  .axis{color:var(--fg);font-size:12px;font-weight:600;margin:0 2px 0 10px}
  select,button{background:#1d2334;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
  select:hover,button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
  button.on{background:var(--accent);color:#07202a;border-color:var(--accent);font-weight:600}
  .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
  #axis-scope{font-size:12px;font-weight:600;color:var(--fg)}
  #hint{color:var(--dim);font-size:11px;min-height:19px;padding-top:2px;border-top:1px dashed var(--line)}
  #hint b{color:var(--accent);font-weight:600}
  .r{color:#7d8aa6;font-style:normal;font-weight:600;margin-right:3px}
  #hint .r{color:var(--accent)}
  /* 泡は DOM なので、引くと字が選択されてしまう。canvas には無かった代金。ここで止める */
  #stage{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;touch-action:none;
    user-select:none;-webkit-user-select:none;
    background:radial-gradient(circle var(--gr,1080px) at 50% 50%,#141a2b 0%,#080a11 100%)}
  .box{position:absolute;background:rgba(10,12,20,.88);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;color:var(--dim);font-size:11px;line-height:1.65;pointer-events:none}
  #side{position:absolute;right:12px;top:12px;width:376px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  #side .box{position:static}
  .t{color:var(--fg);font-weight:600;letter-spacing:.04em}
  .sp{margin-top:3px}
  .nm{font-weight:600}
  .axs{padding-left:14px}
  .ax{display:inline-block;margin-right:10px;white-space:nowrap}
  .ax i{font-style:normal;color:var(--fg);opacity:.75;margin-right:3px}
  .own{color:var(--own)} .inh{color:var(--dim);font-style:italic}
  .move{color:var(--move)} .fix{color:var(--fix)} .cur{color:var(--accent)}
  .who{color:var(--fg);font-weight:600}
  #selection .k{display:inline-block;width:66px}
  #cursor-hint{left:0;top:0;white-space:pre;display:none;z-index:5;background:rgba(8,10,17,.95);border-color:#3a4560}
  #help{left:12px;bottom:12px}
  #help b{color:var(--accent);font-weight:600}
  /* ── ここから下が DOM 版（v5）の追加。canvas を捨てて、泡を1枚の層の兄弟にする ── */
  #layer{position:absolute;inset:0;z-index:1}
  #marks{position:absolute;inset:0;pointer-events:none;z-index:2}
  #bgfx{position:absolute;inset:0;pointer-events:none;z-index:0}
  #bgfx i{position:absolute;background:rgba(110,231,255,.16);display:block}
  #bgfx i.h{left:50%;top:50%;width:28px;height:1px;margin:0 0 0 -14px}
  #bgfx i.v{left:50%;top:50%;width:1px;height:28px;margin:-14px 0 0 0}
  #side{z-index:3} #help{z-index:3}
  /* 泡。素の大きさは箱（bw×bh）のまま。毎フレーム書くのは transform だけ。
     画面で固定の量は逆 scale（--k）で戻す。border-width や font-size を毎フレーム書かない */
  .bub{position:absolute;left:0;top:0;--k:1;--h:210;--rw:1.1px;--rr:10px;--rc:hsl(var(--h) 62% 58% / .8);
    transform-origin:0 0;border-radius:var(--rr);
    background:hsl(var(--h) 30% 13%);box-shadow:0 5px 18px rgba(0,0,0,.5)}
  .bub.chip{--rr:6px}
  .bub.sel{--rw:2.4px;--rc:#6ee7ff}
  /* ★ 枠は「子より上」に描く。inset の box-shadow は背景のレイヤなので、ヘッダ（.hd）が上から塗ってしまい、
     選択中のシアンがヘッダの帯の所だけ濁る。canvas 版はヘッダを塗ったあとに輪を引く。
     太さの半分ずつ内と外（canvas の stroke と同じ置き方） */
  .bub::after{content:"";position:absolute;pointer-events:none;
    inset:calc(var(--rw) * var(--k) / -2);border-radius:calc(var(--rr) + var(--rw) * var(--k) / 2);
    box-shadow:inset 0 0 0 calc(var(--rw) * var(--k)) var(--rc)}
  /* ★ 当たりを 1.5px 外へ広げ、丸い角も四角で拾う。可否は pickAt が模型の矩形で決め直す
     （DOM は要素の矩形を画素に丸めて当てるので、右端・下端の1列が落ち、左端・上端の外 1px が拾われる） */
  .bub::before{content:"";position:absolute;inset:calc(-1.5px * var(--k));border-radius:0}
  .bub>*{pointer-events:none}
  /* ★ 掴めるかどうかは vis から作る。opacity（補間した alpha）とは別の数 */
  .bub.off,.bub.off *{pointer-events:none!important}
  .hd{position:absolute;left:0;top:0;right:0;height:24px;background:hsl(var(--h) 55% 42% / .55);
    border-radius:10px 10px 0 0}
  .chip .hd{height:100%;border-radius:6px;background:hsl(var(--h) 55% 42% / .5)}
  .ttl{position:absolute;left:8px;top:0;height:24px;display:flex;align-items:center;
    font:600 12px/1 var(--f);color:#eaf1ff;white-space:nowrap;max-width:calc(100% - 14px);overflow:hidden}
  .chip .ttl{height:100%}
  .bub.nt .ttl{display:none}
  /* 中身の仮の行：太さ 3.5・間隔 11・幅は中身の 82%、★最後の1本だけ 50%（canvas 版と同じ数）。
     本数 --rows は箱の大きさが変わったときだけ書く（canvas 版と同じ min(6, floor((h-24-12)/11))） */
  .bd{position:absolute;left:10px;right:10px;top:33px;opacity:.5;
    height:max(0px,var(--rows,0) * 11px - 7.5px);
    background-image:linear-gradient(#9fb0cc,#9fb0cc),
      repeating-linear-gradient(to bottom,#9fb0cc 0 3.5px,transparent 3.5px 11px);
    background-position:0 calc(var(--rows,0) * 11px - 11px),0 0;
    background-size:50% 3.5px,82% max(0px,var(--rows,0) * 11px - 18.5px);
    background-repeat:no-repeat}
  .bub.host .bd,.bub.chip .bd,.bub.nb .bd{display:none}
  .inner{position:absolute;left:4px;top:27px;right:4px;bottom:4px;border-radius:6px;opacity:.5;
    outline:calc(1px * var(--k)) dashed hsl(var(--h) 60% 62% / .45);outline-offset:calc(-1px * var(--k))}
  .bub:not(.host) .inner{display:none}
  .mk{position:absolute;right:9px;top:0;height:24px;display:flex;align-items:center;
    font:600 10px/1 var(--f);color:#7ee2a8;white-space:nowrap}
  .bub.mfix .mk{color:#ff9db1}
  .bub:not(.host) .mk,.bub.nm .mk{display:none}
  .bub.mk2 .mk{top:24px;height:14px;right:6px;padding:0 3px;background:hsl(var(--h) 30% 13%);
    font-size:var(--mkfs,10px)}
  /* 大きさの角：選択中の泡ひとつだけ。★泡の中ではなく #layer の兄弟に置く。
     泡の中に置くと、遠い泡の opacity（0.15〜1）に角まで薄まる（canvas 版は角だけ globalAlpha 1 で塗る）。
     四角は 8px、当たりは 16px（模型の 15px ＝ [右端-12, 右端+3] を pickAt が削り出す） */
  #hnd{position:absolute;left:0;top:0;width:16px;height:16px;display:none;cursor:nwse-resize;transform-origin:0 0}
  #hnd::after{content:"";position:absolute;left:2px;top:2px;width:8px;height:8px;background:#6ee7ff;border-radius:2px}
  /* ③ 見えない親は体を持たない：枠は pointer-events:none。当たるのは外周 12px の4本の帯だけ */
  .bub.imp{background:none;box-shadow:none;border-radius:0;pointer-events:none}
  .bub.imp::before,.bub.imp::after{content:none}
  /* ★ 点線の枠は「箱の外 5px の道」の上に、太さの半分ずつ内と外（canvas の stroke と同じ）。
     CSS の border は箱の内側に引かれるので、そのぶん外へ出しておかないと 1px 内へずれる */
  .fr{position:absolute;--fw:1.2px;opacity:.55;
    left:calc((-5px - var(--fw) / 2) * var(--k));top:calc((-5px - var(--fw) / 2) * var(--k));
    right:calc((-5px - var(--fw) / 2) * var(--k));bottom:calc((-5px - var(--fw) / 2) * var(--k));
    border:calc(var(--fw) * var(--k)) dashed #cdd8ee;border-radius:calc((12px + var(--fw) / 2) * var(--k))}
  .bub.imp.sel .fr{--fw:1.8px}
  .bub.imp.on .fr{border-color:#6ee7ff;opacity:.95}
  /* 札の字：canvas は座布団の上端から 2.5px 下に字の上を置く。flex の中央ぞろえだけだと 2px 下がる */
  .lb{position:absolute;left:calc(-4px * var(--k));top:calc(100% + 7px * var(--k));
    height:calc(15px * var(--k));display:flex;align-items:center;
    padding:0 calc(3px * var(--k)) calc(4px * var(--k));
    font-family:var(--f);font-weight:600;font-size:calc(10px * var(--k));line-height:1;white-space:nowrap;
    color:#cdd8ee;background:rgba(8,10,17,.92);border-radius:calc(3px * var(--k));opacity:.8}
  .bub.imp.on .lb{color:#6ee7ff;opacity:.95}
  .bub.imp.lbup .lb{top:auto;bottom:calc(100% + 7px * var(--k))}
  .rg{position:absolute}
  .bub.imp .rg{pointer-events:auto}
  /* 縁は 12px。DOM の画素まるめで外側 1px を取りこぼさないよう 13px 敷き、pickAt が onRing で 12px に削る */
  .rt{left:calc(-13px * var(--k));top:calc(-13px * var(--k));width:calc(100% + 26px * var(--k));height:calc(13px * var(--k))}
  .rb{left:calc(-13px * var(--k));bottom:calc(-13px * var(--k));width:calc(100% + 26px * var(--k));height:calc(13px * var(--k))}
  .rl{left:calc(-13px * var(--k));top:0;width:calc(13px * var(--k));height:100%}
  .rr{right:calc(-13px * var(--k));top:0;width:calc(13px * var(--k));height:100%}
  /* 印（いま離したらどうなるか） */
  #marks div{position:absolute;box-sizing:border-box}
  .mk-space{border:1px dashed rgba(110,231,255,.45);border-radius:6px}
  .mk-out{border:2px dashed #6ee7ff;border-radius:6px;box-shadow:0 0 10px rgba(110,231,255,.75)}
  .mk-cell{border:2px dashed #6ee7ff;border-radius:5px;background:rgba(110,231,255,.12);box-shadow:0 0 10px rgba(110,231,255,.75)}
  .mk-occ{border:1.5px dashed #ffd479;border-radius:7px}
  .mk-line{background:#6ee7ff;box-shadow:0 0 10px rgba(110,231,255,.85)}
  .mk-lb{background:rgba(8,10,17,.88);color:#6ee7ff;font:600 12px/1.4 var(--f);padding:1px 4px;border-radius:3px;white-space:nowrap}
  .mk-lb.warn{color:#ff9db1} .mk-lb.swap{color:#ffd479}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="row">
      <span class="lbl">プリセット</span>
      <button data-preset="free" data-hint="選択中の泡がいる空間を <b>自由に置く</b> に。X・Y は自由座標そのまま、Z は透視。中の泡を掴むと動く">自由に置く</button>
      <button data-preset="row" data-hint="選択中の泡がいる空間を <b>横に並べる</b> に。X は順序を詰めて並べる。掴むと並べ替わる">横に並べる</button>
      <button data-preset="column" data-hint="選択中の泡がいる空間を <b>縦に並べる</b> に。Y は順序を詰めて並べる。掴むと並べ替わる">縦に並べる</button>
      <button data-preset="grid" data-hint="選択中の泡がいる空間を <b>格子</b> に。X は列、Y は行を詰めて並べる。掴むと別のマスへ移る">格子</button>
      <button data-preset="fisheyeX" data-hint="選択中の泡がいる空間を <b>X魚眼ビュー</b> に。X は履歴の世代を魚眼で、Y は履歴の枝を平行で。掴むと視点が動く">X魚眼ビュー</button>
      <button data-preset="coverflow" data-hint="選択中の泡がいる空間を <b>coverflow</b> に。X は順序を等間隔に魚眼で。背景を横に引くとスライドする">coverflow</button>
      <button data-preset="histZ" data-hint="選択中の泡がいる空間を <b>履歴を奥行きに</b>。Z は履歴の古さを透視で。ホイールで時間を行き来する">履歴を奥行きに</button>
      <button data-preset="stackZ" data-hint="選択中の泡がいる空間を <b>重ねて置く</b>。X・Y は自由、<b>Z は順序</b>。泡を触ると最前面へ並べ替わる（重ねた紙のように）">重ねて置く</button>
      <span class="sep"></span>
      <button id="inherit" data-hint="選択中の泡がいる空間の自前の View を捨てて、<b>外の空間の並べ方を継ぐ</b>（焦点は継がない）">外から継ぐ</button>
      <button id="refocus" data-hint="選択中の泡がいる空間の焦点を 0 に戻す">焦点を戻す</button>
    </div>
    <div class="row">
      <span id="axis-scope" data-hint="軸セレクタが効く空間。<b>選択中の泡がいる空間</b>">外の空間 の</span>
      <span class="axis">X</span>
      <select data-axis="x" data-part="dim" data-hint="横に何を読むか。<b>自由</b>＝動く／<b>順序</b>＝並べ替わる／<b>列・行</b>＝マスを移る／<b>履歴</b>＝視点が動く／なし＝何も起きない"></select>
      <select data-axis="x" data-part="arrange" data-hint="値を位置にする決め方。<b>そのまま</b>＝px／<b>等間隔</b>＝値×間隔／<b>詰める</b>＝値ごとの帯を隙間 14px で並べる"></select>
      <select data-axis="x" data-part="lens" data-hint="横の位置を画面に写す式。<b>平行</b>＝そのまま／<b>魚眼</b>＝焦点の近くを大きく、端を詰める"></select>
      <span class="axis">Y</span>
      <select data-axis="y" data-part="dim" data-hint="縦に何を読むか。自由＝動く／順序＝並べ替わる／列・行＝マスを移る／履歴＝視点が動く"></select>
      <select data-axis="y" data-part="arrange" data-hint="値を位置にする決め方。そのまま＝px／等間隔＝値×間隔／詰める＝値ごとの帯"></select>
      <select data-axis="y" data-part="lens" data-hint="縦の位置を画面に写す式。平行／魚眼"></select>
      <span class="axis">Z</span>
      <select data-axis="z" data-part="dim" data-hint="奥行きに何を読むか。<b>なし</b>ならホイールは何もしない"></select>
      <select data-axis="z" data-part="arrange" data-hint="奥行きの値の決め方。そのまま／等間隔（値×1）／詰める（値の順位）"></select>
      <select data-axis="z" data-part="lens" data-hint="奥行きの写し方。<b>透視</b>＝消失点へ寄せて小さく／<b>平行</b>＝奥行きを見た目に使わない"></select>
    </div>
    <div id="hint"><i class="r">①</i>親の View で決まる　<i class="r">②</i>操作は軸と掴んだもの　<i class="r">③</i>見えない親は体を持たない　<i class="r">④</i>並べる＝帯　<i class="r">⑤</i>触っていない泡は動かない</div>
  </div>
  <div id="stage">
    <div id="bgfx"><i class="h"></i><i class="v"></i></div>
    <div id="layer"><div id="hnd"></div></div>
    <div id="marks"></div>
    <div id="side">
      <div class="box" id="spaces"></div>
      <div class="box" id="selection"></div>
    </div>
    <div class="box" id="cursor-hint"></div>
    <div class="box" id="help">
      泡を掴んで横・縦に引く … 軸ごとに <b>動く／並べ替わる／マスを移る／視点が動く</b><br>
      中へ落とす … その子になる　縁へ寄せて離す … <b>くっつく</b>（見えない親の並び）　外へ大きく引く … 外へ<br>
      ホイール … 奥行きの視点（Z が なしなら何もしない）　右下の角 … 大きさ
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================================
   bubble-lab v5-dom —— 泡のならべかた（canvas 版 v4 と同じことを、DOM でやる）
   仕様：docs/bubble-space-prototype/v4/RULES.md（正はそこ。1文字も変えていない）
   描き方の根拠：docs/bubble-space-prototype/v5-dom/FINDINGS.md（DOM で測った結果）
   ★ 1ファイル。外部の .js/.css/.json を読まない。file:// でダブルクリックして開くだけで動く

   規則はこれで全部
     ① 泡の見え方は、その泡を入れている親の View で決まる。
        View は軸（X・Y・Z）ごとに「次元・並べ方・レンズ」を持つ。これが入れ子ごとに繰り返される
     ② 操作は、軸と、何を掴んだかで決まる
     ③ 見えない親は、体を持たない
     ④ 並べるとは、値ごとに帯を作り、帯の中に揃えて置き、塊の中央を空間の中心に置くこと
     ⑤ 触っていない泡は、画面の上で動かない
     ①〜④は「値 → 見え」を決める。⑤だけが逆で、「さっきの見えを保つように、値を書き直す」

   土台と、借りてきた部品
     土台   v3/00-core.html を複製（公理だけで組んであり、いちばん小さい。
            直した形の raise・freeCellNear、min の大きさ、6場面をそのまま使う）
     泡の像 v3/03-pack-or-equal.html の projectIn()。泡の大きさを「中心1点の局所倍率」ではなく
            「泡の端をレンズに通した像の幅 ÷ 自前の幅」で決める（resolveSpace・measure・focusFits の3か所）
     見えない親 v3/01-snap-is-parent.html。くっつける／並びに加わる／並びは2つ以上／体を持たない
     pin    v3/01-snap-is-parent.html の pin()。留めるのは空間の中身が変わったときだけ

   入れなかったもの（v3 で比べるためだけに置いたもの）
     大きさの決め方の4通り・泡の縮み方・揃え/隙間/箱/塊 の比べトグル・案4の比べのボタン・
     案6のレイアウト/カメラの対照実験・stack（置いた順）・pin の切り替えボタン

   画面で規則を指す
     ツールバーの下のヒント行（何も乗せていないとき）が①〜⑤の見出し。
     選択中の泡・カーソル脇のヒントの行頭に、その行がどの規則から出ているかの番号を出す

   canvas 版 v4 から何を変えたか
     変えたのは描く所と当たり判定だけ。モデル（次元・並べ方・レンズ・解く順・操作・pin・くっつける）は
     v4 の写しで、1行も直していない。実測でも配置・倍率・描く順は v4 と 0.0000px 差（_check/vs-v4.mjs）
       描く    canvas の drawBubble/drawRowFrame/drawSpaceMark/drawDragMarks → §2' の render()/renderMarks()
       当たり  描いた順の逆をなぞる hitTest/handleAt → DOM の elementsFromPoint（pickAt）
               ※ 比べるために、v4 と同じ式の hitModel は残してある（__lab.hitModelAt）
       入れ物  <canvas> → #layer（泡）・#marks（印）・#bgfx（背景の十字）

   踏んだこと（v5-dom を作って、本物のブラウザを本物のマウスで動かして分かったことだけ）
     （検証：_check/all.mjs ＝ smoke・vs-v4・hit・drag・flat・perf・ui・rule1〜5・snap・screen の 14 本。数は 1440×900）
     - DOM の当たり判定は、画素に丸められて 1px ぶん気前がいい。画面じゅうを 5px 格子で 33600 点突いて
       v4 の式と突き合わせると、食い違いは 497 点（1.48%）。そのうち 492 点は「当たり所の縁 ±1px」、
       5 点は「丸い角の外」。それ以外は 0 点。
       例：版1 の左端は 79.577px（DOM の実測もぴったり同じ）なのに、79px を突くと当たる。
       つまり z-index を描く順にすれば elementFromPoint は公理どおり ── ただし縁は 1px 甘い
     - **角（.hnd）は泡の外へ 3px はみ出すので、そこを「泡に当たった」と数えると v4 と食い違う。**
       elementFromPoint 1発では区別できなかったので elementsFromPoint にして、
       「いちばん上が角なら角・泡を探すときは角を飛ばす」の2つを1回で拾う形にした（pickAt）
     - **opacity と pointer-events は別の数から作った。** opacity は補間した alpha、pointer-events は
       補間しない vis。これを1つにすると、レンズが消したのに薄れて見えている泡が掴めてしまう
     - ③ 見えない親は div 1枚では表せない。`pointer-events:none` の枠 ＋ 外周 12px の帯4本（.rg）にした。
       実測：箱の中 → 中の泡が返る／外へ 6px・11px → 並びが返る／14px → 背景。切り抜き（clip-path）は使っていない
     - **DOM で当たり判定するなら、解き直したら DOM にも写してから突かないといけない。**
       v4 は「印は いま離したらどうなるか」を書いたばかりの座標で解き直してから見ている（moveBubble）。
       DOM だと、そこで render() を挟まないと1フレーム前の DOM を突くことになる。endDrag も同じ
     - 泡は DOM なので、引くと字が選択される（canvas には無かった代金）。#stage に user-select:none
     - 書いた回数の実測（__lab.stats）：落ち着いているとき 85 フレーム・のべ 4930 個で書き込み 0。
       メモを 180px 引くあいだ 105 フレーム・のべ 5802 個で transform 33・大きさ 1・逆scale 1・z-index 57。
       frame()（解く＋写す＋説明パネル）は中央 0.300ms／最大 0.500ms
     - ② を DOM で確かめた：勤務表を 議事録（版）に重ねると、勤務表の中の「制約」の z-index 37 >
       議事録 15。重なった 10752画素 の真ん中を突くと「制約」が勝つ。
       これは1枚の層の兄弟だからできること（入れ子だと議事録が勝つ ── FINDINGS.md の 688画素）
     - freeCellNear に v4 から続く穴がある（v5 でも同じ答え。直していない）：
       押し出された先客の逃げ先を探すとき `Math.max(0, ...)` で 0 未満を切り上げるので、
       行 0・列 0 の端では「自分のマス」が空きに見えて、そこへ逃げる＝逃げない。
       実測：スタッフの佐藤を カレンダーの「6」（5,0）へ落とすと v4 も v5 も (5,0) に2つ入る。
       周りに空きがあるとき（「7」のマスで (6,1) を空けておく）は、先客がちゃんと (7,0) へ逃げる
     - 絵で1つだけ v4 と違う：中身の仮の行の最後の1本。v4 は最後だけ半分の長さにしている（今は全部同じ長さ）

   踏んだこと（v4 のときのもの。モデルはここから1行も変えていない）
     - 借りてきた物の名前が、土台の場面の名前とぶつかった。見えない親の id を "row"+n にしたら、
       「横に並べる」の中身（row0・row1・row2）の row1 を上書きして、付箋A・付箋B が画面の2か所に描かれ、
       空間の一覧にも並びが2つ出た。id は "snap"+n にした。案1 の場面には "row" が無かったので、案1 では出なかった穴
     - pin を入れたら、土台が持っていた書き込みが2つ消せた（位置を書く所は 4 → 3 つ）：
       ・角を引いたときの「位置が書ける軸なら自分の位置を書く」… 外へたどって書き戻す pin の一例だった
       ・落とし込みの slot.coord「離した先の自由座標を書く」… pin が「離した所に見えていた場所」へ書き戻すので要らない
       残ったのは 自由次元のドラッグ・pin・奥行き（keepSeen）の3つ
     - 泡の像に替えても、平行のレンズの空間は1つも変わらない（実測：00-core と同じ id の泡 54 のうち、
       変わったのは coverflow の写真7つ と X魚眼ビューの版10枚だけ。最大 4.53px）。
       魚眼と詰めるが同じ軸で重なる場面が土台に無かったので、絵の違いはここにしか出ない
     - 詰める × 魚眼 の重なりは 隙間 0/14/28 のどれも 0 組（隣との間 0.0／4.1,8.5,13.2,13.2,8.5,4.1／7.5,16.3,26.2,26.2,16.3,7.5）。
       等間隔 × 魚眼 は 6 組のまま（−9.2〜−21.1px）で、隙間を 28 にしても減らない ── 重なりを作るのはレンズではなく並べ方
     - 勤務表の X も Y も魚眼にしても、詰めるの空間（勤務表・カレンダー・スタッフ）は重なり 0・箱からのはみ出し 0
     - ⑤ の「伸びの半分」は、箱の伸びが泡の伸びと同じ場面でないと出ない。スタッフの自前の大きさ（120px）が
       佐藤（76px）より広いので、最初の 60px の伸びは自前の大きさに吸われ、pin 入りでも勤務表の左端が 7.2px 動いた
       （佐藤自身は 0.0px。動いたのは勤務表の箱そのものが伸びたから）。先に一度広げて「箱は中身が決める」形にしてから測ると、
       pin 入り 勤務表・スタッフ 0.0px／pin 切り −30.0px ＝ 伸び 60.0px のちょうど半分。カレンダーは帯の伸びちょうど 60.0px 押される
     - ③ の「並びは View を受け取らない」を画面の px で測ると、8つのプリセットのうち 重ねて置く だけ 4.5px 動く。
       受け取ったのではなく、③ の「Z は軸まるごと外の窓のもの」がそのまま効いている（窓の Z が 順序 なので、
       並びの中でも順序が奥行きになり、2つ目の泡が奥へ寄る）。窓の Z を なし にして測り直すと 8つとも 0.00px・箱も 250×96 のまま
     - 見えない親の名前は、案1 では「泡にもほかの字にも重ねない」候補探し（placeLabels）を持っていた。
       v4 は並びが1〜2個なので、枠の下（入らなければ上）に置くだけにした。入れ子の並び
       （付箋B の下に 思いつき）でも2つの名前は重ならない。並びを画面の下端に置くと札が左下のヘルプの下に隠れたので、場面を上へ寄せた
     - 検証の側で踏んだこと2つ（画面の答えは正しかった）：
       ・外の空間の焦点 Z をホイールで 0.4 送ったままにすると、z=0 の場面が全部 dz<0 で消えて、
         以降の「横ドラッグ」が全部「何も起きない」になる。場面ごとに焦点を戻して測った
       ・角は選択中の泡にしか出ない（handleAt）。選ばずに角を掴むと、泡そのもののドラッグになる
     - くっつけるが「落とし込みの1つ」であることは、入れ子の中で効いた：カレンダーの「7」を 22px・制約を 95px・
       伊藤を 40px 右へ引いても、3つとも中に留まり勤務表は 0.00px。勤務表の外まで引き出せば、伊藤は外の並びに加われる
     - 帯の中の揃えは RULES.md のとおり View の軸の値にした（UI のトグルにはしない）。効くのは詰めるだけで、
       等間隔の帯は「中心が 値×間隔・幅が 間隔」なので泡はいつも帯の中央に来る。勤務表の X を中央ぞろえにすると
       制約とカレンダーの左端が 34.4px ずれる ── 始端でないと「上に制約、その下にカレンダー」にならない
     - 合成 scale は深さ3でも数値1つ：0.405300 ＝ 0.905797 × 0.822771 × 0.543834（勤務表を奥に置き、勤務表とカレンダーの X を魚眼にして測った）
   ============================================================================ */

/* ============================================================
   §1 語彙：次元・並べ方・レンズ
   ============================================================ */
const HEADER = 24;              // 泡のヘッダの高さ（中身の箱はこの下）
const PAD = 14;                 // 空間を持つ泡の箱の余白
const GAP = 14;                 // 「詰める」の帯と帯の隙間
const K_PERSP = 0.26;           // 透視：奥行き1あたりの縮み
const ROOT_VP = { x: -130, y: -165 };   // root の消失点（画面中心から）
const VP_CHILD = { fx: 1, fy: 1 };      // 子の空間の消失点（余白の内側の半幅・半高に対する割合、左上へ）。1 以下＝箱の中
const PULL = 48;                // 空間の外へ「大きく」引き出したとみなす距離（画面 px）
const FONT = '-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif';
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

/* ── ③ くっつける（スナップ＝見えない親の並び）── */
const SNAP_EDGE = 24;           // 縁どうしがこの距離（画面 px）以内なら「くっつける」
const SNAP_OVERLAP = 0.4;       // 直交方向に、小さい方の長さのこの割合以上重なっていること
const SNAP_GAP = 0;             // 見えない親の「詰める」の隙間（縁が接する）
const RING = 12;                // 見えない親の縁（外周）の掴める幅
/** ③ 見えない親は体を持たない：ヘッダも余白も無く、箱はどの並べ方でも中身ぴったり */
const headOf = b => b && b.implicit ? 0 : HEADER;
const padOf = b => b && b.implicit ? 0 : PAD;

/** 次元：泡 → 値。write はドラッグでその軸に何が起きるか（null＝書けない＝視点が動く） */
const DIMS = {
  "none":           { label: "なし",       write: null,      read: () => 0 },
  "free.x":         { label: "自由X",      write: "coord",   key: "x",   read: b => b.free.x },
  "free.y":         { label: "自由Y",      write: "coord",   key: "y",   read: b => b.free.y },
  "free.z":         { label: "自由Z",      write: "coord",   key: "z",   read: b => b.free.z },
  "order":          { label: "順序",       write: "reorder",             read: b => b.order },
  "col":            { label: "列",         write: "cell",    key: "col", read: b => b.cell.col },
  "row":            { label: "行",         write: "cell",    key: "row", read: b => b.cell.row },
  "history.index":  { label: "履歴の世代", write: null,                  read: b => b.hist },
  // ★ derived 次元は「どの空間の履歴か」を知っている（v2 で踏んだ）
  "history.age":    { label: "履歴の古さ", write: null,                  read: (b, space) => maxHistIn(space) - b.hist },
  "history.branch": { label: "履歴の枝",   write: null,                  read: b => b.branch },
};
/** 軸に刺さった次元で、ドラッグが何をするか："coord" | "reorder" | "cell" | "focus" | "none" */
const verbOf = dimId => dimId === "none" ? "none" : (DIMS[dimId].write ?? "focus");

/**
 * ★ 触った泡は最前面へ ── その空間の Z 軸の次元が書けるなら、そこへ書く。
 *
 *   もとは stack（置いた順）という View の外の状態で上下を決めていた。
 *   これは公理の中に戻せる：「手前」は奥行きのことなので、Z 軸に書けばよい。
 *
 *     Z が 順序      … 最前面（0）へ並べ替えて詰め直す。値は 0.. に収まるので、何度触ってもずれていかない
 *     Z が 自由座標  … 一番手前の兄弟の手前へ。ただし同じ値で重なっている兄弟は、座標では上下が決まらない
 *                      （重なりの上下を View で決めたいなら、Z には順序を刺す）
 *     Z が 履歴・なし … 書けないので上がらない。履歴の並びは、触っても順番が変わらない
 */
function raise(b) {
  const space = b.parent ?? "root";
  const A = viewOf(space).z, verb = verbOf(A.dim);
  const sibs = kidsOf(space).filter(k => k !== b);
  if (verb === "reorder") {
    [b, ...sibs.sort((q, r) => q.order - r.order)].forEach((k, i) => { k.order = i; });
  } else if (verb === "coord") {
    // 自由座標の Z では「最前面」を表せない。透視は焦点より手前（dz<0）を消すので、
    // 焦点の面にいる兄弟の「さらに手前」へ書くと、触った泡そのものが消える（実測：alpha 0）。
    // だから書けるのは焦点の面まで。そこは兄弟と同じ面で、上下は決まらない（§3 の表）
    const key = DIMS[A.dim].key, f = focusZ(space);         // ③ 見えない親の Z は外の窓のもの
    const front = Math.min(b.free[key], ...sibs.map(k => k.free[key]));
    const to = Math.max(f, front - (A.step ?? 1) * 0.15);
    if (b.free[key] > to) b.free[key] = to;
  }
}

const ARRANGES = { "as-is": "そのまま", equal: "等間隔", pack: "詰める" };

/** X/Y のレンズ：u（位置 − 焦点）→ 画面 s と局所倍率 k。1次元なので逆関数が必ずある。H は空間の半幅 */
const TANH_EDGE = 1 - 1e-12;    // tanh が浮動小数で 1 に張り付く手前（|u| ≲ 14H まで往復が合う）
const LENS_XY = {
  parallel: { label: "平行", project: (u, H) => ({ s: u, k: 1 }), unproject: (s, H) => s },
  fisheye:  { label: "魚眼",
    project: (u, H) => { const t = u / H, c = Math.cosh(t); return { s: H * Math.tanh(t), k: 1 / (c * c) }; },
    unproject: (s, H) => H * Math.atanh(clamp(s / H, -TANH_EDGE, TANH_EDGE)) },
};
/** Z のレンズ：dz（位置 − 焦点）→ 倍率 m と透明度。XY は消失点へ m で寄せる */
const LENS_Z = {
  perspective: { label: "透視",
    // d → 0 は目の位置（dz = −1/0.26）。そこより手前は写らないので、式が発散しないように止めるだけ
    mag: dz => 1 / Math.max(0.05, 1 + K_PERSP * dz),
    alpha: dz => dz < -1e-9 ? 0 : 1 },    // 焦点より手前（dz<0）は消す（第1版 制約02）。薄れて見えるのは補間だけ
  flat: { label: "平行", mag: () => 1, alpha: () => 1 },
};
const lensLabel = (axis, id) => (axis === "z" ? LENS_Z : LENS_XY)[id].label;

/* ============================================================
   プリセット＝View の型。どれも「軸ごとの 次元・並べ方・レンズ」だけ
   ============================================================ */
const AX = (dim, arrange, lens, step) => ({ dim, arrange, lens, step });
const PRESETS = {
  free:      { label: "自由に置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("free.z", "as-is", "perspective", 1) },
  row:       { label: "横に並べる",     x: AX("order", "pack", "parallel", 110),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  column:    { label: "縦に並べる",     x: AX("none", "pack", "parallel", 110),         y: AX("order", "pack", "parallel", 80),           z: AX("none", "as-is", "flat", 1) },
  grid:      { label: "格子",           x: AX("col", "pack", "parallel", 110),          y: AX("row", "pack", "parallel", 80),             z: AX("none", "as-is", "flat", 1) },
  fisheyeX:  { label: "X魚眼ビュー",    x: AX("history.index", "equal", "fisheye", 64), y: AX("history.branch", "equal", "parallel", 44), z: AX("none", "as-is", "flat", 1) },
  coverflow: { label: "coverflow",      x: AX("order", "equal", "fisheye", 68),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  histZ:     { label: "履歴を奥行きに", x: AX("none", "as-is", "parallel", 110),        y: AX("none", "as-is", "parallel", 80),           z: AX("history.age", "equal", "perspective", 1) },
  // ★ 重なりの上下を View の中で決めたいなら、Z に「順序」を刺す。触った泡が最前面（順序 0）へ並べ替わる。
  //   自由座標のままだと、同じ値で重なった兄弟の上下は決まらない（座標は同点を許すので）
  stackZ:    { label: "重ねて置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("order", "equal", "perspective", 0.15) },
};
const viewFromPreset = id => { const p = PRESETS[id]; return { x: { ...p.x }, y: { ...p.y }, z: { ...p.z } }; };
/**
 * ③ 見えない親の View。縁の軸は 順序·詰める·平行（隙間 0 ＝ 縁が接する）、もう一方は なし·詰める（始端ぞろえ）。
 * Z は書かない ── 軸まるごと外の窓のもの（viewOf が差し替える）
 */
const snapView = axis => {
  const along = { dim: "order", arrange: "pack", lens: "parallel", step: 110, gap: SNAP_GAP };
  const cross = { dim: "none",  arrange: "pack", lens: "parallel", step: 80,  gap: SNAP_GAP };
  return { x: axis === "x" ? along : cross, y: axis === "y" ? along : cross };
};

/* ============================================================
   状態：泡と root。関係は無い。親子だけ
   ------------------------------------------------------------
   焦点は View の型に入れず、空間（泡）そのものに持たせる。
   View は継げるが、焦点は継がない（§4）——その境目をデータの形に出すため。
   ============================================================ */
const ROOT = { id: "root", title: "外の空間", hue: null, view: viewFromPreset("free"), focus: { x: 0, y: 0, z: 0 } };
const bubbles = [];
const BYID = new Map();
const byId = id => BYID.get(id);

function add(p) {
  const b = {
    id: p.id, title: p.title, hue: p.hue,
    size: { w: p.w, h: p.h },
    parent: p.parent ?? null,
    free: { x: 0, y: 0, z: 0, ...p.free },
    order: p.order ?? 0,
    cell: { col: 0, row: 0, ...p.cell },
    hist: p.hist ?? 0, branch: p.branch ?? 0,
    view: p.view ? (typeof p.view === "string" ? viewFromPreset(p.view) : p.view) : null,
    implicit: !!p.implicit,               // ③ スナップで生まれた見えない親か
    focus: { x: 0, y: 0, z: 0 },          // この泡が空間を持つとき、その空間の「いまどこを見ているか」
  };
  bubbles.push(b); BYID.set(b.id, b);
  return b;
}
function removeBubble(b) { bubbles.splice(bubbles.indexOf(b), 1); BYID.delete(b.id); anim.delete(b.id); }

/* ── 場面 1. メモ：自由に置いた普通の泡 ── */
add({ id: "memo1", title: "メモ",     hue: 35, w: 130, h: 80, free: { x: -625, y: -338 } });
add({ id: "memo2", title: "買い物",   hue: 60, w: 130, h: 80, free: { x: -482, y: -290 } });
add({ id: "memo3", title: "思いつき", hue: 15, w: 130, h: 80, free: { x: -615, y: -237 } });

/* ── 場面 2. 横に並べる：大きさの違う3つ。「詰める」なので隙間がそろう ── */
add({ id: "row", title: "横に並べる", hue: 170, w: 368, h: 130, free: { x: -215, y: -315 }, view: "row" });
[["小", 80, 50], ["中", 104, 64], ["大", 128, 78]].forEach(([t, w, h], i) =>
  add({ id: "row" + i, title: t, hue: 158 + i * 20, w, h, parent: "row", order: i, free: { x: (i - 1) * 120, y: 0 } }));

/* ── 場面 3. coverflow：順序を等間隔に並べ、X に魚眼 ── */
add({ id: "cover", title: "coverflow", hue: 205, w: 340, h: 124, free: { x: 150, y: -318 }, view: "coverflow" });

let selectedId = "memo1";
let IMPLICIT_N = 0;             // 見えない親の番号

/* ============================================================
   木：親子だけ
   ============================================================ */
let KIDS = new Map();
function reindex() {
  KIDS = new Map([["root", []]]);
  for (const b of bubbles) {
    const p = b.parent ?? "root";
    if (!KIDS.has(p)) KIDS.set(p, []);
    KIDS.get(p).push(b);
  }
}
const kidsOf = id => KIDS.get(id) ?? [];
const spaceObj = id => id === "root" ? ROOT : byId(id);
const parentOf = id => id === "root" ? null : (byId(id).parent ?? "root");
/** 空間を持つ泡：自前の View を持つか、中に泡がいる */
const isHost = b => b.view !== null || kidsOf(b.id).length > 0;
const maxHistIn = spaceId => Math.max(0, ...kidsOf(spaceId).map(b => b.hist));
function isAncestor(a, id) {             // a は id の先祖（id 自身も含む）か
  for (let cur = id; cur; cur = parentOf(cur)) if (cur === a) return true;
  return false;
}
function subtreeOf(id) {
  const s = new Set([id]);
  const walk = x => kidsOf(x).forEach(k => { s.add(k.id); walk(k.id); });
  walk(id);
  return s;
}
const spaceName = id => id === "root" ? "外の空間" : byId(id).implicit ? "並び（見えない親）" : `${byId(id).title}の中`;
const spaceHsl = id => id === "root" ? "#e6ebf5" : byId(id).implicit ? "#cdd8ee" : `hsl(${byId(id).hue} 70% 66%)`;
/**
 * ③ 見えない親は体を持たないので「窓」でもない。外へたどって最初に見つかる本物の空間が、その並びの窓。
 * Z は軸まるごと窓のもの（次元・並べ方・レンズ・焦点のぜんぶ）。View を選ぶのも、空間の出入りを数えるのも窓
 */
const windowOf = id => { let s = id; while (s !== "root" && byId(s) && byId(s).implicit) s = parentOf(s); return s; };
const focusZ = id => spaceObj(windowOf(id)).focus.z;
/** その泡を入れている見えない親（なければ null） */
const rowOf = id => { const q = id === "root" ? null : byId(byId(id).parent); return q && q.implicit ? q : null; };

/* ============================================================
   §4 継承：並べ方は外から継ぐ。焦点は継がない
   ============================================================ */
function viewOf(spaceId) {
  const sp = spaceObj(spaceId);
  const src = sp.view ?? viewOf(parentOf(spaceId));
  // ③ 見えない親の Z は軸まるごと窓のもの。焦点だけ通すと、並びの中だけ透視が残って同じ泡が並びの中と外で別の大きさになる

/** 次元に合う並べ方。「そのまま」は px を持つ次元（自由）だけに意味がある */
function fitArrange(dimId, arrange) {
  const verb = verbOf(dimId);
  if (verb === "coord") return "as-is";
  if (verb === "none") return arrange;
  if (arrange !== "as-is") return arrange;
  return dimId.startsWith("history.") ? "equal" : "pack";
}

/** 軸セレクタ：その空間に自前の View を持たせてから変える（継いでいたなら、いまの見え方を写し取る） */
function setAxis(spaceId, axis, patch) {
  spaceId = windowOf(spaceId);            // ③ 見えない親は View を選べない。セレクタは外の窓へ回る
  const sp = spaceObj(spaceId);
  if (!sp.view) { const v = viewOf(spaceId); sp.view = { x: v.x, y: v.y, z: v.z }; }
  const A = sp.view[axis];
  Object.assign(A, patch);
  if (patch.dim && !patch.arrange) A.arrange = fitArrange(A.dim, A.arrange);
}
function applyPreset(name, spaceId) {
  const id = PRESETS[name] ? name : Object.keys(PRESETS).find(k => PRESETS[k].label === name);
  if (!id) throw new Error("プリセットが無い: " + name);
  spaceId = windowOf(spaceId);            // ③ プリセットも外の窓へ回る（並びに当てると中の泡が飛ぶ）
  const sp = spaceObj(spaceId);
  sp.view = viewFromPreset(id);
  Object.assign(sp.focus, { x: 0, y: 0, z: 0 });

function inheritView(spaceId) { spaceId = windowOf(spaceId); if (spaceId !== "root") spaceObj(spaceId).view = null; }

/* ============================================================
   §2 並べ方：値 → 空間の中での位置（泡の中心。原点は中身の箱の中心）
   ============================================================ */
function arrangeAxis(A, kids, axis, spaceId, sizeOf) {
  const dim = DIMS[A.dim];
  const val = b => dim.read(b, spaceId);
  const len = b => axis === "x" ? sizeOf(b).w : sizeOf(b).h;
  const pos = new Map(), bands = [];
  const values = [...new Set(kids.map(val))].sort((p, q) => p - q);
  const gap = A.gap ?? GAP;               // ④ 隙間は View の軸が持つ（見えない親は 0＝縁が接する）
  let mid = 0;

  if (axis === "z") {                              // Z は中央ぞろえしない（焦点 0 ＝ 手前）
    for (const b of kids) {
      const v = val(b);
      pos.set(b.id, A.arrange === "equal" ? v * A.step : A.arrange === "pack" ? values.indexOf(v) : v);
    }
  } else if (A.arrange === "as-is") {
    for (const b of kids) pos.set(b.id, val(b));
  } else if (A.arrange === "equal") {
    // 塊の中央を空間の中心に。塊は pack と同じく泡の端から端（値×間隔は泡の中心なので、中心どうしの中点だと
    // 端の泡の大きさが違うときずれる）
    let lo = Infinity, hi = -Infinity;
    for (const b of kids) { const c = val(b) * A.step; lo = Math.min(lo, c - len(b) / 2); hi = Math.max(hi, c + len(b) / 2); }
    if (kids.length) mid = (lo + hi) / 2;
    for (const b of kids) pos.set(b.id, val(b) * A.step - mid);
    for (const v of values) bands.push({ value: v, start: v * A.step - mid - A.step / 2, end: v * A.step - mid + A.step / 2 });
  } else {                                          // pack：値ごとの帯。帯の幅はその値を持つ泡の最大
    let total = -gap;
    const bandLen = new Map();
    for (const v of values) {
      const l = Math.max(...kids.filter(b => val(b) === v).map(len));
      bandLen.set(v, l); total += l + gap;
    }
    let at = -Math.max(0, total) / 2;
    for (const v of values) { bands.push({ value: v, start: at, end: at + bandLen.get(v) }); at += bandLen.get(v) + gap; }
    for (const b of kids) {
      const bd = bands.find(x => x.value === val(b));
      // ④ 帯の中の揃えは、隙間と同じく View の軸が持つ値（既定は始端）。
      //   等間隔の帯は「中心が 値×間隔・幅が 間隔」なので、泡はいつも帯の中央に来る ── 揃えが効くのは詰めるだけ
      pos.set(b.id, A.align === "center" ? (bd.start + bd.end) / 2 : bd.start + len(b) / 2);
    }
  }
  return { pos, bands, mid, gap };
}

/**
 * ① 泡の像 ── 1つの泡を、その軸のレンズで写す（画面の位置 s と、その泡の倍率 k）。
 *   泡の左端と右端をレンズに通し、その間に泡を描く：k ＝ 像の幅 ÷ 自前の幅、s ＝ 像の中点。
 *   中心1点の局所倍率で一様に縮めると、帯の像と泡の像が別の式で縮んで噛み合わない
 *   （v3/03 の実測：詰める×魚眼 の隙間 14 で端の隣と −1.7px 食い込む。泡の端を通すと 0）。
 *   レンズは1次元の単調な関数なので、これなら「位置が重ならない泡は像も重ならない」が言える
 */
function projectIn(arr, b, lens, H, f, len) {
  const p = arr.pos.get(b.id);
  if (!(len > 1e-9)) return lens.project(p - f, H);
  const s0 = lens.project(p - len / 2 - f, H).s, s1 = lens.project(p + len / 2 - f, H).s;
  return { s: (s0 + s1) / 2, k: (s1 - s0) / len };
}

/**
 * 箱の大きさ。「そのまま」の軸は自前の大きさ。
 * 等間隔・詰めるの軸は、レンズを通した中身が収まるまで伸びる（＋余白）。
 * 魚眼は箱の半幅で曲がるので、何度か当てて落ち着かせる。
 */
function measure(b, memo) {
  if (memo.has(b.id)) return memo.get(b.id);
  const box = { w: b.size.w, h: b.size.h };
  const kids = kidsOf(b.id), head = headOf(b), pad = padOf(b);
  if (kids.length) {
    const V = viewOf(b.id), sizeOf = k => measure(k, memo);
    for (const axis of ["x", "y"]) {
      const A = V[axis];
      // ③ 見えない親は自前の大きさを持たないので、どの並べ方でも箱は中身ぴったり（「そのままの軸は自前」は体のある泡の話）
      if (A.arrange === "as-is" && !b.implicit) continue;
      const ar = arrangeAxis(A, kids, axis, b.id, sizeOf);
      const lens = LENS_XY[A.lens];
      const ownHalf = Math.max(0, axis === "x" ? b.size.w : b.size.h - head) / 2;
      const halfLen = k => (axis === "x" ? sizeOf(k).w : sizeOf(k).h) / 2;
      let half = ownHalf;
      for (let n = 0; n < 60; n++) {                 // H＝箱の半幅。魚眼では H と中身が互いに決まるので落ち着くまで
        const H = Math.max(1, half);
        let need = 0;
        for (const k of kids) { const p = projectIn(ar, k, lens, H, 0, halfLen(k) * 2); need = Math.max(need, Math.abs(p.s) + halfLen(k) * p.k); }
        const next = Math.max(ownHalf, need + pad);
        if (Math.abs(next - half) < 1e-6) { half = next; break; }
        half = next;
      }
      if (axis === "x") box.w = half * 2; else box.h = half * 2 + head;
    }
  }
  memo.set(b.id, box);
  return box;
}

/** 空間（中身の箱）の半幅。魚眼の像は箱いっぱい */
const halfOf = host => ({ x: Math.max(1, host.w / 2), y: Math.max(1, host.h / 2) });

/**
 * レンズの ctx。★ 目の位置を足すならここ1か所（vp や focus をずらした写しを返す。状態には書き込まない）
 * focus は写しで渡る。焦点を動かす操作はこの ctx に書かず、状態へ「u（位置 − 焦点）の変化の分」を書く（setFocusAxis の上）ので、
 * ここで焦点をずらしても操作は壊れない

 * 寄せた像は「元の像と消失点を結ぶ範囲」にあり、X/Y で箱に収まった中身は Z をかけても箱に収まる（measure・focusFits は Z を見なくてよい）

function lensCtx(spaceId, host, focus) {
  const H = halfOf(host);

    focus: { ...focus },
    H,
    vp: spaceId === "root" ? { ...ROOT_VP }
      : { x: -Math.max(0, H.x - padOf(byId(spaceId))) * VP_CHILD.fx, y: -Math.max(0, H.y - padOf(byId(spaceId))) * VP_CHILD.fy },
  };
}

/* ============================================================
   §2 解く順番（1フレーム）
   ============================================================ */
let frameItems = [];            // 描いた順の配置（画面座標）
let PLACE = new Map();          // id → 配置
let LAYOUT = new Map();         // spaceId → { host, ctx, V, arr }（ドラッグの逆変換に使う）
const anim = new Map();         // id → 親の中身の座標での { x, y, scale, alpha, w, h }。補間はここだけ
const EASE = 0.2;
let drag = null;

function ease(id, target, mode) {
  let a = anim.get(id);
  if (!a || mode === "snap") { a = { ...target }; anim.set(id, a); return a; }
  if (mode === "keep") return a;                 // 補間を進めずに配置だけ解く（⑤ 付け替えの前後で測るため）
  for (const k in target) a[k] += (target[k] - a[k]) * EASE;
  return a;

/** ★ 合成はここ1回だけ。深さ n でも scale は数値1つ */
function compose(host, a) {
  const scale = host.scale * a.scale;
  const w = a.w * scale, h = a.h * scale;
  return { x: host.cx + a.x * host.scale - w / 2, y: host.cy + a.y * host.scale - h / 2, w, h, scale,
           alpha: host.alpha * a.alpha };

/** 空間を持つ泡の配置 → その中身の箱（子の空間の host）。vis は補間を通さないレンズの答え（見えるか） */
const contentOf = p => { const hd = headOf(p.b); return {
  cx: p.x + p.w / 2, cy: p.y + (hd + (p.box.h - hd) / 2) * p.scale,
  w: p.box.w, h: p.box.h - hd, scale: p.scale, alpha: p.alpha, vis: p.vis, depth: p.depth,

  const own = spaceId === "root" ? host : (m => ({ w: m.w, h: m.h - headOf(byId(spaceId)) }))(measure(byId(spaceId), memo));

  const sp = spaceObj(spaceId);

  const items = kids.map((b, i) => {
    const pos = { x: arr.x.pos.get(b.id), y: arr.y.pos.get(b.id), z: arr.z.pos.get(b.id) };
    const box = sizeOf(b);

    const py = projectIn(arr.y, b, ly, ctx.H.y, ctx.focus.y, box.h);
    // ③ 見えない親は奥行きに置かれない（体が無い）。中の泡の奥行きは、窓の焦点から測る
    const dz = b.implicit ? 0 : pos.z - ctx.focus.z, m = lz.mag(dz);   // そのあと Z で消失点へ寄せる
    const target = { x: ctx.vp.x + (px.s - ctx.vp.x) * m, y: ctx.vp.y + (py.s - ctx.vp.y) * m,
                     scale: m * Math.min(px.k, py.k), alpha: lz.alpha(dz), w: box.w, h: box.h };
