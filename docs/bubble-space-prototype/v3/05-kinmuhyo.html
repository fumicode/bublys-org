    zs.style.color = spaceHsl(win);
  }
  $("inherit").disabled = id === "root" || !V.own;
}
$("more").onclick = () => { const on = $("deep").hidden; $("deep").hidden = !on; $("more").classList.toggle("on", on); };
$("inherit").onclick = () => { inheritView(targetSpace()); lastSig = ""; };
$("refocus").onclick = () => { Object.assign(spaceObj(targetSpace()).focus, { x: 0, y: 0, z: 0 }); };
// ★ 留める（pin）を切って見せるトグル。なぜ要るのかが画面で分かるように
$("nopin").onclick = () => { PIN_ON = !PIN_ON; $("nopin").classList.toggle("on", !PIN_ON); lastSig = ""; };
{
  const hintEl = document.getElementById("hint"), DEFAULT = hintEl.innerHTML;
  for (const el of document.querySelectorAll("[data-hint]")) {
    el.addEventListener("mouseenter", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("focus", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("mouseleave", () => { hintEl.innerHTML = DEFAULT; });
  }
}

const panelCache = {};
function setHtml(id, html) { if (panelCache[id] !== html) { panelCache[id] = html; document.getElementById(id).innerHTML = html; } }
function updatePanels() {
  setHtml("spaces", spacesHtml()); setHtml("selection", selectionHtml()); syncToolbar();
  if (hintAt && !drag) showCursorHint(hintAt.mx, hintAt.my);
}

/* ============================================================
   ループ
   ============================================================ */
function frame() { resolveAll("step"); draw(); updatePanels(); }
function settle() { resolveAll("snap"); resolveAll("snap"); draw(); updatePanels(); }
function loop() { frame(); requestAnimationFrame(loop); }

/* ============================================================
   §6 検証用の口（座標はページのビューポート座標）
   ============================================================ */
const offset = () => { const r = cv.getBoundingClientRect(); return { x: r.left, y: r.top }; };
const outPlace = p => { const o = offset();
  return { id: p.id, x: p.x + o.x, y: p.y + o.y, w: p.w, h: p.h, scale: p.scale, local: p.local, depth: p.depth, space: p.space, alpha: p.alpha,
           implicit: p.b.implicit }; };
window.__lab = {
  select(id) { selectedId = id; lastSig = ""; },
  selectedId: () => selectedId,
  bubbles: () => JSON.parse(JSON.stringify(bubbles)),
  viewOf: id => { const v = viewOf(id); return JSON.parse(JSON.stringify({ x: v.x, y: v.y, z: v.z, align: v.align, size: v.size, focus: v.focus, own: v.own })); },
  setAxis(spaceId, axis, patch) { setAxis(spaceId, axis, patch); lastSig = ""; },
  setView(spaceId, patch) { setView(spaceId, patch); lastSig = ""; },
  preset(name, spaceId) { applyPreset(name, spaceId ?? targetSpace()); lastSig = ""; },
  presetOf: id => presetOf(id),
  placements: () => frameItems.map(outPlace),
  rectOf(id) { const p = PLACE.get(id); if (!p) return null; const o = outPlace(p); return { x: o.x, y: o.y, w: o.w, h: o.h }; },
  /** ヘッダの中で、実際にその泡に当たる点（手前の泡に隠れていない点）を探す */
  headerPointOf(id) {
    const p = PLACE.get(id); if (!p) return null;
    if (p.b.implicit) return this.edgePointOf(id);
    const o = offset(), y = p.box.h <= 34 ? p.y + p.h / 2 : p.y + Math.min(12 * p.scale, p.h / 2);
    for (const t of [0.35, 0.5, 0.2, 0.65, 0.8, 0.1, 0.9]) {
      const x = p.x + p.w * t, hit = hitTest(x, y);
      if (hit && hit.id === id && !inContent(hit, y)) return { x: x + o.x, y: y + o.y };
    }
    return { x: p.x + p.w * 0.35 + o.x, y: y + o.y };
  },
  focusOf: id => ({ ...spaceObj(id).focus }),
  layoutOf(id) { const L = LAYOUT.get(id); return L && { host: L.host, H: L.ctx.H, vp: L.ctx.vp }; },
  frame() { frame(); },
  settle() { settle(); },
  setPin(on) { PIN_ON = !!on; },
  pinOn() { return PIN_ON; },
  // ── 案1で足したもの ──
  /** R1・R2 をドラッグなしで当てる。side は "left" | "right" | "top" | "bottom"（id を target のどちら側へ） */
  snap(id, target, side) {
    const axis = side === "left" || side === "right" ? "x" : "y", after = side === "right" || side === "bottom";
    const row = rowOf(target), join = !!row && verbOf(viewOf(row.id)[axis].dim) === "reorder";
    reshape(() => snapOp(byId(id), { kind: join ? "join" : "born", target, axis, after }));
  },
  /**
   * 見えない親の縁（外周）で、実際にその並びに当たる点。
   * 入れ子の並びは左上がそろうので、外の並びの縁は内の並びの縁に食われる（内側・手前が勝つ）。
   * headerPointOf と同じく、当たる点を順に探す
   */
  edgePointOf(id) {
    const p = PLACE.get(id); if (!p) return null;
    const o = offset(), h = RING / 2;
    for (const t of [0.5, 0.75, 0.25, 0.9, 0.1, 1, 0])
      for (const c of [{ x: p.x + p.w * t, y: p.y - h }, { x: p.x + p.w + h, y: p.y + p.h * t },
                       { x: p.x + p.w * t, y: p.y + p.h + h }, { x: p.x - h, y: p.y + p.h * t }]) {
        const hit = hitTest(c.x, c.y);
        if (hit && hit.id === id) return { x: c.x + o.x, y: c.y + o.y };
      }
    return { x: p.x + p.w * 0.5 + o.x, y: p.y - h + o.y };
  },
  rowOf: id => rowOf(id)?.id ?? null,
  implicitParents: () => bubbles.filter(b => b.implicit).map(b => ({ id: b.id, parent: b.parent, kids: kidsOf(b.id).slice().sort(byOrder).map(k => k.id), view: JSON.parse(JSON.stringify(b.view)) })),
  /** 補間を1フレーム進めずに、いまの状態で配置だけ解き直す */
  keep() { resolveAll("keep"); },
  dragState: () => drag && drag.slot ? { id: drag.id, space: drag.space, slot: { space: drag.slot.space, out: drag.slot.out, snap: drag.slot.snap ?? null } } : null,
  hitAt(x, y) { const o = offset(), p = hitTest(x - o.x, y - o.y); return p ? p.id : null; },
  /** いま描いた字（見えない親の名前・注記）の矩形と、泡・ほかの字との重なり（cost、px²） */
  labels() { const o = offset(); return PLACED_LABELS.map(l => ({ ...l, x: l.x + o.x, y: l.y + o.y })); },
};

resize();
settle();
// 場面：希望シフトは勤務表の右、世界線は勤務表の下。どちらもドラッグと同じ決まり4（snapOp → reshape）で並べる。
// 2回目は勤務表がもう並びの中にいるので、並びの中に並び（縦）が入れ子で生まれる
reshape(() => snapOp(byId("kibou"), { kind: "born", target: "kinmu", axis: "x", after: true }));
settle();
reshape(() => snapOp(byId("sekai"), { kind: "born", target: "kinmu", axis: "y", after: true }));
settle();
requestAnimationFrame(loop);
</script>
</body>
</html>
