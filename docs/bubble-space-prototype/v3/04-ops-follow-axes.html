<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bubble-lab v3 · 04 操作は軸に従う</title>
<style>
  :root{--bg:#0b0d14;--panel:#141824;--line:#2a3145;--fg:#e6ebf5;--dim:#8b95ad;--accent:#6ee7ff;
    --move:#7ee2a8;--fix:#ff9db1;--own:#ffd479}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  #bar{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--line);
    padding:6px 12px 3px;display:flex;flex-direction:column;gap:5px}
  .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .lbl{color:var(--dim);font-size:11px;letter-spacing:.04em;white-space:nowrap;margin-right:2px}
  .axis{color:var(--fg);font-size:12px;font-weight:600;margin:0 2px 0 10px}
  select,button{background:#1d2334;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}
  select:hover,button:hover{border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default;border-color:var(--line)}
  button.on{background:var(--accent);color:#07202a;border-color:var(--accent);font-weight:600}
  .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
  #axis-scope{font-size:12px;font-weight:600;color:var(--fg)}
  #hint{color:var(--dim);font-size:11px;min-height:19px;padding-top:2px;border-top:1px dashed var(--line)}
  #hint b{color:var(--accent);font-weight:600}
  #stage{flex:1 1 auto;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  .box{position:absolute;background:rgba(10,12,20,.88);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;color:var(--dim);font-size:11px;line-height:1.65;pointer-events:none}
  .grp{color:var(--own);font-size:11px;font-weight:600;white-space:nowrap;margin:0 1px 0 2px}
  #side{position:absolute;right:12px;top:12px;width:256px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  #side .box{position:static}
  .t{color:var(--fg);font-weight:600;letter-spacing:.04em}
  .sp{margin-top:3px}
  .nm{font-weight:600}
  .axs{padding-left:14px}
  .ax{display:inline-block;margin-right:10px;white-space:nowrap}
  .ax i{font-style:normal;color:var(--fg);opacity:.75;margin-right:3px}
  .own{color:var(--own)} .inh{color:var(--dim);font-style:italic}
  .move{color:var(--move)} .fix{color:var(--fix)} .cur{color:var(--accent)}
  .who{color:var(--fg);font-weight:600}
  #selection .k{display:inline-block;width:88px}
  #cursor-hint{left:0;top:0;white-space:pre;display:none;z-index:5;background:rgba(8,10,17,.95);border-color:#3a4560}
  #help{left:12px;bottom:12px}
  #help b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="row">
      <span class="lbl">プリセット</span>
      <button data-preset="free" data-hint="選択中の泡がいる空間を <b>自由に置く</b> に。X・Y は自由座標そのまま、Z は透視。中の泡を掴むと動く">自由に置く</button>
      <button data-preset="row" data-hint="選択中の泡がいる空間を <b>横に並べる</b> に。X は順序を詰めて並べる。掴むと並べ替わる">横に並べる</button>
      <button data-preset="column" data-hint="選択中の泡がいる空間を <b>縦に並べる</b> に。Y は順序を詰めて並べる。掴むと並べ替わる">縦に並べる</button>
      <button data-preset="grid" data-hint="選択中の泡がいる空間を <b>格子</b> に。X は列、Y は行を詰めて並べる。掴むと別のマスへ移る">格子</button>
      <button data-preset="fisheyeX" data-hint="選択中の泡がいる空間を <b>X魚眼ビュー</b> に。X は履歴の世代を魚眼で、Y は履歴の枝を平行で。掴むと視点が動く">X魚眼ビュー</button>
      <button data-preset="coverflow" data-hint="選択中の泡がいる空間を <b>coverflow</b> に。X は順序を等間隔に魚眼で。背景を横に引くとスライドする">coverflow</button>
      <button data-preset="histZ" data-hint="選択中の泡がいる空間を <b>履歴を奥行きに</b>。Z は履歴の古さを透視で。ホイールで時間を行き来する">履歴を奥行きに</button>
      <button data-preset="mixed" data-hint="選択中の泡がいる空間を <b>混ざった軸</b> に。X は順序を詰めて（並べ替わる）、Y は自由（動く）、Z はなし">混ざった軸</button>
      <button data-preset="stackZ" data-hint="選択中の泡がいる空間を <b>重ねて置く</b> に。X・Y は自由、<b>Z は順序</b>。泡を触ると最前面へ並べ替わる（重ねた紙のように）">重ねて置く</button>
      <span class="sep"></span>
      <button id="inherit" data-hint="選択中の泡がいる空間の自前の View を捨てて、<b>外の空間の並べ方を継ぐ</b>（焦点は継がない）">外から継ぐ</button>
      <button id="refocus" data-hint="選択中の泡がいる空間から <b>外の空間まで</b>、道筋の焦点をぜんぶ 0 に戻す（外側の空間が見えないと中の泡も見えないので）">焦点を戻す</button>
    </div>
    <div class="row">
      <span id="axis-scope" data-hint="軸セレクタが効く空間。<b>選択中の泡がいる空間</b>">外の空間 の</span>
      <span class="axis">X</span>
      <select data-axis="x" data-part="dim" data-hint="横に何を読むか。<b>自由</b>＝動く／<b>順序</b>＝並べ替わる／<b>列・行</b>＝マスを移る／<b>履歴</b>＝視点が動く／なし＝何も起きない"></select>
      <select data-axis="x" data-part="arrange" data-hint="値を位置にする決め方。<b>そのまま</b>＝px／<b>等間隔</b>＝値×間隔／<b>詰める</b>＝値ごとの帯を隙間 14px で並べる"></select>
      <select data-axis="x" data-part="lens" data-hint="横の位置を画面に写す式。<b>平行</b>＝そのまま／<b>魚眼</b>＝焦点の近くを大きく、端を詰める"></select>
      <span class="axis">Y</span>
      <select data-axis="y" data-part="dim" data-hint="縦に何を読むか。自由＝動く／順序＝並べ替わる／列・行＝マスを移る／履歴＝視点が動く"></select>
      <select data-axis="y" data-part="arrange" data-hint="値を位置にする決め方。そのまま＝px／等間隔＝値×間隔／詰める＝値ごとの帯"></select>
      <select data-axis="y" data-part="lens" data-hint="縦の位置を画面に写す式。平行／魚眼"></select>
      <span class="axis">Z</span>
      <select data-axis="z" data-part="dim" data-hint="奥行きに何を読むか。<b>なし</b>ならホイールは何もしない"></select>
      <select data-axis="z" data-part="arrange" data-hint="奥行きの値の決め方。そのまま／等間隔（値×間隔）／詰める（値の順位）"></select>
      <select data-axis="z" data-part="lens" data-hint="奥行きの写し方。<b>透視</b>＝消失点へ寄せて小さく／<b>平行</b>＝奥行きを見た目に使わない"></select>
    </div>
    <div class="row">
      <span class="lbl">比べる</span>
      <span class="grp">斜めに引く（横と縦で違う操作の空間）</span>
      <button data-opt="diag" data-val="each" data-hint="横は横の軸、縦は縦の軸に、<b>同時に別々に</b>効かせる。混ざった軸を斜めに引くと、並べ替わりながら縦にも動く（土台と同じ）">軸ごとに別々</button>
      <button data-opt="diag" data-val="lock" data-hint="<b>6px 動いたところで横か縦かを決め</b>、離すまでその軸だけに効かせる。混ざった軸のように横と縦で違う操作になる空間だけ">動き始めの方向でロック</button>
      <span class="sep"></span>
      <span class="grp">焦点Zが泡の面を越えたら</span>
      <button data-opt="cross" data-val="hide" data-hint="焦点より手前（dz&lt;0）の泡は<b>消す</b>（土台と同じ）。同じ面の泡はまとめて消える">消す</button>
      <button data-opt="cross" data-val="stopFree" data-hint="Z が<b>自由Z</b>の空間は、焦点を<b>一番手前の面で止める</b>（泡は消えない）。履歴の奥行きは越えてよい（時間を行き来する）">自由Zは手前の面で止める</button>
      <button data-opt="cross" data-val="fade" data-hint="越えた面は消さずに<b>薄くするだけ</b>（掴めない）。透視の倍率はそのまま（手前へ大きくなる）">薄くするだけ</button>
      <span class="sep"></span>
      <span class="grp">Zなしの空間でホイール</span>
      <button data-opt="zNone" data-val="nothing" data-hint="Z が なし の空間の上では<b>何もしない</b>（土台と同じ）">何もしない</button>
      <button data-opt="zNone" data-val="pass" data-hint="Z が なし なら、<b>外の空間へ渡す</b>（Z を持つ一番近い外の空間の焦点が動く。Web の入れ子スクロールと同じ考え）">外の空間へ渡す</button>
    </div>
    <div id="hint">ボタンやセレクトにマウスを乗せると、ここに意味が出ます。</div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="side">
      <div class="box" id="spaces"></div>
      <div class="box" id="selection"></div>
    </div>
    <div class="box" id="cursor-hint"></div>
    <div class="box" id="help">
      同じ5つの泡（版1〜版5）を5つの空間に入れた。空間の中の表が、そこでの操作（泡／背景）<br>
      触る／横・縦に引く／ホイール … その軸が <b>書けるなら書く（掴んだときだけ）／書けないなら視点／なしなら何もしない</b><br>
      掴んでホイールすると奥へ動く（自由Z）。上の「比べる」で、斜め・面を越えたとき・Zなしを切り替える
    </div>
  </div>
</div>
<script>
"use strict";
/* ============================================================================
   bubble-lab v3 · 04 操作は軸に従う
   仕様：docs/bubble-space-prototype/v3/SPEC.md（語彙・画面の約束はそこが正）。土台：00-core.html（土台で踏んだことはそちら）

   公理（案）
     泡の見え方は、その泡を入れている親の View で決まる。View は軸（X・Y・Z）ごとに「次元」「並べ方」「レンズ」を持つ。入れ子ごとに繰り返す。
     操作は軸に従う：泡を掴んで横・縦に引くと、その軸の次元が 書けるなら書く／書けないなら視点が動く／なしなら何もしない。
     ホイールは奥行き（Z）の視点。
     触るのも軸に従う：触った泡は、その空間の Z 軸の次元が書けるなら、そこへ書く（＝手前へ）。

   この案で確かめること
     - 上の1文だけで、触る・ドラッグ・ホイールの全部が説明できるか。
       同じ中身の泡5つ（版1〜版5）を 自由／順序／X魚眼／履歴を奥行きに／混ざった軸 の5つの空間に入れて横に並べ、
       各空間の中身の箱の上に「触る／泡・背景 × 横ドラッグ・縦ドラッグ／ホイール／よそへ引く」の表を、
       ルール（touchRule・dragRule・backgroundRule・wheelRule・crossRule）から毎フレーム出す
     - 「触る」の4通り（順序／自由座標／履歴／なし）が、5つの空間とプリセット「重ねて置く」で画面に出そろうか
     - 比べる（ツールバー3段目）：斜めに引く（軸ごとに別々／動き始めの方向でロック）、
       焦点Zが面を越えたら（消す／自由Zは手前の面で止める／薄くするだけ）、Zなしでホイール（何もしない／外の空間へ渡す）

   確かめたこと（検証：scratchpad の v3check/04-ops-follow-axes.build-check.mjs、61項目）
     - 5つの空間 × 横・縦・ホイール の15通りで、表の言葉と、本物のマウスで起きた変化が全部合った（第1回で背景の横・縦10通りも）。
       自由＝free.x／free.y／焦点Z、順序＝並べ替え（版1..5 → 版1,3,4,2,5）／なし／なし、X魚眼＝焦点X 0→−46／焦点Y 0→−17／なし、
       履歴を奥行きに＝なし／なし／焦点Z、混ざった軸＝並べ替え／free.y／なし
     - 混ざった軸を斜め (100,50) に引く：別々＝並べ替え＋free.y −60→−10。ロック＝並べ替えだけ。(30,90) をロック＝free.y −60→30 だけ。
       ロックは横と縦で違う操作の空間だけに効く（自由の斜めは両方動く）
     - 軸を変えると表も変わる（順序の Y を自由Y にすると「縦ドラッグ：泡 動く／背景 視点が動く」）
     - 外の空間の表も同じルールから出る（root を格子にすると「横ドラッグ 列を移る／縦ドラッグ 行を移る」に変わる）。
       表の字の上はどこでも外の空間（12点）で、そこでホイールすると表のとおり外の空間の焦点 Z が動く。
       真っ暗になっても表は残り、「焦点を戻す」で戻る（見出しの帯でホイールしたとき・奥のメモを選んだときも）

   踏んだこと（作って試して分かったこと）
     - 「なしなら何もしない」は箱の中だけだった。順序の泡を縦に 234px（箱の外まで）引くと、外の空間へ出た。
       書ける軸を1つでも持つ空間の泡は、どの方向でも箱の外まで引けば親が変わる（「泡が動くときだけ空間を移れる」は泡ごとの決まりで、軸ごとではない）。
       X魚眼（視点だけ）と履歴を奥行きに（書ける軸なし）は出ない。3行には書けていない
     - 「書けるなら書く」はホイールには効かない。自由Z は書ける次元なのに、泡の上でホイールしても焦点 Z が動くだけで free.z は変わらない。
       ホイールは掴まないので背景ドラッグと同じ「視点」。この操作の表には、自由の泡の Z を変える操作がどこにも無い
     - 外の空間の焦点 Z の奥の端は「一番奥の泡」なので、5つの空間が全部 z=0 だと、外へ渡しても焦点は 0 のまま（手前へ −1 だけ）で比べられなかった。
       外の空間に「奥のメモ」（z=1.5）を置いた
     - 外へ渡す × 消す：順序の上で1回ホイールすると、外の空間の焦点が進み、5つの空間（z=0 の同じ面）がカーソルの下の空間ごと全部消えた。
       外へ渡す × 自由Zは止める：外の空間も自由Zなので止まり、奥へは何も起きない。どちらも「渡した」ことが画面から読めない
     - 自由Zは手前の面で止める：自由の空間で泡は消えなくなるが、奥の面（z=1, 2）へは行けない。奥へ4回ホイールしても焦点 0、版5 は倍率 0.658 のまま。
       ホイールは「手前へ引いて戻る」だけになり、奥と手前に置いて行き来することはできない
     - 薄くするだけ：越えた面は透視の倍率のまま手前で大きくなる。履歴を一番古い版まで送ると、版5 は倍率 20（640×520px）の薄い板になり、
       版4 は画面の右下（パネルの下）まで飛んだ。自由を z=2 まで送ると、薄い版2・版4 は隣の「順序」の箱の下に潜って見えない（描く順が隣より先）。
       薄く残した泡は掴めないにした（版5 の薄い板の上からでも 版4 をクリックで選べる）
     - 3行が幅 212px に入らず、一番比べたい補足（越えたら消える）が落ちた。字を 10px にし、補足を短くした。
       外へ渡すの補足に空間の名前を入れると、幅 244 の空間には入って 212 には入らず、同じ操作で言葉が違ったので名前をやめた
     - 自由座標を箱の外に置いた版5（右端 112 > 半幅 106）は、奥にいる間は消失点へ寄って箱の中に見え、焦点を合わせたとたんに箱の外へ出た
       （そのまま の軸は箱が伸びない）。データを箱の中へ直した
     - 選択中の空間を示す破線が、その空間ごと消えたあとも残った（描くときに透明度を見ていなかった）。消えた空間には出さない

   踏んだこと（第1回の検証で見つかった穴を直して分かったこと）
     - 説明の字も、どこかの空間に置かれた物だった。3行を空間を持つ泡のヘッダ（72px に高くした）に書いていたので、
       「ホイール：何も起きない」の字の上でホイールすると外の空間の焦点 Z が動き、5つの空間がまとめて消えた（31 → 1。deltaY 4 でも）。
       同じ字の上で「縦ドラッグ：何も起きない」を引くと、空間ごと動いた。ヘッダは外の空間の場所なので、そこでの操作は外の空間の操作。
       字を、それが言う操作の効く空間（中身の箱）の中へ移した。表の字の上はどこでもカーソルの下がその空間（12点×5空間）で、ホイール・背景ドラッグは表のとおりになる。
       ヘッダは細い 24px に戻り、見出しの名前の上でホイールすると外の空間ごと消えるのは残る（土台の穴：同じ面をまとめて越える。カーソル脇にはそう出る）
     - 字を中身の箱に移すと、字の上を引くのは「背景を引く」になる。3行は泡を掴んだときの話しか書いていなかったので、
       自由の背景を横に引いて焦点が 40 動くのは「横ドラッグ：動く」と食い違った。「書けるなら書く」は掴んだ泡に書く話で、背景には書く先が無い。
       操作を決める入力は軸だけでなく「何を掴んだか」もあるので、表を 泡／背景 の2列にした（ホイールは掴まないので1つ）。
       5空間×横・縦の背景ドラッグが「背景」の列と合う。方向ロックは泡の列だけに効く（背景は横も縦も視点なので混ざらない）ので、列の見出しに出す
     - 方向ロックを「止めた軸には書かない」と、書く所ごとに足していた。空間を移るかどうかはカーソルの点で決まるので、止めた軸も効き、
       縦でロックして左へ 330px 引くと、泡は横に動かないのに離すと隣の X魚眼へ移った。空間を移るのは点の決まりで、軸の決まりではない
       （作ったときに踏んだ「書ける軸を1つでも持つと、どの方向でも箱の外で外へ出る」と同じ根）。
       ロックは入力の側で1回、止めた軸のポインタの成分を掴んだ点に留めることにした。書く・視点・空間を移る・印・泡がついてくる、が同じ点を読むので、
       止めた軸はどこにも効かない（左へ 330px：泡の横 0px、親 s5 のまま）。効いている軸で箱の外まで引けば、泡はついてきて外へ出る
     - 履歴を奥行きにの一番古い 版1 は倍率 0.49 で字が 5.9px になり、下限 6.5px で消えていた。字が読める奥行きは 12/(1+0.26·d) ≥ 6.5 で d ≤ 3.3 まで。
       5版を読ませるには間隔 0.8 以下、外の空間を手前へ 0.4 戻した分（0.906）も見込むと 0.65 以下。Z の等間隔の間隔を 1 → 0.6 にした
       （版1 7.4px、戻したとき 6.7px）。代わりに奥行きの差が縮み、1倍の画面では 版1 の字の下の端が 版2 に隠れる。外の空間を一番手前（−1）まで戻すと 5.9px で消える

   踏んだこと（独立検証の第1回で見つかった穴を直して分かったこと）
     - 表は「その空間の中身の箱の中」に描く決まりにしていたが、外の空間（root）には箱が無い（箱の外ぜんぶが root）ので、
       画面の半分以上と見出しの帯には常時見える表が無かった。そこで1回ホイールすると、同じ面の5空間が中身ごと消え（見える泡 31→1）、
       理由の書いてある所が画面のどこにも無かった。5つの箱の下の空き地に、同じ表を同じルールから描いた。
       その字の上の点も root なので（12点で確かめた）、そこでのホイール・背景ドラッグは表のとおりになる。表は泡ではないので、中身が全部消えても残る
     - 「焦点を戻す」で戻らなかったのは、ボタンが「選択中の泡がいる空間」1つだけを戻していたから。
       公理は「泡の見え方は親の View で決まり、入れ子ごとに繰り返す」なので、泡が見えるには外側の空間がぜんぶ見えていないといけない。
       戻すのも同じ道筋：いる空間 → … → 外の空間 をぜんぶ 0 にした（公理から出る。特別扱いではない）
     - 公理で直せなかったもの：「dz<0 は消える」（SPEC のレンズの式）と「Z の焦点は一番奥の泡まで行ける」（空にしない）が合わさると、
       同じ面に5つ並んだ外の空間では1回のホイールで5つとも消え、残るのは一番奥の1つ（奥のメモ）だけ。
       X/Y の焦点は動かしても何も消えないので約束(1)(2) が書けるが、Z は動かすと消えるので「空にしない」は「1つ残す」までしか守れない。
       ＝ Z の焦点には X/Y と同じ約束が作れない。案でできたのは「読めるようにする・戻せるようにする」まで
     - 「縦ドラッグ：泡 何も起きない」と出ている空間で縦に引くと外の空間へ出る、が表と食い違っていた（作ったときから分かっていたが画面に無かった）。
       横・縦の行は「軸の決まり」＝箱の中の話で、空間を移るのは「カーソルの点の決まり」。別の1行（外へ引く／中へ落とす）にして、
       ホイールと同じく 泡／背景 の列をまたいで出した。泡が動かない空間（X魚眼・履歴を奥行きに）には行が出ない＝出られない、も同じルールから
     - ホイールだけ「視点も動かない」に当たる言い分けが無かった。横・縦は focusRoom で「どれだけ動けるか」を見ているが、
       Z は向きで止まり方が違う（「自由Zは手前の面で止める」は奥だけ止まる）ので、Z は「どちらへ動けるか」で言い分けた
       （手前へ戻るだけ／奥へ進むだけ／視点も動かない）。X/Y は両向きが同じ約束で止まるので1つの言葉でよかった
     - 渡し先（外へ渡す）の名前は、空間の中の表に入れると幅で言葉が変わる（前に踏んだ）。ルールに to を持たせ、
       幅の要らない所（カーソル脇・選択中の泡）でだけ名前にした。表は「外へ渡す」のまま
     - 「なぜ真っ暗か」は操作のルールではなく、いまの状態。ルールの表ではなく空間の一覧に出した（焦点 Z 0.48／5つ消えている）。
       数えるのは「その空間自身の Z が消した泡」だけ。外の空間が消した分まで数えると、どの空間の焦点のせいかが分からなくなる

   踏んだこと（「触った泡は手前へ」を案4に入れて分かったこと。検証：_check/04-raise.mjs 18項目）
     - 表は1行増えただけ（4行 → 5行）。ルールの1文は変わらない。「触る」も軸の話で、答えは Z の次元で決まる4通り：
         順序     … 最前面（0）へ並べ替えて詰め直す。何度触ってもずれない
         自由座標 … 焦点の面まで上がって、そこで止まる。それより手前へは出せない ＝ 同じ面の上下は決まらない
         履歴     … 書けないので上がらない
         なし     … 何も起きない

       履歴を奥行きに＝hist は書けないので変わらない）
     - ★ はじめは「一番手前の兄弟の手前へ」と素直に書いた。すると自由Z の空間で 版4 を触ると free.z 1 → −0.15、
       dz −0.15 で透明度 0 ＝ 触った泡がその場で消えた。版1・版2 を交互に4往復すると −0.3 と −0.45 まで手前へ行き、
       s1 で見えている泡は 5 → 2。外の空間でも 奥のメモ（z 1.5）を触ると消えた。土台 00-core でも同じ（勤務表 0.4 → −0.15、透明度 1 → 0）。
       ＝ 「手前へ書く」と「透視は手前（dz<0）を消す」が同じ公理の中でぶつかる。ホイールで消えるのと同じ穴が、触るだけで起きる
     - 土台で直した形（書けるのは焦点の面まで）を移した：版4 は 1 → 0 で止まり、4往復しても 0 のまま、5つとも見える。
       表の言葉も「最前面へ」→「焦点の面まで（手前へは出せない）」に変えた。
       ＝ 自由座標の Z では「最前面」を表せない。焦点の面に来た泡どうしの上下は View から決まらず、描く順の最後の項（泡の並び順）が決める
       （s1 の free.z が [0,0,0,0,2] のとき手前は 版4）。上下を決めたいなら Z に「順序」を刺す（プリセット「重ねて置く」を足した）
     - 順序（重ねて置く）は消えない。透視の面が order×0.15 なので最前面 ＝ dz 0 ＝ 焦点の面。4回触っても順序は 0..4 に収まり、5つとも見えたまま
     - 完全に隠れた泡はクリックで当たらない。版2 を版1 にぴったり重ねると、同じ点を3回クリックしても手前は変わらず、
       隠れた版1 はどの点からも触れない。表には補足「隠れたら触れない」で出す（幅 212 の箱に入る一番長い言い方）
     - 「触ると手前へ」と「空間を移ったときの free.z」はぶつからなかった。版5 を 外の空間 へ引き出すと free.z 2 → 0
       ＝ 落とした先の焦点の面。raise が書く先と同じなので、どちらが後でも同じ値になる。そのあと触っても 0 のまま
     - 先客を空きマスへ逃がす（freeCellNear）を入れたら、親を付け替えたあと reindex() を呼んでいなかったので、
       逃げ先が古い兄弟で決まり、落とした泡と同じマスへ逃げた（6個が5マス）。付け替えた直後に reindex すると 6個6マス。
       先客が複数のとき（格子のプリセットを当てると全員が 0,0 に重なる）は、1人ずつ順に一番近い空きマスへ逃がす
     - 描く順のソートから stack（置いた順）を外した：(p,q) => q.dz − p.dz || p.target.scale − q.target.scale || p.i − q.i。View の外の状態は無くなった

   踏んだこと（上の2つの「踏んだこと」を、書いたあとで測り直した。検証：_check/04-recheck.mjs、NG 0）
     - 書いてあったことは全部そのとおりだった：ヘッダ 24px（表の1行目は泡の上端から 36px）／表の字の上は各空間 12〜15点すべてその空間（root も 15点）／
       5空間 × 横・縦 の背景ドラッグ 10通りが「背景」の列と合う／方向ロックで左へ 330px 引いても順序 2 のまま・親 s5 のまま／
       Z の間隔 0.6 で 版1 の字 7.4px（root を −0.4 戻すと 6.7px）／「焦点を戻す」で道筋ぜんぶ 0・見える泡 31 に戻る／

   ルールの言い方
     そのまま保てた
       「泡を掴んで横・縦に引くと、その軸の次元が書けるなら書く、書けないなら視点が動く、なしなら何もしない」（箱の中で。混ざった軸でも軸ごとに独立に効く）
       「触った泡は、その空間の Z 軸の次元が書けるなら、そこへ書く」（表に1行足しただけ。新しい仕組みは要らなかった）
       「ホイールは、カーソルの下の空間の奥行きの視点を動かす。Z が なし なら何もしない」
     言い直しが要った
       「書けるなら書く、は泡を掴んだときだけ。ホイールと背景ドラッグは掴まないので、なし でなければいつも視点」

       （→ 独立検証の第1回：軸の行とは別の1行「外へ引く」にして表に出した）
       「焦点は空間ごと。でも泡が見えるかは、外側の空間ぜんぶの焦点で決まる」（→「焦点を戻す」は道筋ぜんぶ）
       「ホイールは向きで言い分ける」（横・縦は「どれだけ」で足りるが、Z は奥と手前で止まり方が違う）
       「焦点 Z が面を越えたら」は1文にならなかった（消す＝同じ面がまとめて消える／止める＝奥へ行けない／薄く＝手前で大きくなって箱の外へ）。
       履歴の奥行きだけは「越えてよい（時間を行き来する）」で保てる
       「触ると最前面へ」は自由座標では言えなかった。→「Z の手前の端は焦点の面。そこより手前へは書けない」。
       だから自由座標の Z は「焦点の面まで」までで、同じ面の上下は決まらない ＝ 上下を決めたいなら Z に「順序」を刺す、に行き着く。
       同じ1文は焦点の側にも要る（比べるの「自由Zは手前の面で止める」）。書き先だけ止めても、ホイールで消えるのは止まらない

/* ============================================================
   §1 語彙：次元・並べ方・レンズ
   ============================================================ */
const HEADER = 24;              // 泡のヘッダの高さ（中身の箱はこの下）
const RULE_ROW = 13;            // 空間の中の操作の表（泡／背景 × 横・縦、ホイール）1行の高さ
const LOCK_PX = 6;              // 「動き始めの方向でロック」：ここまで動いたら横か縦かを決める
const FADE = 0.16;              // 「越えた面は薄くするだけ」の透明度

/**
 * ★ この案で比べるもの（ツールバーの「比べる」）。操作の言葉も、実際の操作も、ここだけを読む
 *   diag : "each"（軸ごとに別々）| "lock"（動き始めの方向でロック）
 *   cross: "hide"（消す）| "stopFree"（自由Zなら一番手前の面で止める）| "fade"（薄くするだけ）
 *   zNone: "nothing"（何もしない）| "pass"（外の空間へ渡す）
 */
const OPTS = { diag: "each", cross: "hide", zNone: "nothing" };
const PAD = 14;                 // 空間を持つ泡の箱の余白
const GAP = 14;                 // 「詰める」の帯と帯の隙間
const K_PERSP = 0.26;           // 透視：奥行き1あたりの縮み
const ROOT_VP = { x: -130, y: -165 };   // root の消失点（画面中心から）
const VP_CHILD = { fx: 1, fy: 1 };      // 子の空間の消失点（余白の内側の半幅・半高に対する割合、左上へ）。1 以下＝箱の中
const PULL = 48;                // 空間の外へ「大きく」引き出したとみなす距離（画面 px）
const FONT = '-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif';
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

/** 次元：泡 → 値。write はドラッグでその軸に何が起きるか（null＝書けない＝視点が動く） */
const DIMS = {
  "none":           { label: "なし",       write: null,      read: () => 0 },
  "free.x":         { label: "自由X",      write: "coord",   key: "x",   read: b => b.free.x },
  "free.y":         { label: "自由Y",      write: "coord",   key: "y",   read: b => b.free.y },
  "free.z":         { label: "自由Z",      write: "coord",   key: "z",   read: b => b.free.z },
  "order":          { label: "順序",       write: "reorder",             read: b => b.order },
  "col":            { label: "列",         write: "cell",    key: "col", read: b => b.cell.col },
  "row":            { label: "行",         write: "cell",    key: "row", read: b => b.cell.row },
  "history.index":  { label: "履歴の世代", write: null,                  read: b => b.hist },
  // ★ derived 次元は「どの空間の履歴か」を知っている（v2 で踏んだ）
  "history.age":    { label: "履歴の古さ", write: null,                  read: (b, space) => maxHistIn(space) - b.hist },
  "history.branch": { label: "履歴の枝",   write: null,                  read: b => b.branch },
};
/** 軸に刺さった次元で、ドラッグが何をするか："coord" | "reorder" | "cell" | "focus" | "none" */
const verbOf = dimId => dimId === "none" ? "none" : (DIMS[dimId].write ?? "focus");

/**
 * ★ 触った泡は最前面へ ── 「操作は軸に従う」の一例。その空間の Z 軸の次元が書けるなら、そこへ書く。
 *   「手前」は奥行きのことなので、置いた順のような View の外の状態は持たない（土台 00-core と同じ）。
 *
 *     Z が 順序      … 最前面（0）へ並べ替えて詰め直す。値は 0.. に収まるので、何度触ってもずれていかない
 *     Z が 自由座標  … 焦点の面まで上がり、そこで止まる。それより手前へは出せない（透視が dz<0 を消すため）。
 *                      ＝ 自由座標の Z では「最前面」を表せない。同じ面の兄弟の上下は決まらない
 *     Z が 履歴      … 書けないので上がらない。履歴の並びは、触っても順番が変わらない
 *     Z が なし      … 何も起きない
 */
function raise(b) {
  const space = b.parent ?? "root";
  const A = viewOf(space).z, verb = verbOf(A.dim);
  const sibs = kidsOf(space).filter(k => k !== b);
  if (verb === "reorder") {
    [b, ...sibs.sort((q, r) => q.order - r.order)].forEach((k, i) => { k.order = i; });
  } else if (verb === "coord") {
    // 自由座標の Z では「最前面」を表せない。透視は焦点より手前（dz<0）を消すので、
    // 焦点の面にいる兄弟の「さらに手前」へ書くと、触った泡そのものが消える（実測：alpha 0）。
    // だから書けるのは焦点の面まで。そこは兄弟と同じ面で、上下は決まらない
    const key = DIMS[A.dim].key, f = spaceObj(space).focus.z;
    const front = Math.min(b.free[key], ...sibs.map(k => k.free[key]));
    const to = Math.max(f, front - (A.step ?? 1) * 0.15);
    if (b.free[key] > to) b.free[key] = to;
  }
}

const ARRANGES = { "as-is": "そのまま", equal: "等間隔", pack: "詰める" };

/** X/Y のレンズ：u（位置 − 焦点）→ 画面 s と局所倍率 k。1次元なので逆関数が必ずある。H は空間の半幅 */
const TANH_EDGE = 1 - 1e-12;    // tanh が浮動小数で 1 に張り付く手前（|u| ≲ 14H まで往復が合う）
const LENS_XY = {
  parallel: { label: "平行", project: (u, H) => ({ s: u, k: 1 }), unproject: (s, H) => s },
  fisheye:  { label: "魚眼",
    project: (u, H) => { const t = u / H, c = Math.cosh(t); return { s: H * Math.tanh(t), k: 1 / (c * c) }; },
    unproject: (s, H) => H * Math.atanh(clamp(s / H, -TANH_EDGE, TANH_EDGE)) },
};
/** Z のレンズ：dz（位置 − 焦点）→ 倍率 m と透明度。XY は消失点へ m で寄せる */
const LENS_Z = {
  perspective: { label: "透視",
    // d → 0 は目の位置（dz = −1/0.26）。そこより手前は写らないので、式が発散しないように止めるだけ
    mag: dz => 1 / Math.max(0.05, 1 + K_PERSP * dz),
    alpha: dz => dz < -1e-9 ? 0 : 1 },    // 焦点より手前（dz<0）は消す（第1版 制約02）。薄れて見えるのは補間だけ
  flat: { label: "平行", mag: () => 1, alpha: () => 1 },
};
const lensLabel = (axis, id) => (axis === "z" ? LENS_Z : LENS_XY)[id].label;
/**
 * 焦点 Z が泡の面を越えたときの決まり（比べる：OPTS.cross を、その空間の Z の次元で読む）
 *   "hide" 越えた面は消える ／ "stop" 越えない（焦点は一番手前の面まで。fitFocus）／ "fade" 越えた面は薄く残る
 */
function crossPolicy(V) {
  if (OPTS.cross === "fade") return "fade";
  if (OPTS.cross === "stopFree" && verbOf(V.z.dim) === "coord") return "stop";
  return "hide";
}
/** 透視で焦点より手前（dz<0）の泡の見え方：透明度 alpha と、掴めるか hit（薄く残しても掴めない。手前で大きくなってクリックを奪うので） */
function zSeen(V, dz) {
  if (V.z.lens !== "perspective" || dz >= -1e-9) return { alpha: LENS_Z[V.z.lens].alpha(dz), hit: 1 };
  return { alpha: crossPolicy(V) === "fade" ? FADE : 0, hit: 0 };
}

/* ============================================================
   プリセット＝View の型。どれも「軸ごとの 次元・並べ方・レンズ」だけ
   ============================================================ */
const AX = (dim, arrange, lens, step) => ({ dim, arrange, lens, step });
const PRESETS = {
  free:      { label: "自由に置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("free.z", "as-is", "perspective", 1) },
  row:       { label: "横に並べる",     x: AX("order", "pack", "parallel", 110),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  column:    { label: "縦に並べる",     x: AX("none", "pack", "parallel", 110),         y: AX("order", "pack", "parallel", 80),           z: AX("none", "as-is", "flat", 1) },
  grid:      { label: "格子",           x: AX("col", "pack", "parallel", 110),          y: AX("row", "pack", "parallel", 80),             z: AX("none", "as-is", "flat", 1) },
  fisheyeX:  { label: "X魚眼ビュー",    x: AX("history.index", "equal", "fisheye", 36), y: AX("history.branch", "equal", "parallel", 34), z: AX("none", "as-is", "flat", 1) },
  coverflow: { label: "coverflow",      x: AX("order", "equal", "fisheye", 40),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  histZ:     { label: "履歴を奥行きに", x: AX("none", "as-is", "parallel", 110),        y: AX("none", "as-is", "parallel", 80),           z: AX("history.age", "equal", "perspective", 0.6) },
  mixed:     { label: "混ざった軸",     x: AX("order", "pack", "parallel", 110),        y: AX("free.y", "as-is", "parallel", 80),         z: AX("none", "as-is", "flat", 1) },
  stackZ:    { label: "重ねて置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("order", "equal", "perspective", 0.15) },
};
const viewFromPreset = id => { const p = PRESETS[id]; return { x: { ...p.x }, y: { ...p.y }, z: { ...p.z } }; };

/* ============================================================
   状態：泡と root。関係は無い。親子だけ
   ------------------------------------------------------------
   焦点は View の型に入れず、空間（泡）そのものに持たせる。
   View は継げるが、焦点は継がない（§4）——その境目をデータの形に出すため。
   ============================================================ */
const ROOT = { id: "root", title: "外の空間", hue: null, view: viewFromPreset("free"), focus: { x: 0, y: 0, z: 0 } };
const bubbles = [];
const BYID = new Map();
const byId = id => BYID.get(id);

function add(p) {
  const b = {
    id: p.id, title: p.title, hue: p.hue,
    size: { w: p.w, h: p.h },
    parent: p.parent ?? null,
    free: { x: 0, y: 0, z: 0, ...p.free },
    order: p.order ?? 0,
    cell: { col: 0, row: 0, ...p.cell },
    hist: p.hist ?? 0, branch: p.branch ?? 0,
    view: p.view ? viewFromPreset(p.view) : null,
    implicit: false,
    focus: { x: 0, y: 0, z: 0 },          // この泡が空間を持つとき、その空間の「いまどこを見ているか」
  };
  bubbles.push(b); BYID.set(b.id, b);
  return b;
}

/* ── 場面：同じ中身の泡5つ（版1〜版5）を、5つの空間に入れて横に並べる ──
   5つの泡は、どの空間でも同じ値を持つ（自由座標・順序・履歴の世代・枝）。違うのは入れている空間の View だけ */
const ITEMS = [   // 自由座標 x, y, z ／ 履歴の世代 hist ／ 枝 branch（順序は並びの番号）
  { x: -58, y: -96, z: 0, hist: 0, branch: 0 },
  { x:  30, y: -60, z: 0, hist: 1, branch: 0 },
  { x: -44, y:  -4, z: 0, hist: 2, branch: 0 },
  { x:  70, y:  70, z: 1, hist: 3, branch: 1 },
  { x: -30, y: 130, z: 2, hist: 4, branch: 1 },
];
const SPACE_W = 212, SPACE_H = 380;
const SPACES = [   // [id, 見出し, 色, View, 画面上の中心 x（自由X）] 箱の幅は 212（順序・混ざった軸は中身で 244 に伸びる）、隙間 8
  ["s1", "1 自由",           35,  "free",     -606],
  ["s2", "2 順序",           170, "row",      -370],
  ["s3", "3 X魚眼",          285, "fisheyeX", -134],
  ["s4", "4 履歴を奥行きに", 250, "histZ",      86],
  ["s5", "5 混ざった軸",     355, "mixed",     322],
];
for (const [id, title, hue, view, x] of SPACES) {
  const s = add({ id, title, hue, w: SPACE_W, h: SPACE_H, free: { x, y: -182 }, view });
  s.rules = true;                  // 中身の箱の上に、操作の表（泡／背景 × 横・縦、ホイール）を出す
  ITEMS.forEach((it, i) =>
    add({ id: `${id}v${i}`, title: "版" + (i + 1), hue: 196 + i * 22, w: 32, h: 26, parent: id, order: i,
          hist: it.hist, branch: it.branch, free: { x: it.x, y: it.y, z: it.z } }));
}
/* 外の空間（自由）の奥に1つ。これが無いと外の空間の焦点 Z は 0 より奥へ行けない（5つとも z=0 の同じ面） */
add({ id: "deep", title: "奥のメモ", hue: 60, w: 150, h: 80, free: { x: -60, y: 330, z: 1.5 } });

let selectedId = "s1v1";

/* ============================================================
   木：親子だけ
   ============================================================ */
let KIDS = new Map();
function reindex() {
  KIDS = new Map([["root", []]]);
  for (const b of bubbles) {
    const p = b.parent ?? "root";
    if (!KIDS.has(p)) KIDS.set(p, []);
    KIDS.get(p).push(b);
  }
}
const kidsOf = id => KIDS.get(id) ?? [];
const spaceObj = id => id === "root" ? ROOT : byId(id);
const parentOf = id => id === "root" ? null : (byId(id).parent ?? "root");
/** 空間を持つ泡：自前の View を持つか、中に泡がいる */
const isHost = b => b.view !== null || kidsOf(b.id).length > 0;
const maxHistIn = spaceId => Math.max(0, ...kidsOf(spaceId).map(b => b.hist));
function isAncestor(a, id) {             // a は id の先祖（id 自身も含む）か
  for (let cur = id; cur; cur = parentOf(cur)) if (cur === a) return true;
  return false;
}
function subtreeOf(id) {
  const s = new Set([id]);
  const walk = x => kidsOf(x).forEach(k => { s.add(k.id); walk(k.id); });
  walk(id);
  return s;
}
const spaceName = id => id === "root" ? "外の空間" : `${byId(id).title}の中`;
const spaceHsl = id => id === "root" ? "#e6ebf5" : `hsl(${byId(id).hue} 70% 66%)`;

/* ============================================================
   §4 継承：並べ方は外から継ぐ。焦点は継がない
   ============================================================ */
function viewOf(spaceId) {
  const sp = spaceObj(spaceId);
  const src = sp.view ?? viewOf(parentOf(spaceId));
  return { x: { ...src.x }, y: { ...src.y }, z: { ...src.z }, focus: sp.focus, own: !!sp.view };
}

/** 次元に合う並べ方。「そのまま」は px を持つ次元（自由）だけに意味がある */
function fitArrange(dimId, arrange) {
  const verb = verbOf(dimId);
  if (verb === "coord") return "as-is";
  if (verb === "none") return arrange;
  if (arrange !== "as-is") return arrange;
  return dimId.startsWith("history.") ? "equal" : "pack";
}

/** 軸セレクタ：その空間に自前の View を持たせてから変える（継いでいたなら、いまの見え方を写し取る） */
function setAxis(spaceId, axis, patch) {
  const sp = spaceObj(spaceId);
  if (!sp.view) { const v = viewOf(spaceId); sp.view = { x: v.x, y: v.y, z: v.z }; }
  const A = sp.view[axis];
  Object.assign(A, patch);
  if (patch.dim && !patch.arrange) A.arrange = fitArrange(A.dim, A.arrange);
}
function applyPreset(name, spaceId) {
  const id = PRESETS[name] ? name : Object.keys(PRESETS).find(k => PRESETS[k].label === name);
  if (!id) throw new Error("プリセットが無い: " + name);
  const sp = spaceObj(spaceId);
  sp.view = viewFromPreset(id);
  Object.assign(sp.focus, { x: 0, y: 0, z: 0 });
}
function inheritView(spaceId) { if (spaceId !== "root") spaceObj(spaceId).view = null; }

/* ============================================================
   §2 並べ方：値 → 空間の中での位置（泡の中心。原点は中身の箱の中心）
   ============================================================ */
function arrangeAxis(A, kids, axis, spaceId, sizeOf) {
  const dim = DIMS[A.dim];
  const val = b => dim.read(b, spaceId);
  const len = b => axis === "x" ? sizeOf(b).w : sizeOf(b).h;
  const pos = new Map(), bands = [];
  const values = [...new Set(kids.map(val))].sort((p, q) => p - q);
  let mid = 0;

  if (axis === "z") {                              // Z は中央ぞろえしない（焦点 0 ＝ 手前）
    for (const b of kids) {
      const v = val(b);
      pos.set(b.id, A.arrange === "equal" ? v * A.step : A.arrange === "pack" ? values.indexOf(v) : v);
    }
  } else if (A.arrange === "as-is") {
    for (const b of kids) pos.set(b.id, val(b));
  } else if (A.arrange === "equal") {
    // 塊の中央を空間の中心に。塊は pack と同じく泡の端から端（値×間隔は泡の中心なので、中心どうしの中点だと
    // 端の泡の大きさが違うときずれる）
    let lo = Infinity, hi = -Infinity;
    for (const b of kids) { const c = val(b) * A.step; lo = Math.min(lo, c - len(b) / 2); hi = Math.max(hi, c + len(b) / 2); }
    if (kids.length) mid = (lo + hi) / 2;
    for (const b of kids) pos.set(b.id, val(b) * A.step - mid);
    for (const v of values) bands.push({ value: v, start: v * A.step - mid - A.step / 2, end: v * A.step - mid + A.step / 2 });
  } else {                                          // pack：値ごとの帯。帯の幅はその値を持つ泡の最大
    let total = -GAP;
    const bandLen = new Map();
    for (const v of values) {
      const l = Math.max(...kids.filter(b => val(b) === v).map(len));
      bandLen.set(v, l); total += l + GAP;
    }
    let at = -Math.max(0, total) / 2;
    for (const v of values) { bands.push({ value: v, start: at, end: at + bandLen.get(v) }); at += bandLen.get(v) + GAP; }
    for (const b of kids) {
      const bd = bands.find(x => x.value === val(b));
      pos.set(b.id, bd.start + len(b) / 2);        // 帯の中は始端ぞろえ
    }
  }
  return { pos, bands, mid };
}

/**
 * 箱の大きさ。「そのまま」の軸は自前の大きさ。
 * 等間隔・詰めるの軸は、レンズを通した中身が収まるまで伸びる（＋余白）。
 * 魚眼は箱の半幅で曲がるので、何度か当てて落ち着かせる。
 */
function measure(b, memo) {
  if (memo.has(b.id)) return memo.get(b.id);
  const box = { w: b.size.w, h: b.size.h };
  const kids = kidsOf(b.id);
  if (kids.length) {
    const V = viewOf(b.id), sizeOf = k => measure(k, memo);
    for (const axis of ["x", "y"]) {
      const A = V[axis];
      if (A.arrange === "as-is") continue;
      const { pos } = arrangeAxis(A, kids, axis, b.id, sizeOf);
      const lens = LENS_XY[A.lens];
      const ownHalf = (axis === "x" ? b.size.w : b.size.h - HEADER) / 2;
      const halfLen = k => (axis === "x" ? sizeOf(k).w : sizeOf(k).h) / 2;
      let half = ownHalf;
      for (let n = 0; n < 60; n++) {                 // H＝箱の半幅。魚眼では H と中身が互いに決まるので落ち着くまで
        const H = Math.max(1, half);
        let need = 0;
        for (const k of kids) { const p = lens.project(pos.get(k.id), H); need = Math.max(need, Math.abs(p.s) + halfLen(k) * p.k); }
        const next = Math.max(ownHalf, need + PAD);
        if (Math.abs(next - half) < 1e-6) { half = next; break; }
        half = next;
      }
      if (axis === "x") box.w = half * 2; else box.h = half * 2 + HEADER;
    }
  }
  memo.set(b.id, box);
  return box;
}

/** 空間（中身の箱）の半幅。魚眼の像は箱いっぱい */
const halfOf = host => ({ x: Math.max(1, host.w / 2), y: Math.max(1, host.h / 2) });

/**
 * レンズの ctx。★ 目の位置を足すならここ1か所（vp や focus をずらした写しを返す。状態には書き込まない）
 * focus は写しで渡る。焦点を動かす操作はこの ctx に書かず、状態へ「u（位置 − 焦点）の変化の分」を書く（setFocusAxis の上）ので、
 * ここで焦点をずらしても操作は壊れない
 * 子の空間の消失点は箱の中（余白の内側の左上の角）に置く。透視は見える泡（dz ≥ 0）を m ≤ 1 で消失点へ寄せるだけなので、
 * 寄せた像は「元の像と消失点を結ぶ範囲」にあり、X/Y で箱に収まった中身は Z をかけても箱に収まる（measure・focusFits は Z を見なくてよい）
 */
function lensCtx(spaceId, host, focus) {
  const H = halfOf(host);
  return {
    focus: { ...focus },
    H,
    vp: spaceId === "root" ? { ...ROOT_VP }
      : { x: -Math.max(0, H.x - PAD) * VP_CHILD.fx, y: -Math.max(0, H.y - PAD) * VP_CHILD.fy },
  };
}

/* ============================================================
   §2 解く順番（1フレーム）
   ============================================================ */
let frameItems = [];            // 描いた順の配置（画面座標）
let PLACE = new Map();          // id → 配置
let LAYOUT = new Map();         // spaceId → { host, ctx, V, arr }（ドラッグの逆変換に使う）
const anim = new Map();         // id → 親の中身の座標での { x, y, scale, alpha, w, h }。補間はここだけ
const EASE = 0.2;
let drag = null;

function ease(id, target, mode) {
  let a = anim.get(id);
  if (!a || mode === "snap") { a = { ...target }; anim.set(id, a); return a; }
  for (const k in target) a[k] += (target[k] - a[k]) * EASE;
  return a;
}

/** ★ 合成はここ1回だけ。深さ n でも scale は数値1つ */
function compose(host, a) {
  const scale = host.scale * a.scale;
  const w = a.w * scale, h = a.h * scale;
  return { x: host.cx + a.x * host.scale - w / 2, y: host.cy + a.y * host.scale - h / 2, w, h, scale,
           alpha: host.alpha * a.alpha };
}
/** 空間を持つ泡の配置 → その中身の箱（子の空間の host）。vis は補間を通さないレンズの答え（見えるか） */
const contentOf = p => ({
  cx: p.x + p.w / 2, cy: p.y + (HEADER + (p.box.h - HEADER) / 2) * p.scale,
  w: p.box.w, h: p.box.h - HEADER, scale: p.scale, alpha: p.alpha, vis: p.vis, depth: p.depth,
});
const contentRect = host => ({ x: host.cx - host.w / 2 * host.scale, y: host.cy - host.h / 2 * host.scale,
                               w: host.w * host.scale, h: host.h * host.scale });

function resolveSpace(spaceId, host, memo, sink, lifted, mode) {
  const V = viewOf(spaceId), kids = kidsOf(spaceId);
  const sizeOf = b => measure(b, memo);
  const arr = { x: arrangeAxis(V.x, kids, "x", spaceId, sizeOf),
                y: arrangeAxis(V.y, kids, "y", spaceId, sizeOf),
                z: arrangeAxis(V.z, kids, "z", spaceId, sizeOf) };
  // 約束(2)の箱は補間を通さない答え（measure）で測る。補間中の箱で測ると、焦点が補間の進み方しだいで変わる
  const own = spaceId === "root" ? host : (m => ({ w: m.w, h: m.h - HEADER }))(measure(byId(spaceId), memo));
  const L = { id: spaceId, host, V, arr, kids, sizeOf, H: halfOf(own) };
  // ★ 焦点はいつも約束の中にいる（fitFocus）。約束は 焦点・View・中身 の三つで決まるので、焦点を書いたときだけ当てると
  //   軸セレクタや「外から継ぐ」で View が変わったとき古い焦点が残る。写す前に、いまの View と中身で約束の中へ戻す
  const sp = spaceObj(spaceId);
  for (const axis of ["x", "y", "z"]) sp.focus[axis] = fitFocus(L, axis, sp.focus[axis], sp.focus[axis]);
  L.focus = { ...sp.focus };                                        // このフレームの焦点（目を足す前）
  const ctx = L.ctx = lensCtx(spaceId, host, L.focus);
  LAYOUT.set(spaceId, L);
  const lx = LENS_XY[V.x.lens], ly = LENS_XY[V.y.lens], lz = LENS_Z[V.z.lens];

  const items = kids.map((b, i) => {
    const pos = { x: arr.x.pos.get(b.id), y: arr.y.pos.get(b.id), z: arr.z.pos.get(b.id) };
    const px = lx.project(pos.x - ctx.focus.x, ctx.H.x);          // 位置 − 焦点 → レンズ（軸ごと）
    const py = ly.project(pos.y - ctx.focus.y, ctx.H.y);
    const dz = pos.z - ctx.focus.z, m = lz.mag(dz);               // そのあと Z で消失点へ寄せる
    const box = sizeOf(b);
    const seen = zSeen(V, dz);                                    // 越えた面：消す／薄く（比べる）
    const target = { x: ctx.vp.x + (px.s - ctx.vp.x) * m, y: ctx.vp.y + (py.s - ctx.vp.y) * m,
                     scale: m * Math.min(px.k, py.k), alpha: seen.alpha, w: box.w, h: box.h };
    return { b, i, dz, m, pos, target, hit: seen.hit };
  });
  // ★ 空間ごとに Z で1回だけ（奥 → 手前）。Z が同じなら大きく写るものを手前に（coverflow の中央が上に来る）。
  //   それも同じなら泡の並びの順（上下は View から決まらない）。重なりの上下を決めたいなら Z に「順序」を刺す（raise）
  items.sort((p, q) => q.dz - p.dz || p.target.scale - q.target.scale || p.i - q.i);

  // 連続入力（焦点を引く・泡を引く・大きさ）は補間しない
  const snapAll = drag && drag.started && drag.snapSpace === spaceId;
  for (const it of items) {
    const b = it.b;
    const grabbed = drag && drag.started && drag.id === b.id;
    // 掴んでいる泡は連続入力なので補間しない（並べ替えで持ち上げていても、自由の軸は掴んだ点にそろう）
    const a = ease(b.id, it.target, snapAll || grabbed ? "snap" : mode);
    let place = compose(host, a);
    if (grabbed && drag.lift) {
      // 並べ替え・マス移動：その軸ではカーソルについてくる。ほかの軸は View の答えのまま（なしなら動かない）。
      // 空間の外へ引き出したら、もうこの空間の View には従わないので両方の軸でついてくる
      const out = drag.slot && drag.slot.space !== drag.space;
      const scale = drag.scale0, w = a.w * scale, h = a.h * scale;
      const cx = place.x + place.w / 2, cy = place.y + place.h / 2;
      const follow = ax => out || drag.verbs[ax] === "reorder" || drag.verbs[ax] === "cell";
      place = { x: follow("x") ? drag.mx - drag.fx * w : cx - w / 2, y: follow("y") ? drag.my - drag.fy * h : cy - h / 2,
                w, h, scale, alpha: 1 };
    }
    place.vis = host.vis * it.hit;
    place.hit = it.hit;                                             // この空間の Z が消したか（外の空間が消した分は含まない）
    Object.assign(place, { id: b.id, b, space: spaceId, depth: host.depth + 1, local: a.scale, m: it.m,
                           pos: it.pos, box: { w: a.w, h: a.h } });
    const out = grabbed ? lifted : sink;                            // 掴んでいる泡とその中身は一番上に描く
    out.push(place);
    if (isHost(b)) resolveSpace(b.id, contentOf(place), memo, out, lifted, mode);
  }
}

let VW = 0, VH = 0;
function resolveAll(mode) {
  reindex();
  LAYOUT = new Map();
  const sink = [], lifted = [];
  resolveSpace("root", { cx: VW / 2, cy: VH / 2, w: VW, h: VH, scale: 1, alpha: 1, vis: 1, depth: 0 },
               new Map(), sink, lifted, mode);
  frameItems = sink.concat(lifted);
  PLACE = new Map(frameItems.map(p => [p.id, p]));
}

/* ── 1軸の写しと逆写し（ドラッグ・当たり判定・印で共通に使う） ── */
/** 画面 → レンズを通す前の u（位置 − 焦点）。m は Z の倍率（その泡の奥行き） */
function unprojectLocal(L, axis, screen, m = 1) {
  const local = (screen - (axis === "x" ? L.host.cx : L.host.cy)) / L.host.scale;
  const s = L.ctx.vp[axis] + (local - L.ctx.vp[axis]) / m;
  return LENS_XY[L.V[axis].lens].unproject(s, L.ctx.H[axis]);
}
const screenToAxis = (L, axis, screen, m = 1) => unprojectLocal(L, axis, screen, m) + L.ctx.focus[axis];
function axisToScreen(L, axis, pos, m = 1) {
  const s = LENS_XY[L.V[axis].lens].project(pos - L.ctx.focus[axis], L.ctx.H[axis]).s;
  return (axis === "x" ? L.host.cx : L.host.cy) + (L.ctx.vp[axis] + (s - L.ctx.vp[axis]) * m) * L.host.scale;
}
/**
 * 焦点の約束。
 *   (0) 次元が なし の軸は 0 ── なしの軸には焦点を動かす操作が無い（§3）ので、前の View の焦点が残ると戻せない
 * X/Y の等間隔・詰めるの軸では、ほかに2つ：
 *   (1) 見ている所には泡がある ── 並んだ泡の範囲の外へは出ない（魚眼の端で掴むと逆写しが急で飛ぶため）
 *   (2) 中身は箱に収まる（§2）── 焦点をずらしても、中身が空間を持つ泡の箱からはみ出さない
 * (2) はレンズを問わず「その焦点で写したら収まるか」で調べる。平行では余白のぶんしか動かず、
 * 魚眼では端が飽和するので（泡の半幅 ≤ H/2 なら）いつでも収まる。
 * Z の寄せは見なくてよい：消失点が箱の中にあり、見える泡は m ≤ 1 なので、寄せても箱から出ない（lensCtx）
 * Z は「空にしない」：手前へは 1 退いて全体を見られる。奥へは一番奥の泡まで（その先は dz<0 で全部消える）

function focusFits(L, axis, f) {

  for (const k of L.kids) {
    const sz = L.sizeOf(k), half = (axis === "x" ? sz.w : sz.h) / 2, p = lens.project(pos.get(k.id) - f, H);
    if (Math.abs(p.s) + half * p.k > H + 1e-6) return false;

/** 焦点を v へ動かしたら、約束の中のどこに留まるか（書かない。ヒントも同じ答えを使う）。cur は今の焦点（(2) で戻る起点） */

  if (axis === "z") {

    const deep = crossPolicy(L.V) === "stop" ? (ps.length ? Math.min(...ps) : 0) : Math.max(0, ...ps);

 *   新しい焦点 ＝ このフレームの焦点 ＋（掴んだ点のいまの u − 行きたい u）

/* ============================================================
   描画（切り抜きはしない）
   ============================================================ */
const cv = document.getElementById("cv"), g = cv.getContext("2d");
let HELP_H = 0;                 // 左下のヘルプの高さ（外の空間の表をその上に置く）
function resize() {
  const dpr = window.devicePixelRatio || 1, r = cv.getBoundingClientRect();
  VW = r.width; VH = r.height;
  HELP_H = document.getElementById("help").offsetHeight;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(cv);

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

/** その空間の中の泡を掴んだら何が起きるか（一覧・印に使う要約） */
function spaceSummary(spaceId) {
  const V = viewOf(spaceId), vs = [verbOf(V.x.dim), verbOf(V.y.dim)];
  if (vs.includes("coord"))   return { text: "動かせる",       short: "動く",     cls: "move" };
  if (vs.includes("reorder")) return { text: "並べ替えられる", short: "並べ替え", cls: "move" };
  if (vs.includes("cell"))    return { text: "マスを移れる",   short: "マス移動", cls: "move" };
  if (vs.includes("focus"))   return { text: "動かせない（視点が動く）", short: "視点が動く", cls: "fix" };
  return { text: "動かせない", short: "動かない", cls: "fix" };
}

function drawBubble(p) {
  const { x, y, w, h, scale: s, b } = p;
  if (x > VW + 40 || y > VH + 40 || x + w < -40 || y + h < -40 || w < 2) return;
  const op = clamp(p.alpha, 0, 1) * clamp(0.3 + 0.7 * Math.min(1, s), 0.15, 1);
  if (op < 0.02) return;
  const sel = b.id === selectedId, host = isHost(b), chip = p.box.h <= 34;
  const r = Math.max(2, (chip ? 6 : 10) * s);
  const bh = chip ? h : HEADER * s;
  g.globalAlpha = op;

  g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 18 * s; g.shadowOffsetY = 5 * s;
  roundRect(x, y, w, h, r); g.fillStyle = `hsl(${b.hue} 30% 13%)`; g.fill();
  g.shadowColor = "transparent"; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.save(); roundRect(x, y, w, h, r); g.clip();
  g.fillStyle = `hsl(${b.hue} 55% 42% / ${chip ? 0.5 : 0.55})`; g.fillRect(x, y, w, bh);
  g.restore();
  g.lineWidth = (sel ? 2.4 : 1.1) * clamp(s, 0.6, 1);
  g.strokeStyle = sel ? "#6ee7ff" : `hsl(${b.hue} 62% 58% / .8)`;
  roundRect(x, y, w, h, r); g.stroke();

  // タイトル
  const fs = 12 * s;
  let titleEnd = x + 8 * s;
  g.textBaseline = "middle";
  if (fs >= 6.5) {                              // 透視で4枚目（倍率 0.56）の見出しが 6.7px。それも読ませる
    g.font = `600 ${fs}px ${FONT}`; g.fillStyle = "#eaf1ff";
    const maxW = Math.max(4, w - 14 * s);
    g.fillText(b.title, x + 8 * s, y + bh / 2 + 0.5, maxW);
    titleEnd += Math.min(g.measureText(b.title).width, maxW);
  }

  if (host) {
    const markBelow = drawSpaceMark(p, titleEnd, bh, y + HEADER * s);
    // 中身の箱（ここから下が別の空間）
    const c = contentRect(contentOf(p));
    g.globalAlpha = op * 0.5; g.setLineDash([3, 4]); g.lineWidth = 1;
    g.strokeStyle = `hsl(${b.hue} 60% 62% / .45)`;
    roundRect(c.x + 4 * s, c.y + 3 * s, c.w - 8 * s, c.h - 7 * s, 6 * s); g.stroke(); g.setLineDash([]);
    // 操作の表は中身の箱（その表が言う空間）の中に。印が箱の上端に下りていたら、その下から
    g.globalAlpha = op;
    if (b.rules) drawRules(p.id, p.x + 6 * s, p.x + p.w - 6 * s, c.y + (markBelow ? PAD : 5) * s, s);
  } else if (!chip && s > 0.2) {
    // 中身の仮の行
    g.globalAlpha = op * 0.5; g.fillStyle = "#9fb0cc";
    const rows = Math.min(6, Math.floor((h - bh - 12 * s) / (11 * s)));
    for (let i = 0; i < rows; i++)
      g.fillRect(x + 10 * s, y + bh + (9 + i * 11) * s, (w - 20 * s) * (i === rows - 1 ? 0.5 : 0.82), 3.5 * s);
  }
  if (sel) { g.globalAlpha = 1; g.fillStyle = "#6ee7ff"; roundRect(x + w - 10, y + h - 10, 8, 8, 2); g.fill(); }
  g.globalAlpha = 1;
}

/**
 * 空間を持つ泡の印：「中は別の空間」と、中の泡を掴んだら何が起きるか（§5.7）。文言は削らない（削ると印が何か分からない）。
 * ヘッダのタイトルの右に入らなければ、ヘッダのすぐ下（中身の箱の上の余白）に置き、そこにも入らなければ字を縮める。
 * 字の下限はタイトルと同じ 6.5px。それより小さくしないと入らない泡には描かない。返り値：中身の箱の上端に下りたか
 */
const MARK_MIN = 6.5;
function drawSpaceMark(p, titleEnd, bh, below) {
  const S = spaceSummary(p.id), s = p.scale, fs = 10 * s, text = `中は別の空間 · ${S.short}`;
  if (fs < MARK_MIN) return false;
  const right = p.x + p.w - 9 * s;
  g.font = `600 ${fs}px ${FONT}`;
  let y = p.y + bh / 2 + 0.5, down = false;
  if (g.measureText(text).width > right - titleEnd - 10 * s) {
    const room = p.w - 18 * s, w1 = g.measureText(text).width;   // 字の幅は大きさに比例する
    const size = Math.min(fs * 0.9, fs * room / w1);
    if (size < MARK_MIN) return false;
    down = true;
    g.font = `600 ${size}px ${FONT}`;
    y = below + PAD * s / 2 + 0.5;
    const tw = g.measureText(text).width;
    g.fillStyle = `hsl(${p.b.hue} 30% 13%)`;                   // 中身の箱の破線の上に字を載せる
    g.fillRect(right - tw - 3 * s, y - size * 0.6, tw + 6 * s, size * 1.2);
  }
  g.textAlign = "right"; g.fillStyle = S.cls === "move" ? "#7ee2a8" : "#ff9db1";
  g.fillText(text, right, y);
  g.textAlign = "left";
  return down;
}

/**
 * 空間の中の操作の表。毎フレーム、ルール（touchRule・dragRule・backgroundRule・wheelRule・crossRule）から作る:
 *               泡            背景
 *   触る         最前面へ（自由Z）                 ← 掴む前に起きる。Z 軸が書けるなら書く（＝最前面へ）
 *   横ドラッグ   並べ替わる    少しだけ視点が動く
 *   縦ドラッグ   何も起きない（なし）              ← 掴む・掴まないで答えが同じ行は、列に分けずに1つ（補足を出す幅ができる）
 *   ホイール     何も起きない（Z が なし）
 *   よそへ引く   カーソルの下の空間へ（箱から離れてから）  ← 軸ではなくカーソルの点の決まり
 * ★ 表は中身の箱（表が言う空間）の中に描く。ヘッダは外の空間の場所なので、そこに中の操作を書くと、字の上でのホイール・ドラッグは
 *   外の空間の操作になり、書いてあることと逆のことが起きた（第1回）。箱の中なら字の上は「その空間の背景」なので、表の「背景」の列どおり。
 * ★「書けるなら書く」は泡を掴んだときだけ（背景には書く先が無い）なので、泡と背景を別の列にする。
 * ★ 外の空間（root）には箱が無いので、箱の下の空き地に同じ表を描く（drawRootRules）。字の上の点も外の空間なので、表のとおりになる
 * 列が入らなければ字を縮める（下限 6.5px）。列をまたぐ行の補足（括弧）は入る長さのものを選ぶ
 */
const CAPTIONS = new Map();     // spaceId → 描いた表を行の文字列にしたもの（__lab.captionOf）

const DIM_COLOR = "#8b95ad";
function captionTable(spaceId) {

  const row = (label, grab, bg) =>
    grab.word === bg.word && grab.kind === bg.kind ? { label, one: bg } : { label, grab, bg };
  const cross = crossRule(spaceId), touch = touchRule(spaceId);
  const rows = [
    { label: touch.label, one: touch },        // 泡を掴む前（クリック）に起きること。背景には書く先が無いので列に分けない
    row("横ドラッグ", dragRule(spaceId, "x"), backgroundRule(spaceId, "x")),
    row("縦ドラッグ", dragRule(spaceId, "y"), backgroundRule(spaceId, "y")),
    row("ホイール", wheelRule(spaceId, true), wheelRule(spaceId, false)),
    { label: cross.label, one: cross },       // 掴んだ泡の話だが、軸ではなくカーソルの点の決まりなので列に分けない
  ];
  return {
    head: locks(spaceId) ? "泡（方向ロック）" : "泡",   // ロックは泡の列だけに効く（背景は横も縦も視点なので混ざらない）
    rows, split: rows.some(r => r.grab),               // 1行も分かれないなら、泡／背景 の見出しも要らない
  };
}
function drawRules(spaceId, left, right, top, s) {
  const fs0 = 10 * s;
  if (fs0 < MARK_MIN) return;
  const T = captionTable(spaceId), gap = 8 * s;
  const width = (t, wt, f) => { g.font = `${wt} ${f}px ${FONT}`; return g.measureText(t).width; };
  const cols = f => [
    Math.max(...T.rows.map(r => width(r.label, 400, f))),
    Math.max(T.split ? width(T.head, 400, f) : 0, ...T.rows.filter(r => r.grab).map(r => width(r.grab.word, 600, f))),
    Math.max(T.split ? width("背景", 400, f) : 0, ...T.rows.filter(r => r.bg).map(r => width(r.bg.word, 600, f))),
  ];
  const wideW = (f, r, n) => width(r.word, 600, f) + (n ? width(`（${n}）`, 400, f) : 0);
  // 字の幅は大きさに比例するので、列と、列をまたぐ行（一番短い補足まで。"" ＝ 補足なしでよい）の両方が入る大きさに、表ぜんぶを縮める（下限 6.5px）
  const w0 = cols(fs0);
  const need = Math.max(0, ...T.rows.filter(r => r.one).map(r => w0[0] + wideW(fs0, r.one, (r.one.notes || []).at(-1))));
  const fit = Math.min(1, (right - left - 2 * gap) / (w0[0] + w0[1] + w0[2]), (right - left - gap) / (need || 1));
  const fs = Math.max(MARK_MIN, fs0 * fit);

  const rowY = i => top + (RULE_ROW * i + RULE_ROW / 2) * s + 0.5;
  const put = (t, x, i, wt, color) => {
    g.font = `${wt} ${fs}px ${FONT}`; g.fillStyle = color;
    g.fillText(t, x, rowY(i), Math.max(1, right - x));
    return Math.min(g.measureText(t).width, right - x);

  g.textBaseline = "middle"; g.textAlign = "left";

  let i = 0;
  if (T.split) { put(T.head, x1, 0, 400, DIM_COLOR); put("背景", x2, 0, 400, DIM_COLOR); i = 1; }
  for (const r of T.rows) {
    put(r.label, left, i, 400, DIM_COLOR);
    if (r.one) {                                  // 列をまたぐ1つの答え。括弧の補足は、入る長さのものを選ぶ
      const note = [...(r.one.notes || []), ""].find(n => !n || w[0] + wideW(fs, r.one, n) <= right - left - gap + 0.5);
      const ww = put(r.one.word, x1, i, 600, KIND_COLOR[r.one.kind]);
      if (note) put(`（${note}）`, x1 + ww, i, 400, DIM_COLOR);
      lines.push(`${r.label}：${r.one.word}${note ? `（${note}）` : ""}`);
    } else {
      put(r.grab.word, x1, i, 600, KIND_COLOR[r.grab.kind]);
      put(r.bg.word, x2, i, 600, KIND_COLOR[r.bg.kind]);
      lines.push(`${r.label}：${T.head} ${r.grab.word}／背景 ${r.bg.word}`);
    }
    i++;

  CAPTIONS.set(spaceId, lines);
}

/**
 * 外の空間（root）の操作の表。
 * ★ ほかの空間の表は「その空間の中身の箱」の中に描くが、root には箱が無い（箱の外ぜんぶが root）。
 *   そこで、5つの箱の下の空き地に描く。そこは root の背景なので、この字の上でのホイール・背景ドラッグは、この表のとおりになる。
 *   第1回の穴：画面の下半分と見出しの帯は root なのに、root の操作だけ常時見える説明が無く、1回ホイールすると理由の分からない真っ暗になった

  const T = captionTable("root"), rows = T.rows.length + (T.split ? 1 : 0);
  const top = clamp(ROOT_TABLE.y, 30, VH - 28 - HELP_H - RULE_ROW * rows);   // 左下のヘルプに重ねない
  g.globalAlpha = 1;
  g.fillStyle = "rgba(8,10,17,.5)";
  roundRect(ROOT_TABLE.x - 8, top - 24, ROOT_TABLE.w + 16, RULE_ROW * rows + 32, 8); g.fill();
  g.textBaseline = "middle"; g.textAlign = "left";
  g.font = `600 11px ${FONT}`; g.fillStyle = "#e6ebf5";
  g.fillText(spaceName("root"), ROOT_TABLE.x, top - 11);
  const nw = g.measureText(spaceName("root")).width;
  g.font = `400 10px ${FONT}`; g.fillStyle = DIM_COLOR;
  g.fillText("箱の外・見出しの帯・この字の上", ROOT_TABLE.x + nw + 8, top - 11);
  drawRules("root", ROOT_TABLE.x, ROOT_TABLE.x + ROOT_TABLE.w, top, 1);

function drawDragMarks() {
  if (!drag || drag.kind !== "bubble" || !drag.started || !drag.slot) return;
  const sl = drag.slot, L = LAYOUT.get(sl.space);
  g.save();
  g.strokeStyle = "#6ee7ff"; g.fillStyle = "#6ee7ff"; g.shadowColor = "rgba(110,231,255,.8)"; g.shadowBlur = 10;
  if (sl.space !== drag.space) {                 // 別の空間へ移る
    const c = contentRect(L.host);
    g.lineWidth = 2; g.setLineDash([7, 5]); roundRect(c.x, c.y, c.w, c.h, 6); g.stroke(); g.setLineDash([]);
    g.shadowBlur = 0; g.font = `600 12px ${FONT}`; g.textBaseline = "bottom";
    const label = `離すと ${spaceName(sl.space)}へ`;
    // 置き場所：空間を持つ泡のヘッダの上（タイトルを隠さない）→ 箱の下 → どちらも画面の外なら箱の中の上端
    const top = c.y - (sl.space === "root" ? 0 : HEADER) * L.host.scale;
    const ty = top - 6 >= 18 ? top - 6 : c.y + c.h + 20 <= VH - 4 ? c.y + c.h + 20 : Math.max(c.y, 0) + 22;
    const lx = clamp(c.x, 0, VW - g.measureText(label).width - 12) + 2;
    g.fillStyle = "rgba(8,10,17,.85)"; g.fillRect(lx - 4, ty - 16, g.measureText(label).width + 8, 18);
    g.fillStyle = "#6ee7ff"; g.fillText(label, lx, ty);
    g.shadowBlur = 10;
  }
  if (sl.markRect) {                             // マス移動：入るマス
    const m = sl.markRect;
    g.lineWidth = 2; g.setLineDash([5, 4]); roundRect(m.x, m.y, m.w, m.h, 5); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 0.12; g.fill(); g.globalAlpha = 1;
    if (sl.occupants && sl.occupants.length) {   // 先客がいる：離すと入れ替わる（よその空間からなら一番近い空きマスへ押す）
      const swap = sl.space === drag.space;
      g.shadowBlur = 0; g.strokeStyle = swap ? "#ffd479" : "#ff9db1"; g.lineWidth = 1.5; g.setLineDash([3, 3]);
      for (const o of sl.occupants) { const q = PLACE.get(o.id); if (q) { roundRect(q.x - 3, q.y - 3, q.w + 6, q.h + 6, 7); g.stroke(); } }
      g.setLineDash([]);
      const label = `${sl.occupants.map(o => o.title).join("・")}${swap ? "と入れ替わる" : "を空きマスへ押す"}`;
      g.font = `600 12px ${FONT}`; g.textBaseline = "bottom";
      const tw = g.measureText(label).width, lx = clamp(m.x, 4, VW - tw - 12), ty = m.y - 6 >= 18 ? m.y - 6 : m.y + m.h + 20;
      g.fillStyle = "rgba(8,10,17,.9)"; g.fillRect(lx - 4, ty - 16, tw + 8, 18);
      g.fillStyle = swap ? "#ffd479" : "#ff9db1"; g.fillText(label, lx, ty);
      g.shadowBlur = 10;

function draw() {
  g.clearRect(0, 0, VW, VH);
  const grd = g.createRadialGradient(VW / 2, VH / 2, 0, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  grd.addColorStop(0, "#141a2b"); grd.addColorStop(1, "#080a11");
  g.fillStyle = grd; g.fillRect(0, 0, VW, VH);
  g.strokeStyle = "rgba(110,231,255,.16)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(VW / 2 - 14, VH / 2); g.lineTo(VW / 2 + 14, VH / 2);
  g.moveTo(VW / 2, VH / 2 - 14); g.lineTo(VW / 2, VH / 2 + 14); g.stroke();

  for (const p of frameItems) drawBubble(p);
  drawRootRules();               // 外の空間の表（箱が無いので背景の空き地に）。中身が焦点 Z で全部消えても残る

  // 選択中の泡がいる空間（軸セレクタが効く空間）の中身の箱を薄く示す
  const sp = selectedId ? parentOf(selectedId) : "root";
  if (sp !== "root" && LAYOUT.get(sp) && LAYOUT.get(sp).host.alpha > 0.02) {   // 空間ごと消えていたら示さない
    const c = contentRect(LAYOUT.get(sp).host);
    g.globalAlpha = 0.45 * Math.min(1, LAYOUT.get(sp).host.alpha); g.strokeStyle = "#6ee7ff"; g.lineWidth = 1; g.setLineDash([2, 4]);
    roundRect(c.x + 1, c.y + 1, c.w - 2, c.h - 2, 6); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }
  drawDragMarks();
}

/* ============================================================
   §3 操作 ——「操作は軸に従う」
   ============================================================ */
/** 当たり判定は描いた順の逆（内側・手前が勝つ）。レンズが消した泡（dz<0 など）は、薄れていく途中でも掴めない */
function hitTest(mx, my, skip) {
  for (let i = frameItems.length - 1; i >= 0; i--) {
    const p = frameItems[i];
    if (!(p.vis > 0) || (skip && skip.has(p.id))) continue;
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h) return p;
  }
  return null;
}
/** 空間を持つ泡の「中身の箱」に入っているか（ヘッダは外側の空間のもの） */
const inContent = (p, my) => isHost(p.b) && my >= p.y + HEADER * p.scale;
/** カーソルの下の空間：中身の箱の上ならその空間、泡の上ならその泡がいる空間 */
function spaceAt(mx, my, skip) {
  const p = hitTest(mx, my, skip);
  return !p ? "root" : inContent(p, my) ? p.id : p.space;
}
const onHandle = (p, mx, my) => p && mx >= p.x + p.w - 12 && mx <= p.x + p.w + 3 && my >= p.y + p.h - 12 && my <= p.y + p.h + 3;
/**
 * 大きさの角。角は選択中の泡と一緒に描くので、当たり判定も同じ描いた順の逆で見る：
 * 手前に別の泡（中身も含む）が重なっていればそちらが勝ち、レンズが消した泡（vis 0）の角は掴めない
 */
function handleAt(mx, my) {
  for (let i = frameItems.length - 1; i >= 0; i--) {
    const p = frameItems[i];
    if (!(p.vis > 0)) continue;
    if (p.id === selectedId && onHandle(p, mx, my)) return p;
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h) return null;
  }
  return null;
}
const center = (p, axis) => axis === "x" ? p.x + p.w / 2 : p.y + p.h / 2;
const pt = e => { const r = cv.getBoundingClientRect(); return { mx: e.clientX - r.left, my: e.clientY - r.top }; };

cv.addEventListener("pointerdown", e => {
  const { mx, my } = pt(e);
  cv.setPointerCapture(e.pointerId);
  const sel = handleAt(mx, my);
  if (sel) {
    // 引くのは見えている箱の角：中身で伸びた箱なら、自前の大きさではなく伸びた大きさから始める（引いた分だけ角が動く）
    drag = { kind: "resize", id: sel.id, space: sel.space, started: true, mx0: mx, my0: my, size0: { ...measure(sel.b, new Map()) },
             scale: sel.scale, x0: sel.x, y0: sel.y, m: sel.m };
    return;
  }
  const p = hitTest(mx, my);
  if (p && !inContent(p, my)) {
    selectedId = p.id;
    raise(p.b);                      // ★ 触った泡は最前面へ（その空間の Z 軸が書けるなら。表の「触る」の行）
    const verbs = verbsOf(p.space);
    drag = {
      kind: "bubble", id: p.id, space: p.space, verbs,
      lock: OPTS.diag === "lock" && isMixed(verbs), locked: null,   // 比べる：動き始めの方向でロック（横と縦で違う操作の空間だけ）
      started: false, mx0: mx, my0: my, mx, my,
      fx: (mx - p.x) / p.w, fy: (my - p.y) / p.h, scale0: p.scale,
      skip: subtreeOf(p.id), slot: null,
    };
    verbFlags(drag);
  } else {
    // 背景：カーソルの下の空間の焦点を動かす（掴んだ点がカーソルについてくるように）
    const space = p ? p.id : "root", L = LAYOUT.get(space);
    drag = { kind: "focus", space, snapSpace: space, started: false, mx0: mx, my0: my,
             f0: { ...L.focus }, u0: { x: unprojectLocal(L, "x", mx), y: unprojectLocal(L, "y", my) } };
  }
});

cv.addEventListener("pointermove", e => {
  let { mx, my } = pt(e);
  if (!drag) { showCursorHint(mx, my); return; }
  hideCursorHint();
  if (!drag.started) {
    const dx = mx - drag.mx0, dy = my - drag.my0;
    if (Math.hypot(dx, dy) < (drag.lock ? LOCK_PX : 3)) return;
    if (drag.lock) {
      // 動き始めの方向でロック：主な方向の軸だけ残し、もう片方は離すまで止める（書かない・視点も動かさない・ついてこない）
      drag.locked = Math.abs(dx) >= Math.abs(dy) ? "x" : "y";
      drag.verbs[drag.locked === "x" ? "y" : "x"] = "held";
      verbFlags(drag);
    }
  }
  drag.started = true;
  // ★ ロックは入力の側で1回だけ当てる：止めた軸のポインタは、掴んだ点から動かなかったことにする。
  //   書く・視点を動かす・空間を移る・印・泡がついてくる、はみな同じ点を読むので、止めた軸はどこにも効かない
  //   （軸ごとに「書かない」を足していただけだと、空間を移る判定には止めた軸が効き、泡は動かないのに離すと隣の空間へ移った）
  if (drag.locked === "x") my = drag.my0; else if (drag.locked === "y") mx = drag.mx0;
  if (drag.kind === "resize") {
    const b = byId(drag.id), L = LAYOUT.get(drag.space);
    b.size.w = Math.max(40, drag.size0.w + (mx - drag.mx0) / drag.scale);
    b.size.h = Math.max(HEADER + 10, drag.size0.h + (my - drag.my0) / drag.scale);
    // 大きさを変えても、位置が書ける軸（自由）では左上を動かさない：新しい箱の中心がそこに来るように位置を書く。
    // 位置が View で決まる軸（詰める・等間隔）では、並べ方の答えに任せる
    const box = measure(b, new Map());
    for (const axis of ["x", "y"]) {
      if (verbOf(L.V[axis].dim) !== "coord") continue;
      const want = axis === "x" ? drag.x0 + box.w * drag.scale / 2 : drag.y0 + box.h * drag.scale / 2;
      b.free[DIMS[L.V[axis].dim].key] = valueFromPos(L, axis, screenToAxis(L, axis, want, drag.m));
    }
    drag.snapSpace = drag.space;
  } else if (drag.kind === "focus") {
    const L = LAYOUT.get(drag.space);
    for (const axis of ["x", "y"]) {
      if (L.V[axis].dim === "none") continue;                 // なしの軸は何も起きない
      // 掴んだ点の u が u0 → いま に変わった分だけ焦点を戻す（掴んだ点がカーソルについてくる）
      setFocusAxis(L, axis, drag.f0[axis] + drag.u0[axis] - unprojectLocal(L, axis, axis === "x" ? mx : my));
    }
  } else {
    moveBubble(mx, my);
  }
});

/** 軸ごとの動詞から、泡のドラッグで何が要るか（ロックで片方の軸を止めたら、ここを当て直す） */
function verbFlags(d) {
  const vs = [d.verbs.x, d.verbs.y];
  d.moves = vs.some(v => v === "coord" || v === "reorder" || v === "cell");   // 泡が動くときだけ空間を移れる
  d.lift = vs.some(v => v === "reorder" || v === "cell");                     // 並べ替え・マス移動はカーソルについてくる
  d.snapSpace = vs.includes("focus") ? d.space : null;
}
/** 泡のドラッグ：軸ごとに、書けるなら書く／書けないなら焦点／なしなら何もしない */
function moveBubble(mx, my) {
  drag.mx = mx; drag.my = my;
  const p = PLACE.get(drag.id), b = p.b, L = LAYOUT.get(drag.space);
  for (const axis of ["x", "y"]) {
    const verb = drag.verbs[axis];
    // 泡の中心をどこへ持っていきたいか（掴んだ点と泡の相対位置を保つ）
    const want = axis === "x" ? mx - (drag.fx - 0.5) * p.w : my - (drag.fy - 0.5) * p.h;
    if (verb === "coord") {
      // ★ 書き込む先はその軸に刺さっている次元（free.x 決め打ちにしない）
      b.free[DIMS[L.V[axis].dim].key] = valueFromPos(L, axis, screenToAxis(L, axis, want, p.m));
    } else if (verb === "focus") {
      // 泡のいまの u（位置 − ctx の焦点）が、行きたい u になるまで焦点を動かす
      setFocusAxis(L, axis, L.focus[axis] + (p.pos[axis] - L.ctx.focus[axis]) - unprojectLocal(L, axis, want, p.m));
    }
  }
  if (drag.moves) drag.slot = slotAt(mx, my);
}
/**
 * 掴んでホイール：掴んだ泡がいる空間の Z の次元に書く（書けないなら false ＝ 掴んでいても視点）。
 *  - 手前は焦点まで：焦点より手前（dz<0）はレンズが写さない所なので、そこへは置けない（X・Y の約束(1)「見ている所には泡がある」と同じ）
 *  - 画面の位置は変えない：奥行きが変われば透視の倍率も変わるので、いま見えている中心を、新しい倍率で書き直す
 */
function writeDepth(deltaY) {
  const L = LAYOUT.get(drag.space), b = byId(drag.id), p = PLACE.get(drag.id);
  if (!L || !p || verbOf(L.V.z.dim) !== "coord") return false;
  const key = DIMS[L.V.z.dim].key;
  b.free[key] = Math.max(L.ctx.focus.z, b.free[key] + deltaY * 0.004);
  const m = LENS_Z[L.V.z.lens].mag(b.free[key] - L.ctx.focus.z);
  for (const axis of ["x", "y"]) {
    if (verbOf(L.V[axis].dim) !== "coord") continue;
    const want = axis === "x" ? p.x + p.w / 2 : p.y + p.h / 2;
    b.free[DIMS[L.V[axis].dim].key] = valueFromPos(L, axis, screenToAxis(L, axis, want, m));
  }
  return true;
}

/**
 * 離したらどこへ入るか。
 *  - カーソルの下の空間（掴んだ泡とその中身は除く）
 *  - ただし書ける軸が無い空間には落とせない（acceptsDrop）ので、落とせる一番内側の空間まで外へたどる
 *  - 今いる空間の外へ出るのは、中身の箱から PULL 以上離れたときだけ（中の空間へ入るのは点が入ればすぐ）
 *  - その空間の View に従って、書く値（順序の差し込み位置・マス・自由座標）を決める
 */
function slotAt(mx, my) {
  let space = spaceAt(mx, my, drag.skip);
  // ★ その点は外側の空間の中でもある。書ける軸が無い空間（視点が動くだけの空間）は飛ばして外へたどる
  while (space && space !== drag.space && !acceptsDrop(space)) space = parentOf(space);
  if (!space) space = drag.space;                     // どこも受け取れないなら、いまの空間のまま
  // isAncestor が真＝カーソルの下はいまの空間の内側（入れ子の中へ）なので、そのまま入る。root もこの式で決まる（外側なので出る相手が無い）
  if (space !== drag.space && !isAncestor(drag.space, space)) {
    const c = contentRect(LAYOUT.get(drag.space).host);
    if (mx > c.x - PULL && mx < c.x + c.w + PULL && my > c.y - PULL && my < c.y + c.h + PULL) space = drag.space;
  }
  const L = LAYOUT.get(space);
  if (!L) return null;
  const p = PLACE.get(drag.id);
  const slot = { space, order: null, cell: {}, coord: {}, markLine: null, markRect: null };
  const sibs = kidsOf(space).filter(k => !drag.skip.has(k.id)).map(k => PLACE.get(k.id)).filter(Boolean);
  const box = contentRect(L.host);
  const cellRange = {};

  for (const axis of ["x", "y"]) {
    const A = L.V[axis], verb = verbOf(A.dim), cur = axis === "x" ? mx : my;
    // ロックで止めた軸は、同じ空間の中では書かない・印も出さない（ポインタはその軸で動いていないことになっている。pointermove）
    if (space === drag.space && drag.verbs[axis] === "held") continue;
    if (verb === "reorder") {
      const sorted = sibs.slice().sort((a, c) => center(a, axis) - center(c, axis));
      const idx = sorted.filter(s => center(s, axis) < cur).length;
      const near = s => axis === "x" ? s.x : s.y, far = s => axis === "x" ? s.x + s.w : s.y + s.h;
      const half = GAP / 2 * L.host.scale;
      const at = !sorted.length ? (axis === "x" ? L.host.cx : L.host.cy)
               : idx === 0 ? near(sorted[0]) - half
               : idx === sorted.length ? far(sorted[idx - 1]) + half
               : (far(sorted[idx - 1]) + near(sorted[idx])) / 2;
      slot.order = { idx, list: sorted.map(s => s.b) };
      slot.markLine = { axis, at, from: axis === "x" ? box.y + 4 : box.x + 4, to: axis === "x" ? box.y + box.h - 4 : box.x + box.w - 4 };
    } else if (verb === "cell") {
      const pos = screenToAxis(L, axis, cur);
      const len = axis === "x" ? p.box.w : p.box.h;
      const { value, start, end } = cellFromBands(L.arr[axis].bands, pos, len);
      slot.cell[DIMS[A.dim].key] = value;
      cellRange[axis] = [axisToScreen(L, axis, start), axisToScreen(L, axis, end)];
    } else if (verb === "coord") {
      const want = cur - ((axis === "x" ? drag.fx : drag.fy) - 0.5) * (axis === "x" ? p.w : p.h);
      slot.coord[DIMS[A.dim].key] = valueFromPos(L, axis, screenToAxis(L, axis, want, 1));
    }
  }
  if (cellRange.x || cellRange.y) {
    const [x0, x1] = cellRange.x ?? [box.x, box.x + box.w], [y0, y1] = cellRange.y ?? [box.y, box.y + box.h];
    slot.markRect = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    // 先客：移った先で、X・Y どちらの次元で読んでも同じ値になる兄弟（＝同じ位置に置かれて重なる泡）
    const probe = { ...p.b, cell: { ...p.b.cell, ...slot.cell } };
    const same = k => ["x", "y"].every(ax => DIMS[L.V[ax].dim].read(k, space) === DIMS[L.V[ax].dim].read(probe, space));
    const stay = space === drag.space && Object.keys(slot.cell).every(key => slot.cell[key] === p.b.cell[key]);
    slot.occupants = stay ? [] : sibs.map(s => s.b).filter(same);    // 元のマスのままなら誰も動かない
  }
  return slot;
}

/**
 * 同じ空間で、cell に一番近い空きマス（exclude は数えない）。
 * よその空間から来た泡には「空けたマス」が無いので、先客はここへ逃がす（重ねたままにすると上下が View から決まらない）。
 */
function freeCellNear(spaceId, cell, exclude) {
  const keys = Object.keys(cell);
  const taken = new Set(kidsOf(spaceId).filter(k => k !== exclude)
    .map(k => keys.map(key => k.cell[key]).join(",")));
  for (let r = 1; r < 32; r++)
    for (const d of keys.length === 1 ? [[r], [-r]] : [[r, 0], [0, r], [-r, 0], [0, -r], [r, r], [-r, r], [r, -r], [-r, -r]]) {
      const cand = Object.fromEntries(keys.map((key, i) => [key, Math.max(0, cell[key] + (d[i] ?? 0))]));
      if (!taken.has(keys.map(key => cand[key]).join(","))) return cand;
    }
  return cell;
}

/** 位置 → マス。帯（と前後の隙間の半分）に入っていればその値、最後の帯より先なら新しい帯 */
function cellFromBands(bands, pos, len) {
  if (!bands.length) return { value: 0, start: -len / 2, end: len / 2 };
  const first = bands[0], last = bands[bands.length - 1];
  if (pos > last.end + GAP / 2) return { value: last.value + 1, start: last.end + GAP, end: last.end + GAP + len };
  if (pos < first.start - GAP / 2 && first.value > 0)
    return { value: first.value - 1, start: first.start - GAP - len, end: first.start - GAP };
  const bd = bands.find(x => pos <= x.end + GAP / 2) ?? last;
  return { value: bd.value, start: bd.start, end: bd.end };
}

function endDrag() {
  if (!drag) return;
  if (drag.kind === "bubble" && drag.started && drag.moves) commitDrop();
  drag = null;
}
/** 離したら確定：空間が変わったら親を付け替え、親の View に従って値を書く */
function commitDrop() {
  const slot = slotAt(drag.mx, drag.my);
  if (!slot) return;
  const b = byId(drag.id), p = PLACE.get(drag.id), moved = slot.space !== drag.space;
  // 順序は「兄弟の中での順番」：親を付け替えたら、出た空間と入った空間の兄弟を 0.. に振り直す
  // （出た空間に欠番を残すと、等間隔では抜けた番号の所が穴になる）。入った先に差し込み位置が無ければ一番後ろ
  const byOrder = (q, r) => q.order - r.order;
  const renumber = list => list.forEach((k, i) => { k.order = i; });
  if (moved) {
    b.parent = slot.space === "root" ? null : slot.space;
    renumber(kidsOf(drag.space).filter(k => k !== b).sort(byOrder));   // KIDS は付け替える前のまま
    reindex();                       // ここから先（raise・先客の逃げ先）は、付け替えたあとの兄弟で決める
  }
  if (slot.order) {
    const list = slot.order.list.slice();
    list.splice(slot.order.idx, 0, b);
    renumber(list);
  } else if (moved) {
    renumber([...kidsOf(slot.space).filter(k => k !== b).sort(byOrder), b]);
  }
  raise(b);                          // ★ 置いた泡も最前面へ（Z 軸が書けるなら。置いた順は持たない）
  // ★ 同じマスに2つ入れない。マス移動は兄弟の値の入れ替え：
  //   同じ空間の中なら、先客は掴んだ泡が空けたマスへ移る（順序の差し込みが番号を振り直すのと同じ）。
  //   よその空間から来た泡には空けたマスが無いので、先客は空いているいちばん近いマスへ逃がす
  //   （前は重ねたままにして「置いた順」で上下を決めていたが、その状態は公理の外だったのでやめた。土台 00-core と同じ）
  if (slot.occupants && slot.occupants.length) {
    // 空けたマスは1つだけ（同じ空間の中で入れ替わる先客1人ぶん）。それ以外の先客は、1人ずつ一番近い空きマスへ
    let vacated = moved ? null : Object.fromEntries(Object.keys(slot.cell).map(k => [k, b.cell[k]]));
    Object.assign(b.cell, slot.cell);            // 先に掴んだ泡を入れる（先客の逃げ先に、このマスを選ばせない）
    for (const k of slot.occupants) {
      Object.assign(k.cell, vacated ?? freeCellNear(slot.space, slot.cell, k));
      vacated = null;
    }
  }
  Object.assign(b.cell, slot.cell);
  if (moved) {
    Object.assign(b.free, slot.coord);
    const Lz = LAYOUT.get(slot.space);
    // 奥行きは見えている焦点の面へ（X・Y を倍率 1 で逆写しした slot.coord と同じ面。ctx は読むだけ）
    if (verbOf(Lz.V.z.dim) === "coord") b.free[DIMS[Lz.V.z.dim].key] = Lz.ctx.focus.z;
  }
  if (moved || drag.lift) {
    // いま見えている場所から、新しい場所へ補間する（新しい親の中身の座標に直す）
    const H = LAYOUT.get(slot.space).host;
    anim.set(b.id, { x: (p.x + p.w / 2 - H.cx) / H.scale, y: (p.y + p.h / 2 - H.cy) / H.scale,
                     scale: p.scale / H.scale, alpha: 1, w: p.box.w, h: p.box.h });
  }
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("lostpointercapture", endDrag);

/**
 * ホイール：奥行き（Z）の軸。
 *  - 泡を掴んでいるなら、その泡がいる空間の Z の次元に 書けるなら書く（横・縦のドラッグと同じ「掴んだら書く」）
 *  - 掴んでいないなら、カーソルの下の空間の焦点 Z。Z が なし なら何もしない
 */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const { mx, my } = pt(e);
  // ★ 掴んでホイール＝Z の次元に書く。書ける軸が無ければ、掴んでいても「視点」（下の判定へ落ちる）
  if (drag && drag.kind === "bubble" && writeDepth(e.deltaY)) return;
  const target = wheelTarget(drag && drag.kind === "bubble" ? drag.space : spaceAt(mx, my)), L = target && LAYOUT.get(target);
  if (!L) return;                       // Z が なし（比べる：何もしない）。外へ渡すなら Z を持つ一番近い外の空間（wheelTarget）
  // 手前へは 1 退いて全体を見られる。奥へは一番奥の泡まで、自由Zで「止める」なら一番手前の面まで（Z の約束。fitFocus）
  setFocusAxis(L, "z", spaceObj(target).focus.z + e.deltaY * 0.004);
  hintAt = { mx, my };                  // ヒントは次のフレームで、動かした焦点の配置から作る

/** ホイールで焦点 Z が動く空間。Z が なし なら null（何もしない）か、外の空間へ渡す（Z を持つ一番近い外の空間） */

/**

/* ── 右上：空間の一覧（入れ子のツリー） ── */
function spacesHtml() {

    // ★ 消えた空間は画面から読めなくなるので、空間の一覧にだけは出す（第1回：真っ暗になった理由が画面に無かった）
    const f = spaceObj(id).focus;

    // その空間自身の焦点 Z が消した泡だけ数える（外の空間が消した分は、外の空間の行に出る）
    const off = kidsOf(id).map(k => PLACE.get(k.id)).filter(p => p && !p.hit);
    const faint = off.filter(p => p.alpha > 0.02).length;

      `<div class="sp" style="padding-left:${depth * 12}px">${depth ? "└ " : "▸ "}${nameHtml(id)}` +
      `  <span class="${V.own ? "own" : "inh"}">${V.own ? "自前" : "継承"}</span>` +
      `  <span class="${S.cls}">${S.text}</span>${id === cur ? ' <span class="cur">← 選択中</span>' : ""}` +

    for (const k of kidsOf(id)) if (isHost(k)) walk(k.id, depth + 1);

/* ── その下：選択中の泡 ── */

    p.vis > 0 ? "" : k("見え方", p.alpha > 0.01 ? `<span class="fix">薄い</span>（焦点 Z より手前。掴めない）` : `<span class="fix">見えない</span>（焦点 Z より手前。掴めない）`),

/**
 * 焦点を戻す：選択中の泡がいる空間から、外の空間まで、道筋の空間の焦点をぜんぶ 0 に。
 * ★ 泡の見え方は入れ子ごとに親の View で決まる（公理）ので、泡が見えるには外側の空間ぜんぶが見えていないといけない。
 *   いる空間だけ戻していたので、外の空間の焦点 Z で空間ごと消えたとき戻せなかった（第1回）
 */
document.getElementById("refocus").onclick = () => {
  for (let id = targetSpace(); id; id = parentOf(id)) Object.assign(spaceObj(id).focus, { x: 0, y: 0, z: 0 });
};
/* 比べる：押したボタンの値を OPTS に書くだけ。言葉も操作も OPTS を読むので、ほかに何もしない */
const optButtons = [...document.querySelectorAll("[data-opt]")];
function setOption(key, val) {
  if (!(key in OPTS) || !optButtons.some(b => b.dataset.opt === key && b.dataset.val === val)) throw new Error(`比べるものが無い: ${key}=${val}`);
  OPTS[key] = val;
  for (const b of optButtons) b.classList.toggle("on", OPTS[b.dataset.opt] === b.dataset.val);
}
optButtons.forEach(btn => { btn.onclick = () => setOption(btn.dataset.opt, btn.dataset.val); });
for (const k in OPTS) setOption(k, OPTS[k]);
{
  const hintEl = document.getElementById("hint"), DEFAULT = hintEl.innerHTML;
  for (const el of document.querySelectorAll("[data-hint]")) {
    el.addEventListener("mouseenter", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("focus", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("mouseleave", () => { hintEl.innerHTML = DEFAULT; });
  }
}

const panelCache = {};
function setHtml(id, html) { if (panelCache[id] !== html) { panelCache[id] = html; document.getElementById(id).innerHTML = html; } }
function updatePanels() {
  setHtml("spaces", spacesHtml()); setHtml("selection", selectionHtml()); syncToolbar();
  if (hintAt && !drag) showCursorHint(hintAt.mx, hintAt.my);
}

/* ============================================================
   ループ
   ============================================================ */
function frame() { resolveAll("step"); draw(); updatePanels(); }
function settle() { resolveAll("snap"); resolveAll("snap"); draw(); updatePanels(); }
function loop() { frame(); requestAnimationFrame(loop); }

/* ============================================================
   §6 検証用の口（座標はページのビューポート座標）
   ============================================================ */
const offset = () => { const r = cv.getBoundingClientRect(); return { x: r.left, y: r.top }; };
const outPlace = p => { const o = offset();
  return { id: p.id, x: p.x + o.x, y: p.y + o.y, w: p.w, h: p.h, scale: p.scale, local: p.local, depth: p.depth, space: p.space, alpha: p.alpha, vis: p.vis }; };
window.__lab = {
  select(id) { selectedId = id; lastSig = ""; },
  selectedId: () => selectedId,
  bubbles: () => JSON.parse(JSON.stringify(bubbles)),
  viewOf: id => { const v = viewOf(id); return JSON.parse(JSON.stringify({ x: v.x, y: v.y, z: v.z, focus: v.focus, own: v.own })); },
  setAxis(spaceId, axis, patch) { setAxis(spaceId, axis, patch); lastSig = ""; },
  preset(name, spaceId) { applyPreset(name, spaceId ?? targetSpace()); lastSig = ""; },
  placements: () => frameItems.map(outPlace),
  rectOf(id) { const p = PLACE.get(id); if (!p) return null; const o = outPlace(p); return { x: o.x, y: o.y, w: o.w, h: o.h }; },
  /** ヘッダの中で、実際にその泡に当たる点（手前の泡に隠れていない点）を探す */
  headerPointOf(id) {
    const p = PLACE.get(id); if (!p) return null;
    const o = offset(), y = p.box.h <= 34 ? p.y + p.h / 2 : p.y + Math.min(12 * p.scale, p.h / 2);
    for (const t of [0.35, 0.5, 0.2, 0.65, 0.8, 0.1, 0.9]) {
      const x = p.x + p.w * t, hit = hitTest(x, y);
      if (hit && hit.id === id && !inContent(hit, y)) return { x: x + o.x, y: y + o.y };
    }
    return { x: p.x + p.w * 0.35 + o.x, y: y + o.y };
  },
  focusOf: id => ({ ...spaceObj(id).focus }),
  /* この案で足した口 */
  options: () => ({ ...OPTS }),
  setOption(key, val) { setOption(key, val); },
  /**
   * その空間の中で、泡を横・縦に引いたとき（x, y）／背景を引いたとき（bg.x, bg.y）／
   * ホイール（wheel＝掴まない・wheelGrab＝泡を掴んだまま）／よそへ引いたとき（cross）のルール（空間の中の表の元）
   */
  rulesOf: id => JSON.parse(JSON.stringify({ x: dragRule(id, "x"), y: dragRule(id, "y"), touch: touchRule(id),
                                             wheel: wheelRule(id, false), wheelGrab: wheelRule(id, true), cross: crossRule(id),
                                             bg: { x: backgroundRule(id, "x"), y: backgroundRule(id, "y") } })),
  /** 空間の中に、いま描いてある表（["横ドラッグ：泡 ○○／背景 ○○", "縦ドラッグ：…", "ホイール：…", "よそへ引く：…"]）。root も出す */
  captionOf: id => CAPTIONS.get(id) ?? null,
  /** 泡を掴んで空間をまたぐときのルール（表の「よそへ引く」の行。落とせない空間では kind:"none"） */
  crossRuleOf: id => JSON.parse(JSON.stringify(crossRule(id))),
  /** 泡を触ったときのルール（表の「触る」の行） */
  touchRuleOf: id => JSON.parse(JSON.stringify(touchRule(id))),
  /** その空間へ泡を落とせるか（書ける軸があるか） */
  acceptsDrop: id => acceptsDrop(id),
  /**
   * 空間の中の表の字の上の点（ページ座標）。row は上から数えた行（0 始まり）。
   * 列に分かれる行が1つでもあれば row 0 は「泡／背景」の見出しで、行はその下から。分かれる行が無ければ row 0 が最初の行。
   * col 0＝行の名前、1＝泡の列（分かれない行の答えもここ）、2＝背景の列。captionRows(id) で行数と見出しの有無が分かる
   */
  captionPoint(id, row, col = 0) {
    const t = CAPTION_AT.get(id); if (!t) return null;
    const o = offset();
    return { x: [t.left, t.x1, t.x2][col] + 4 + o.x, y: t.rowY(row) + o.y };
  },
  captionRows: id => { const t = CAPTION_AT.get(id); return t ? { rows: t.rows, head: t.split } : null; },
  wheelTarget: id => wheelTarget(id),
  /** ページ座標の点の下の空間（ホイールが読む空間） */
  spaceAt(x, y) { const o = offset(); return spaceAt(x - o.x, y - o.y); },
  resetFocus() { for (const sp of [ROOT, ...bubbles]) Object.assign(sp.focus, { x: 0, y: 0, z: 0 }); },
  layoutOf(id) { const L = LAYOUT.get(id); return L && { host: L.host, H: L.ctx.H, vp: L.ctx.vp }; },
  frame() { frame(); },
  settle() { settle(); },
};

resize();
settle();
requestAnimationFrame(loop);
</script>
</body>
