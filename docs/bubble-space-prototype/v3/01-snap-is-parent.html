<body>
<div id="app">
  <div id="bar">
    <div class="row">
      <span class="case">案1 スナップは、見えない親の並べ方</span>
      <span class="sep"></span>
      <span class="grp"><span class="lbl">比べる① 見えない親</span>
        <button data-toggle="show" data-value="hide" data-hint="見えない親を <b>隠す</b>。並んだ2つだけが見える（スナップの見た目）">隠す</button>
        <button data-toggle="show" data-value="faint" data-hint="見えない親を <b>うっすら枠</b> で見せる。並びが1つの泡（横に並べる View を持つ親）だと分かる">うっすら枠</button></span>

        <button data-toggle="size" data-value="seen" data-hint="並びは <b>奥行きをかけた見かけの大きさ</b> で詰める。画面で縁が接する（その軸は消失点へ寄せない）">見かけ（×奥行き）</button></span>
      <span class="grp"><span class="lbl">比べる③ 並びを掴む</span>
        <button data-toggle="grab" data-value="edge" data-hint="並び全体を動かすには <b>見えない親の縁</b>（並びの外周 12px）を掴む">親の縁</button>
        <button data-toggle="grab" data-value="alt" data-hint="並び全体を動かすには <b>⌥（Alt）を押しながら</b> 並びの中の泡を掴む">⌥＋掴む</button>
        <button data-toggle="grab" data-value="lead" data-hint="並び全体を動かすには <b>先頭の泡</b> を掴む（先頭は並べ替え・外すができなくなる）">先頭の泡</button></span>
    </div>
    <div class="row">
      <span class="lbl">プリセット</span>
      <button data-preset="free" data-hint="選択中の泡がいる空間を <b>自由に置く</b> に。X・Y は自由座標そのまま、Z は透視。中の泡を掴むと動く">自由に置く</button>
      <button data-preset="row" data-hint="選択中の泡がいる空間を <b>横に並べる</b> に。X は順序を詰めて並べる。掴むと並べ替わる">横に並べる</button>
      <button data-preset="column" data-hint="選択中の泡がいる空間を <b>縦に並べる</b> に。Y は順序を詰めて並べる。掴むと並べ替わる">縦に並べる</button>
      <button data-preset="grid" data-hint="選択中の泡がいる空間を <b>格子</b> に。X は列、Y は行を詰めて並べる。掴むと別のマスへ移る">格子</button>
      <button data-preset="fisheyeX" data-hint="選択中の泡がいる空間を <b>X魚眼ビュー</b> に。X は履歴の世代を魚眼で、Y は履歴の枝を平行で。掴むと視点が動く">X魚眼ビュー</button>
      <button data-preset="coverflow" data-hint="選択中の泡がいる空間を <b>coverflow</b> に。X は順序を等間隔に魚眼で。背景を横に引くとスライドする">coverflow</button>
      <button data-preset="histZ" data-hint="選択中の泡がいる空間を <b>履歴を奥行きに</b>。Z は履歴の古さを透視で。ホイールで時間を行き来する">履歴を奥行きに</button>
      <button data-preset="stackZ" data-hint="選択中の泡がいる空間を <b>重ねて置く</b>。X・Y は自由、<b>Z は順序</b>。泡を触ると最前面へ並べ替わる（重ねた紙のように）">重ねて置く</button>
      <span class="sep"></span>
      <button id="inherit" data-hint="選択中の泡がいる空間の自前の View を捨てて、<b>外の空間の並べ方を継ぐ</b>（焦点は継がない）">外から継ぐ</button>

      <span class="axis">X</span>

      <select data-axis="x" data-part="lens" data-hint="横の位置を画面に写す式。<b>平行</b>＝そのまま／<b>魚眼</b>＝焦点の近くを大きく、端を詰める"></select>
      <span class="axis">Y</span>
      <select data-axis="y" data-part="dim" data-hint="縦に何を読むか。自由＝動く／順序＝並べ替わる／列・行＝マスを移る／履歴＝視点が動く"></select>
      <select data-axis="y" data-part="arrange" data-hint="値を位置にする決め方。そのまま＝px／等間隔＝値×間隔／詰める＝値ごとの帯"></select>
      <select data-axis="y" data-part="lens" data-hint="縦の位置を画面に写す式。平行／魚眼"></select>
      <span class="axis">Z</span>
      <select data-axis="z" data-part="dim" data-hint="奥行きに何を読むか。<b>なし</b>ならホイールは何もしない"></select>
      <select data-axis="z" data-part="arrange" data-hint="奥行きの値の決め方。そのまま／等間隔（値×1）／詰める（値の順位）"></select>
      <select data-axis="z" data-part="lens" data-hint="奥行きの写し方。<b>透視</b>＝消失点へ寄せて小さく／<b>平行</b>＝奥行きを見た目に使わない"></select>

    <div id="hint">ボタンやセレクトにマウスを乗せると、ここに意味が出ます。</div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="side">
      <div class="box" id="spaces"></div>
      <div class="box" id="selection"></div>

    <div class="box" id="cursor-hint"></div>
    <div class="box" id="compare"></div>
    <div class="box" id="help">
      泡を別の泡の <b>左右（上下）の縁</b>へ寄せて離す … 見えない親が生まれ、横（縦）に並ぶ<br>
      並びの中を横に引く … <b>並べ替わる</b>　大きく引き離す … <b>抜ける</b>（残り1つなら親は消える）<br>
      並びごと動かす … ③ のやり方で　ホイール … 奥行き　右下の角 … 大きさ

<script>
"use strict";
/* ============================================================================
   bubble-lab v3 · 01-snap-is-parent —— スナップは、見えない親の並べ方
   土台：00-core.html（公理だけで組んだもの）を複製して、スナップだけを足した。
   仕様：docs/bubble-space-prototype/v3/SPEC.md（語彙・画面の約束はそこが正）

   公理（案）
     泡の見え方は、その泡を入れている親の View で決まる。
     View は軸（X・Y・Z）ごとに「次元」「並べ方」「レンズ」を持つ。
     これが入れ子ごとに繰り返される。
     ＋ この案：「A の左に B がスナップしている」＝「見えない親 X が、中身を左右に並べる View を持っている」。
       隣り合う、という関係は持たない。スナップで起きるのは親子の付け替えだけ。

   この案で確かめること
     - スナップの体験（縁へ寄せる → 印 → 離すと並ぶ → 並べ替え → 引き離すと抜ける）が、親子と View だけで保てるか
     - 配置の経路が本当に1つで済むか（見えない親の View 以外で位置を決めていないか）
     - 第1版 制約13「リストの隣に、リストより手前でアイテムを大きく」が、Z を自由にした見えない親で書けるか

   ルール（この案が足すもの。イベントごとの分岐ではなく、この4つ）
     R1 くっつける：泡 D を、自由に置いた泡 T の縁（画面上で 24px 以内、直交方向に小さい方の 40% 以上重なる）へ寄せて離すと、
        T の席に見えない親 X が生まれ、T と D が X に入る。X の View は
        縁の軸：順序・詰める・平行（隙間 0）／もう一方：なし・詰める・平行
     R2 並びに加わる：T がすでに見えない親の中にいて、縁が並びの軸なら、T の隣へ差し込む（縁が並びと直交なら R1 が入れ子で起きる）
     R3 並びは2つ以上：見えない親の子が1つになったら親は消え、残った泡が親の席（親・順序・マス）を継ぐ
     R4 見えない親は体を持たない。ほかは全部これの言い直し：
        ・箱は中身ぴったり（ヘッダ 0・余白 0。どの並べ方でも「自前の大きさ」が無い）
        ・奥行きに置かれない。Z の軸そのものを持たない（次元・並べ方・レンズ・焦点の全部が窓＝外の空間のもの）
        ・View を選べない（並べるために生まれたので、並べるだけ）。軸セレクタもプリセットも窓へ回る
        ・当たるのは外周だけ。見えている子がいなければ、枠も縁も無い
        ・空間の出入りも窓で数える（くっつけるは落とし込みの1つ：離す先を土台の決まり（外へは箱から PULL 以上）で決め、
          相手の窓がその窓と同じときだけ効く）

   土台へ返した決まり（この案のものではない。SPEC と 00-core が同じことを言っている）
     ・pin「触っていない泡は、画面の上で動かない」＝ SPEC §3。「位置＝箱の中心」を選んだことから出る補正
     ・奥行き「空間を移っても見えている大きさを保つ」＝ 00-core の「移った先では焦点の面へ」の言い直し（倍率 1 なら同じ答え）
     ・raise「触った泡は、その空間の Z の次元が書けるならそこへ書く」＝ SPEC §3
     ・freeCellNear「格子の同じマスへよそから入ったら、先客を一番近い空きマスへ押す」＝ 00-core

   確かめたこと（検証の道具は _check/ に置いてある。本物のブラウザを本物のマウスで動かして測る）
     _check/01-audit.mjs        … ここに書いた数字を1つずつ測り直す（27 項目）
     _check/01-rules.mjs        … どの決まりが何回発動するかを数える
     _check/01-raise.mjs        … raise（触った泡は最前面へ）と 奥行き がぶつからないか
     _check/01-rule5.mjs        … 奥行きを切って比べる
     _check/01-join-or-born.mjs … 決まり2（並びに加わる）を切って比べる
     - くっつける → 親が生まれる → 並べ替え → 加わる → 入れ子 → 外す → 親が消える、が親子と View だけで通る。相手は 0.0px も跳ばない
       （寄せた泡だけが縁まで 21px 動く）。起動時の 勤務表＋希望シフト もドラッグと同じ関数（snapOp → reshape）で並べた
     - 配置を決めるのは resolveSpace だけ（1つ）。位置を「書く」所は 3 つ：自由次元のドラッグ（土台）、pin の書き戻し（付け替え・角）、奥行き。
       スナップ自体は親子と順序しか書かない
     - 勤務表（中に格子）を並びの子にしても、中の 10 個の配置は外にいるときと差 0.0000px。日のマス移動も効く（depth 4、倍率 1）
     - 詰める大きさ：[メモ一覧(z=+1), 買い物] で 自前 すき間 30.95px（=150×(1−1/1.26)）／見かけ 0.00px。
       [買い物, メモ一覧] だと 自前 は 35.08px 重なる／見かけ 0.00px

   踏んだこと（作って試して分かったこと）
     - 自前で詰めると、奥の泡の縮みは「並びの左上（消失点）へ寄せる」形で効くので、すき間は並びの中の位置で変わった：
       先頭なら 31px 空き、2番目なら 35px 重なり、その後ろの付箋A とは 66px 空いた。スナップの「縁が接する」は自前では保てない。
       見かけで詰めてその軸は消失点へ寄せないと、どの順でも 0px。ただしそのとき並べ方が Z のレンズの答え（倍率）を先に読むので、
       §2 の「軸ごとに 値→位置→画面」は独立でなくなり、Z を先に解く順番が要った
     - 見かけで詰めると、焦点 Z を動かすたびに並びの形が変わる：root で奥へ1回ホイールすると、手前の買い物が消えて見かけ 0 になり、
       並びが中央へ縮んでメモ一覧が 80px 右へ動いた（pin は付け替えのときだけ。毎フレームは留めない）。自前なら左上に留まる
     - 生まれた親の座標を相手の座標の写しにしただけだと、相手（メモ一覧）が (−223, −56)px 跳んだ（詰めるは塊の中央を箱の中心に置き、
       箱の中心が自由座標なので）。並びの前へ差し込む（R2）だけでも相手は 35px ずれた。View だけでは「動かさなかった泡は動かない」が決まらず、
       付け替えのあとに測って書き戻す pin が要った。並びの中で買い物の角を 40px 引いても、並びは中央から伸びて前のメモ一覧が (−20, −10)px ずれたので、角にも pin を当てた
     - 最初は見えない親を奥行きに置き、焦点 Z も持たせていた。すると
       (1) root で奥へホイールしても焦点が 0 のまま動かなくなった（z=+1 のメモ一覧が並びの中へ入り、root の「奥は一番奥の泡まで」から消えた）
       (2) 並びの中の買い物の上でホイールすると並びの焦点が 0.4 になって買い物が消え、同じ場所で戻すと（消えた泡は当たらないので）
           root の焦点が −0.8 まで動き、並びの焦点は戻せなかった。見えない親は体が無いので、中が消えると指せる所が無くなる
       透視の倍率は入れ子で積にならない（m(0−f)·m(z−0) ≠ m(z−f)）ので、見えない親に Z を持たせる限りスナップの前後で奥行きの見え方が変わる。
       R4（Z を通す）にすると、スナップしてもホイールの効き方が前と同じ（買い物は消え、メモ一覧 ×0.865）
     - 見えない親の子が全部焦点より手前で消えても、見えない親の枠（うっすら）だけが残って空の点線が浮いた。
       体が無いので「見えている子がいるときだけ見える」にした（枠も縁の当たりも）
     - 付箋B を並びの中の買い物の下へ付けると（入れ子）、並び全体が下へ伸びて勤務表の見出しに重なった。伸びた箱は隣を押さない（土台と同じ根）
     - 自前で詰めると、見えない親の箱（自前の幅の合計）は画面の中身より広くなる（[買い物, メモ一覧] で右に 66px 余る）。
       点線の枠は中身より大きく、そこでは「外す」の 48px も余りの外から数える
     - 並びの中の泡は Y が なし なので、並びの箱＋48px の外へ出るまで縦に動かない。検証で「並びのすぐ隣」へ落としたら外れず並べ替えになった
     - 先頭の泡で掴むやり方では、先頭は並べ替えも外すもできない（先頭でない泡を前へ回してから）。⌥ は画面に出ないので、ヒントで言うしかない

   踏んだこと（第1回の検証で見つかった穴を直して分かったこと）
     - くっつけるが、空間から出る2本目の道になっていた。縁は相手 T の居場所（自由か並びか）しか見ず、掴んだ泡の居場所も
       土台の「外へは箱から PULL 以上」も見ないので、カレンダーの「7」を 22px 右へ引いただけで カレンダー→勤務表 を飛び越えて
       外の並びに加わった（制約 95px、伊藤 40px も同じ）。直すのに新しい決まりは要らず、「くっつけるも落とし込みの1つ」にした：
       先に土台の決まりで離す先を決め、その中でだけ縁を見る。3つとも中に留まり（勤務表のずれ 0.0px）、勤務表の外まで引き出せば
       「7」は付箋C の下にくっつく。配置の経路だけでなく、落とし先の決め方も1つでないと、入れ子が壊れる
     - 「同じ空間」を素直に比べる（相手の親 ＝ 離す先）と、並びに加わる・入れ子にする、が5項目壊れた。寄せた泡のヘッダ（カーソル）は
       並びのすき間や外の背景の上にあり、見えない親は箱を持たないので、離す先は外の空間になる。R4 の「見えない親は体を持たない」を
       出入りにも当てて、窓（見えない親を外へたどった空間）で比べると全部通る。その代わり、格子や縦並びの中の泡は、
       外の泡にくっつけるには箱の外まで引き出す（ヒントにもそう出す）
     - 角の pin を「並びの直下の子なら留める」の if で当てていたので、勤務表の格子の中のカレンダーは中央から伸び、勤務表を 30px 左へ、
       希望シフトを 30px 右へ押した。if を外して、どの泡にも同じ pin（外へたどって最初に位置を書ける泡の座標へ書き戻す）にすると、
       カレンダー・スタッフ・勤務表は 0.0px、後ろの希望シフトだけが 60px 押される（並びの中の希望シフトと同じ動き）。
       土台の「自由の軸なら自分の位置を書く」も pin の一例なので消せた（位置を書く所が 4 → 3 つ）
     - pin は外の泡（並び）の座標へ書くので、補間を掴んだ泡の空間だけ止めていると、引いている途中のカレンダーが 1.55px 遅れた。
       大きさの連続入力では、その泡へ至る空間を全部補間しない
     - 見えない親の名前も注記も、泡を描くついでに描いていた。入れ子の並びは内の並びが先頭で一番高いので、外と内の枠の左下が 5px の差で重なり、
       名前が二重になった。後に描く泡（勤務表・付箋D）にも隠れ、縦に並べると下の泡の注記が上の泡の本文に載った。
       字は泡の後にまとめて、「泡にもほかの字にも重ねない。候補の場所を順に試し、だめなら重なりの一番少ない所」の1つの決まりで置いた。
       重さを同じにすると、候補が全部何かに当たる入れ子で、内の名前が外の名前の上に 886px² 載った（伸びた並びが勤務表に重なり、下に空きが無い）。
       字どうしを泡に載るより重く（×10）数え、載るときだけ下地を敷くと、外の名前は枠の上、内の名前は勤務表のヘッダに下地つきで読める。
       持ち主より奥の泡を数えると、買い物のヘッダの右に置いた注記に、後ろのメモ一覧の分だけ下地が出たので、持ち主が隠している所は数えない

   踏んだこと（第1回の監査で見つかった穴を直して分かったこと）
     - 見えない親に「自前の大きさ」は無い。箱を「そのままの軸は自前／等間隔・詰めるの軸は中身」で決めていたので、
       並びに「自由に置く」「履歴を奥行きに」を当てると（どちらも X・Y が そのまま）箱が 0 になり、
       選択中の空間の枠が半径 −0.2px の角丸になって毎フレーム例外を投げた（並びは 3.2×1.6px、勤務表は画面の左外へ）。
       特別扱いで逃げずに「見えない親は体が無いのだから、どの並べ方でも箱は中身ぴったり」（R1 の言い直し）にしたら、
       7 つのプリセットとも通った。公理の「そのままの軸は自前の大きさ」は、体のある泡の話だった
     - 焦点だけを外へ通しても「窓ではない」にならなかった。見えない親が Z の次元とレンズを自分で持っていたので、
       外の空間が「Z は見た目に使わない（なし）」と言っても、並びの中だけ透視が残った（同じ メモ一覧 が
       並びの中 119px・外 150px）。軸は「次元・並べ方・レンズ・焦点」で1つ。通すなら軸ごと通す。
       viewOf で並びの Z を窓の Z に差し替えると、中と外で 150px でそろい、右上の一覧と選択パネルの言い分も合った。
       Z のセレクタも並びには効きようがないので、窓へ回して「Z（外の空間）」と画面に出した
     - 「動かさなかった泡は動かない」は、詰める空間への差し込みでは成り立たない（並びは必ず伸びる）。留められるのは1つ。
       相手（狙った泡）を留めると、買い物の左の縁へ寄せたときだけメモ一覧が 96px 左へ押し出され、
       同じすき間を指すメモ一覧の右の縁へ寄せたときと答えが違った。「差し込む所より前の泡を留める」にすると、
       どちらの縁から寄せても同じで、並びはいつも後ろへ伸びる。ただしこれは付け替えの決まり：
       同じ並びの中の並べ替えにも当てたら、先頭へ回すたびに並びごと左へ伸びて画面の外へ出た（並べ替えでは並びは動かない、が正しい）
     - 離す先の印は、前のフレームの配置で決めていた。速く引くと寄せた泡の位置が1フレーム遅れ、
       「並びに加わる」の印が出ないまま離して、離した答えだけが並びになった（印と答えが食い違う）。
       座標を書いた直後に解き直してから印を作る
     - ドラッグ中の札だけ placeLabels を通さず左上に決め打ちしていたので、メモ一覧の注記に不透明の下敷きごと載った。
       決まりが1つでも、通らない道が1本あれば破れる。札も queueLabel に預けた（候補は箱の上下 × 左中右）
     - 直せなかった（→ 第2回で塞がった。下）：並び（見えない親）に「自由に置く」を当てると、中の泡が持ったままの自由座標（勤務表 x=−430）で
       置かれるので、勤務表が画面の左外へ出る。View を変えたときに留める決まりが無い（pin は付け替えと角だけ）。
       土台も同じなので、案1 の穴ではなく、公理に足りないもの ——「View が変わっても、見えている所は動かない」

   踏んだこと（第2回の検証：書いた数字を1つずつ測り直し、土台の新しい決まりを移した）
     - 第1回の検証・監査で書いた数字は、27 項目とも測り直して合った（_check/01-audit.mjs）。食い違ったのは1つだけ：
       「寄せた泡だけが縁まで 21px 動く」は場面の数字で、離れた所から一気に付けると 90.69px だった。
       本物のマウスで 21px 手前まで引いて離すと、離したあとの縁のすき間 0.00px・相手 0.00px。数字ではなく場面の書き方が足りなかった
     - 決まりは 6 つ → 4 つ。2つは土台のものだと分かった（消したのではなく、返した）：
       ・pin（もとの R4）は SPEC §3 が同じことを言っている。この案で測っても同じ答え：カレンダーの角を右へ 60px 引くと
         カレンダー・スタッフ・勤務表 0.00px、後ろの希望シフトだけ 60.00px
       ・奥行き（もとの R5）は 00-core の「移った先では焦点の面へ」と同じ。切って比べると、同じ窓の中の引っ越し
         （外の空間 ↔ 並び）では差 0。Z が同じ透視で積み上がっている限りいつも 0 になる（倍率を保つ奥行き ＝ いまの奥行き）。
         値が変わったのは、縮みが Z 由来でないときだけ：外の空間の X を魚眼にして 勤務表（倍率 0.806）の中の 制約 を外へ出すと、
         あり 幅 143.82px（奥行き 0.923 を書く）／なし 幅 205.10px。61.3px 跳ぶので消せない
     - もとの R1 の「箱は中身ぴったり」と R6「窓ではない」は、1つの決まりの言い換えだった ——「見えない親は体を持たない」。
       そこへ「View も選べない」を足すと、直せなかった穴が決まりのほうで塞がった：
       並びに「自由に置く」を当てても 勤務表 0.00px（前は −340px で画面の左外）。8 つのプリセットとも 0.00px で、
       並びの箱は 678×340 のまま。セレクタもプリセットも窓へ回るので、画面から Z だけの注記（「Z（外の空間）」）も消せた
     - 決まり2（並びに加わる）も消せるか試した。いつも「相手の席に並びが生まれる」にすると、並びの中の相対配置はまったく同じ
       （4つとも 0.00px、すき間 30.95／120／170 も同じ）。でも 見えない親が 2 → 4 個たまり、並び全体が 120px
       （差し込んだ泡の幅）跳び、外側へ並べ替えると並びから抜けた。畳む決まり（R3）は入れ子でも効くのに、消せない
     - 土台の raise を移した。stack（置いた順）は状態から消し、描く順は 奥行き → 倍率 → 兄弟の順 だけになった。測ると：
       ・Z が順序（重ねて置く）… 触るたびに最前面。順序は 0.. に収まり、4回触ってもずれない
       ・Z が なし（スタッフの中）… 状態は変わらない
       ・Z が 自由座標（外の空間）… 「一番手前の兄弟の手前へ」は書けなかった。透視は焦点より手前（dz<0）を消すので、
         書いた瞬間に触った泡が消える（実測：焦点 Z を 0.48 にすると 奥行き 0 の 買い物・付箋A の alpha が 0.00）。
         「焦点より手前へは出さない」を足すと、メモ一覧（奥 z=+1）を触ると焦点の面（0）まで来て 幅 119.05 → 150.00。
         ただしそこは兄弟と同じ面なので、上下は決まらない（SPEC §3 のとおり）
     - raise と 奥行き は同じ Z の自由座標に書くのでぶつかる。落とすときは 奥行き が後に書くので raise は打ち消される
       （実測：奥行き −0.30 →（奥行きあり）−0.15、幅 143.29 → 138.15px）。自由座標の Z では「最前面」がもともと表せない（上）ので、
       奥行きが勝って失うものは無い
     - 土台の freeCellNear も移した。付箋C をカレンダーの「1」のマスへ落とすと、「1」は (0,0) → (0,2) へ逃げ、同じマスに2つ 0 件
     - 詰める空間への差し込みは、やはり並びが伸びる。留まったのは 差し込む所より前（メモ一覧 0.00px）と、並びの外の全部
       （付箋B・付箋C・勤務表・希望シフト 0.00px）。動いたのは 後ろの 買い物 だけで、差し込んだ 付箋A の幅ちょうど 120.00px。
       残る穴は「並びの後ろは、差し込んだ泡の幅だけ動く」——詰めるの意味そのものなので、決まりでは塞がらない
   ============================================================================ */

/* ============================================================
   §1 語彙：次元・並べ方・レンズ
   ============================================================ */
const HEADER = 24;              // 泡のヘッダの高さ（中身の箱はこの下）
const PAD = 14;                 // 空間を持つ泡の箱の余白
const GAP = 14;                 // 「詰める」の帯と帯の隙間
const K_PERSP = 0.26;           // 透視：奥行き1あたりの縮み
const ROOT_VP = { x: -130, y: -165 };   // root の消失点（画面中心から）
const VP_CHILD = { fx: 1, fy: 1 };      // 子の空間の消失点（余白の内側の半幅・半高に対する割合、左上へ）。1 以下＝箱の中
const PULL = 48;                // 空間の外へ「大きく」引き出したとみなす距離（画面 px）
const FONT = '-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif';
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

/* ── 案1：スナップ ── */
const SNAP_EDGE = 24;           // 縁どうしがこの距離（画面 px）以内なら「くっつける」
const SNAP_OVERLAP = 0.4;       // 直交方向に、小さい方の長さのこの割合以上重なっていること
const SNAP_GAP = 0;             // 見えない親の「詰める」の隙間（縁が接する）
const RING = 12;                // 見えない親の縁（外周）の掴める幅
/** 比べるトグル。show：見えない親を 隠す/うっすら枠、size：詰める大きさ 自前/見かけ、grab：並びを掴む 親の縁/⌥/先頭 */
const TOGGLE = { show: "faint", size: "own", grab: "edge" };
/** 見えない親は枠を持たない（ヘッダも余白も無い）。箱は中身ぴったり */
const headOf = b => b && b.implicit ? 0 : HEADER;
const padOf = b => b && b.implicit ? 0 : PAD;

/** 次元：泡 → 値。write はドラッグでその軸に何が起きるか（null＝書けない＝視点が動く） */
const DIMS = {
  "none":           { label: "なし",       write: null,      read: () => 0 },
  "free.x":         { label: "自由X",      write: "coord",   key: "x",   read: b => b.free.x },
  "free.y":         { label: "自由Y",      write: "coord",   key: "y",   read: b => b.free.y },
  "free.z":         { label: "自由Z",      write: "coord",   key: "z",   read: b => b.free.z },
  "order":          { label: "順序",       write: "reorder",             read: b => b.order },
  "col":            { label: "列",         write: "cell",    key: "col", read: b => b.cell.col },
  "row":            { label: "行",         write: "cell",    key: "row", read: b => b.cell.row },
  "history.index":  { label: "履歴の世代", write: null,                  read: b => b.hist },
  // ★ derived 次元は「どの空間の履歴か」を知っている（v2 で踏んだ）
  "history.age":    { label: "履歴の古さ", write: null,                  read: (b, space) => maxHistIn(space) - b.hist },
  "history.branch": { label: "履歴の枝",   write: null,                  read: b => b.branch },
};
/** 軸に刺さった次元で、ドラッグが何をするか："coord" | "reorder" | "cell" | "focus" | "none" */
const verbOf = dimId => dimId === "none" ? "none" : (DIMS[dimId].write ?? "focus");

/**
 * ★ 触った泡は最前面へ ── その空間の Z 軸の次元が書けるなら、そこへ書く（土台 00-core と同じ）。
 *   「置いた順（stack）」という View の外の状態は持たない。「手前」は奥行きのことなので、Z 軸に書く。
 *
 *     Z が 順序      … 最前面（0）へ並べ替えて詰め直す。値は 0.. に収まるので、何度触ってもずれていかない
 *     Z が 自由座標  … 一番手前の兄弟の手前へ。ただし焦点より手前へは出さない（「奥行き」と同じ約束。
 *                      出すと透視が消すので、触った泡が消える）。同じ値で重なった兄弟の上下は決まらない
 *     Z が 履歴・なし … 書けないので上がらない。履歴の並びは、触っても順番が変わらない
 */
function raise(b) {
  const space = b.parent ?? "root";
  const A = viewOf(space).z, verb = verbOf(A.dim);
  const sibs = kidsOf(space).filter(k => k !== b);
  if (verb === "reorder") {
    [b, ...sibs.sort((q, r) => q.order - r.order)].forEach((k, i) => { k.order = i; });
  } else if (verb === "coord") {
    const key = DIMS[A.dim].key;
    const front = Math.min(b.free[key], ...sibs.map(k => k.free[key]));
    const to = Math.max(focusZ(space), front - (A.step ?? 1) * 0.15);   // 焦点より手前へは出さない
    if (b.free[key] > to) b.free[key] = to;
  }
}

const ARRANGES = { "as-is": "そのまま", equal: "等間隔", pack: "詰める" };

/** X/Y のレンズ：u（位置 − 焦点）→ 画面 s と局所倍率 k。1次元なので逆関数が必ずある。H は空間の半幅 */
const TANH_EDGE = 1 - 1e-12;    // tanh が浮動小数で 1 に張り付く手前（|u| ≲ 14H まで往復が合う）
const LENS_XY = {
  parallel: { label: "平行", project: (u, H) => ({ s: u, k: 1 }), unproject: (s, H) => s },
  fisheye:  { label: "魚眼",
    project: (u, H) => { const t = u / H, c = Math.cosh(t); return { s: H * Math.tanh(t), k: 1 / (c * c) }; },
    unproject: (s, H) => H * Math.atanh(clamp(s / H, -TANH_EDGE, TANH_EDGE)) },
};
/** Z のレンズ：dz（位置 − 焦点）→ 倍率 m と透明度。XY は消失点へ m で寄せる */
const LENS_Z = {
  perspective: { label: "透視",
    // d → 0 は目の位置（dz = −1/0.26）。そこより手前は写らないので、式が発散しないように止めるだけ
    mag: dz => 1 / Math.max(0.05, 1 + K_PERSP * dz),
    alpha: dz => dz < -1e-9 ? 0 : 1 },    // 焦点より手前（dz<0）は消す（第1版 制約02）。薄れて見えるのは補間だけ
  flat: { label: "平行", mag: () => 1, alpha: () => 1 },
};
const lensLabel = (axis, id) => (axis === "z" ? LENS_Z : LENS_XY)[id].label;

/* ============================================================
   プリセット＝View の型。どれも「軸ごとの 次元・並べ方・レンズ」だけ
   ============================================================ */
const AX = (dim, arrange, lens, step) => ({ dim, arrange, lens, step });
const PRESETS = {
  free:      { label: "自由に置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("free.z", "as-is", "perspective", 1) },
  row:       { label: "横に並べる",     x: AX("order", "pack", "parallel", 110),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  column:    { label: "縦に並べる",     x: AX("none", "pack", "parallel", 110),         y: AX("order", "pack", "parallel", 80),           z: AX("none", "as-is", "flat", 1) },
  grid:      { label: "格子",           x: AX("col", "pack", "parallel", 110),          y: AX("row", "pack", "parallel", 80),             z: AX("none", "as-is", "flat", 1) },
  fisheyeX:  { label: "X魚眼ビュー",    x: AX("history.index", "equal", "fisheye", 64), y: AX("history.branch", "equal", "parallel", 44), z: AX("none", "as-is", "flat", 1) },
  coverflow: { label: "coverflow",      x: AX("order", "equal", "fisheye", 68),        y: AX("none", "pack", "parallel", 80),            z: AX("none", "as-is", "flat", 1) },
  histZ:     { label: "履歴を奥行きに", x: AX("none", "as-is", "parallel", 110),        y: AX("none", "as-is", "parallel", 80),           z: AX("history.age", "equal", "perspective", 1) },
  stackZ:    { label: "重ねて置く",     x: AX("free.x", "as-is", "parallel", 110),      y: AX("free.y", "as-is", "parallel", 80),         z: AX("order", "equal", "perspective", 0.15) },
};
const viewFromPreset = id => { const p = PRESETS[id]; return { x: { ...p.x }, y: { ...p.y }, z: { ...p.z } }; };
/**
 * 見えない親の View（R1）。縁の軸は 順序・詰める・平行（隙間 0）、もう一方は なし・詰める（始端ぞろえ）、
 * Z は自由Z・そのまま・透視（子が自分の奥行きを保つ）。size は「詰めるときの大きさ」（比べる②）
 */
function snapView(axis) {
  const along = { dim: "order", arrange: "pack", lens: "parallel", step: 110, gap: SNAP_GAP, size: TOGGLE.size };
  const cross = { dim: "none",  arrange: "pack", lens: "parallel", step: 80,  gap: SNAP_GAP, size: TOGGLE.size };
  // Z は書かない：見えない親は窓ではないので、Z は窓（外の空間）の軸がそのまま効く（R4・viewOf）
  return { x: axis === "x" ? along : cross, y: axis === "y" ? along : cross };
}
/** 「詰めるときの大きさ」を見かけで測る軸か。そう測った軸は、奥行きを並べ方がもう見込んでいるので消失点へ寄せない */
const seenAxis = A => A.size === "seen" && A.arrange !== "as-is";

/* ============================================================
   状態：泡と root。関係は無い。親子だけ
   ------------------------------------------------------------
   焦点は View の型に入れず、空間（泡）そのものに持たせる。
   View は継げるが、焦点は継がない（§4）——その境目をデータの形に出すため。
   ============================================================ */
const ROOT = { id: "root", title: "外の空間", hue: null, view: viewFromPreset("free"), focus: { x: 0, y: 0, z: 0 } };
const bubbles = [];
const BYID = new Map();
const byId = id => BYID.get(id);

function add(p) {
  const b = {
    id: p.id, title: p.title, hue: p.hue,
    size: { w: p.w, h: p.h },
    parent: p.parent ?? null,
    free: { x: 0, y: 0, z: 0, ...p.free },
    order: p.order ?? 0,
    cell: { col: 0, row: 0, ...p.cell },
    hist: p.hist ?? 0, branch: p.branch ?? 0,
    view: p.view ? (typeof p.view === "string" ? viewFromPreset(p.view) : p.view) : null,
    implicit: !!p.implicit,
    focus: { x: 0, y: 0, z: 0 },          // この泡が空間を持つとき、その空間の「いまどこを見ているか」
    note: p.note ?? null,                 // 場面の注記（泡の上に小さく。配置には使わない）
  };
  bubbles.push(b); BYID.set(b.id, b);
  return b;
}
function removeBubble(b) {
  bubbles.splice(bubbles.indexOf(b), 1); BYID.delete(b.id); anim.delete(b.id);
}

/* ── 場面 1. くっつける前：メモ一覧（奥 z=+1）と 買い物（手前 z=0）。離して置いてある ── */
add({ id: "list", title: "メモ一覧", hue: 35, w: 150, h: 190, free: { x: -723, y: -316, z: 1 }, note: "奥（z=+1）" });

        free: { x: (i % 7 - 3) * 46, y: (Math.floor(i / 7) - 0.5) * 38 } });

/* ── 場面 3. 試す用：大きさの違う自由な泡 ── */
add({ id: "fA", title: "付箋A", hue: 200, w: 120, h: 76,  free: { x: -120, y: -312 }, note: "試す用" });
add({ id: "fB", title: "付箋B", hue: 250, w: 150, h: 100, free: { x: 90,   y: -300 } });
add({ id: "fC", title: "付箋C", hue: 150, w: 96,  h: 60,  free: { x: 130,  y: -40 } });
add({ id: "fD", title: "付箋D", hue: 15,  w: 180, h: 120, free: { x: 190,  y: 110 } });

let selectedId = "item";
let IMPLICIT_N = 0;             // 見えない親の番号

/* ============================================================
   木：親子だけ
   ============================================================ */
let KIDS = new Map();
function reindex() {
  KIDS = new Map([["root", []]]);
  for (const b of bubbles) {
    const p = b.parent ?? "root";
    if (!KIDS.has(p)) KIDS.set(p, []);
    KIDS.get(p).push(b);
  }
}
const kidsOf = id => KIDS.get(id) ?? [];
const spaceObj = id => id === "root" ? ROOT : byId(id);
const parentOf = id => id === "root" ? null : (byId(id).parent ?? "root");
/** 空間を持つ泡：自前の View を持つか、中に泡がいる */
const isHost = b => b.view !== null || kidsOf(b.id).length > 0;
const maxHistIn = spaceId => Math.max(0, ...kidsOf(spaceId).map(b => b.hist));
function isAncestor(a, id) {             // a は id の先祖（id 自身も含む）か
  for (let cur = id; cur; cur = parentOf(cur)) if (cur === a) return true;
  return false;
}
function subtreeOf(id) {
  const s = new Set([id]);
  const walk = x => kidsOf(x).forEach(k => { s.add(k.id); walk(k.id); });
  walk(id);
  return s;
}
const spaceName = id => id === "root" ? "外の空間" : byId(id).implicit ? "並び（見えない親）" : `${byId(id).title}の中`;
const spaceHsl = id => id === "root" ? "#e6ebf5" : byId(id).implicit ? "#cdd8ee" : `hsl(${byId(id).hue} 70% 66%)`;
/**
 * R4 見えない親は体を持たない。だから奥行きに置かれず（倍率 1）、Z の軸そのものを持たない。
 * 中の泡の奥行きは、見えない親を外へたどった空間（窓）の焦点 Z から測る（ホイールもそこへ）。
 * 空間の出入りも窓で数える：くっつけるは、相手の窓が「離す先の窓」（土台の決まり）と同じときだけ
 */
const windowOf = id => { let s = id; while (s !== "root" && byId(s) && byId(s).implicit) s = parentOf(s); return s; };
const focusZ = id => spaceObj(windowOf(id)).focus.z;
/** その泡を入れている見えない親（なければ null） */
const rowOf = id => { const q = id === "root" ? null : byId(byId(id).parent); return q && q.implicit ? q : null; };

/* ============================================================
   §4 継承：並べ方は外から継ぐ。焦点は継がない
   ============================================================ */
function viewOf(spaceId) {
  const sp = spaceObj(spaceId);
  const src = sp.view ?? viewOf(parentOf(spaceId));
  // R4：見えない親は体が無いので窓でもない。Z は軸まるごと窓（外の空間）のもの——焦点だけでなく次元・並べ方・レンズも。
  // 焦点だけ通していたとき、外が「Z なし」でも並びの中だけ透視が残った（同じ泡が並びの中と外で別の大きさになる）
  const z = spaceId !== "root" && sp.implicit ? viewOf(windowOf(spaceId)).z : src.z;
  return { x: { ...src.x }, y: { ...src.y }, z: { ...z }, focus: sp.focus, own: !!sp.view };
}

/** 次元に合う並べ方。「そのまま」は px を持つ次元（自由）だけに意味がある */
function fitArrange(dimId, arrange) {
  const verb = verbOf(dimId);
  if (verb === "coord") return "as-is";
  if (verb === "none") return arrange;
  if (arrange !== "as-is") return arrange;
  return dimId.startsWith("history.") ? "equal" : "pack";
}

/** 軸セレクタ：その空間に自前の View を持たせてから変える（継いでいたなら、いまの見え方を写し取る） */
function setAxis(spaceId, axis, patch) {
  spaceId = windowOf(spaceId);   // R4：見えない親は体が無いので View を選べない。変えるのは窓（外の空間）
  const sp = spaceObj(spaceId);
  if (!sp.view) { const v = viewOf(spaceId); sp.view = { x: v.x, y: v.y, z: v.z }; }
  const A = sp.view[axis];
  Object.assign(A, patch);
  if (patch.dim && !patch.arrange) A.arrange = fitArrange(A.dim, A.arrange);
}
function applyPreset(name, spaceId) {
  const id = PRESETS[name] ? name : Object.keys(PRESETS).find(k => PRESETS[k].label === name);
  if (!id) throw new Error("プリセットが無い: " + name);
  spaceId = windowOf(spaceId);            // R4：見えない親は View を選べない（並べるために生まれたので、並べるだけ）
  const sp = spaceObj(spaceId);
  sp.view = viewFromPreset(id);
  Object.assign(sp.focus, { x: 0, y: 0, z: 0 });
}
function inheritView(spaceId) { spaceId = windowOf(spaceId); if (spaceId !== "root") spaceObj(spaceId).view = null; }

/* ============================================================
   §2 並べ方：値 → 空間の中での位置（泡の中心。原点は中身の箱の中心）
   ============================================================ */
function arrangeAxis(A, kids, axis, spaceId, sizeOf) {
  const dim = DIMS[A.dim];
  const val = b => dim.read(b, spaceId);
  const len = b => axis === "x" ? sizeOf(b).w : sizeOf(b).h;
  const pos = new Map(), bands = [];
  const values = [...new Set(kids.map(val))].sort((p, q) => p - q);
  let mid = 0;

  if (axis === "z") {                              // Z は中央ぞろえしない（焦点 0 ＝ 手前）
    for (const b of kids) {
      const v = val(b);
      pos.set(b.id, A.arrange === "equal" ? v * A.step : A.arrange === "pack" ? values.indexOf(v) : v);
    }
  } else if (A.arrange === "as-is") {
    for (const b of kids) pos.set(b.id, val(b));
  } else if (A.arrange === "equal") {
    // 塊の中央を空間の中心に。塊は pack と同じく泡の端から端（値×間隔は泡の中心なので、中心どうしの中点だと
    // 端の泡の大きさが違うときずれる）
    let lo = Infinity, hi = -Infinity;
    for (const b of kids) { const c = val(b) * A.step; lo = Math.min(lo, c - len(b) / 2); hi = Math.max(hi, c + len(b) / 2); }
    if (kids.length) mid = (lo + hi) / 2;
    for (const b of kids) pos.set(b.id, val(b) * A.step - mid);
    for (const v of values) bands.push({ value: v, start: v * A.step - mid - A.step / 2, end: v * A.step - mid + A.step / 2 });
  } else {                                          // pack：値ごとの帯。帯の幅はその値を持つ泡の最大
    const gap = A.gap ?? GAP;                        // 帯の隙間は View の値（見えない親は 0。書いていなければ 14px）
    let total = -gap;
    const bandLen = new Map();
    for (const v of values) {
      const l = Math.max(...kids.filter(b => val(b) === v).map(len));
      bandLen.set(v, l); total += l + gap;
    }
    let at = -Math.max(0, total) / 2;
    for (const v of values) { bands.push({ value: v, start: at, end: at + bandLen.get(v) }); at += bandLen.get(v) + gap; }
    for (const b of kids) {
      const bd = bands.find(x => x.value === val(b));
      pos.set(b.id, bd.start + len(b) / 2);        // 帯の中は始端ぞろえ
    }
  }
  return { pos, bands, mid };
}

/**
 * 箱の大きさ。「そのまま」の軸は自前の大きさ。
 * 等間隔・詰めるの軸は、レンズを通した中身が収まるまで伸びる（＋余白）。
 * 魚眼は箱の半幅で曲がるので、何度か当てて落ち着かせる。
 * ただし見えない親は体を持たない（自前の大きさが無い・R1「箱は中身ぴったり」）ので、
 * どの並べ方でも中身で決まる。「そのまま」の軸で自前に落ちると、箱が 0 になって画面が壊れる
 */
function measure(b, memo) {
  if (memo.has(b.id)) return memo.get(b.id);
  const box = { w: b.size.w, h: b.size.h };
  const kids = kidsOf(b.id), head = headOf(b), pad = padOf(b);
  if (kids.length) {
    const V = viewOf(b.id), zSeen = zSeenOf(V, kids, b.id, { z: focusZ(b.id) });
    for (const axis of ["x", "y"]) {
      const A = V[axis];
      if (A.arrange === "as-is" && !b.implicit) continue;
      const sizeOf = sizerFor(A, k => measure(k, memo), zSeen);
      const { pos } = arrangeAxis(A, kids, axis, b.id, sizeOf);
      const lens = LENS_XY[A.lens];
      const ownHalf = Math.max(0, (axis === "x" ? b.size.w : b.size.h - head) / 2);
      const halfLen = k => (axis === "x" ? sizeOf(k).w : sizeOf(k).h) / 2;
      // ★ 出発点は「レンズを通す前の中身の広がり」。魚眼は像を必ず箱の中に収める（|画面| ≤ H、局所倍率 → 0）ので、
      //   0 から伸ばすと「箱が点でも中身は収まっている」という答えに落ちる。体の無い親は自前が 0 なのでそこに落ちた。
      //   レンズを通した必要幅は必ずこの広がり以下なので、ここから縮めれば「中身が収まる一番大きい箱」に落ち着く
      //   （平行なら1回で同じ答え。自前の大きさは下限のまま）
      let flat = 0;
      for (const k of kids) flat = Math.max(flat, Math.abs(pos.get(k.id)) + halfLen(k));
      let half = Math.max(ownHalf, flat + pad);
      for (let n = 0; n < 60; n++) {                 // H＝箱の半幅。魚眼では H と中身が互いに決まるので落ち着くまで
        const H = Math.max(1, half);
        let need = 0;
        for (const k of kids) { const p = lens.project(pos.get(k.id), H); need = Math.max(need, Math.abs(p.s) + halfLen(k) * p.k); }
        const next = Math.max(ownHalf, need + pad);
        if (Math.abs(next - half) < 1e-6) { half = next; break; }
        half = next;
      }
      if (axis === "x") box.w = half * 2; else box.h = half * 2 + head;
    }
  }
  memo.set(b.id, box);
  return box;
}

/** Z の倍率（見かけの大きさに使う）。レンズが消した泡（dz<0）は見かけ 0 */
function zSeenOf(V, kids, spaceId, focus) {
  const zpos = arrangeAxis(V.z, kids, "z", spaceId, () => ({ w: 0, h: 0 })).pos, lz = LENS_Z[V.z.lens];
  return new Map(kids.map(k => { const dz = zpos.get(k.id) - focus.z; return [k.id, lz.alpha(dz) > 0 ? lz.mag(dz) : 0]; }));
}
/** 比べる②：詰めるときの大きさ。自前＝箱の大きさ／見かけ＝箱 × その泡の Z の倍率 */
function sizerFor(A, sizeOf, zSeen) {
  if (!seenAxis(A)) return sizeOf;
  return k => { const s = sizeOf(k), m = zSeen.get(k.id) ?? 1; return { w: s.w * m, h: s.h * m }; };
}

/** 空間（中身の箱）の半幅。魚眼の像は箱いっぱい */
const halfOf = host => ({ x: Math.max(1, host.w / 2), y: Math.max(1, host.h / 2) });

/**
 * レンズの ctx。★ 目の位置を足すならここ1か所（vp や focus をずらした写しを返す。状態には書き込まない）
 * focus は写しで渡る。焦点を動かす操作はこの ctx に書かず、状態へ「u（位置 − 焦点）の変化の分」を書く（setFocusAxis の上）ので、
 * ここで焦点をずらしても操作は壊れない
 * 子の空間の消失点は箱の中（余白の内側の左上の角）に置く。透視は見える泡（dz ≥ 0）を m ≤ 1 で消失点へ寄せるだけなので、
 * 寄せた像は「元の像と消失点を結ぶ範囲」にあり、X/Y で箱に収まった中身は Z をかけても箱に収まる（measure・focusFits は Z を見なくてよい）
 */
function lensCtx(spaceId, host, focus) {
  const H = halfOf(host);
  return {
    focus: { ...focus },
    H,
    vp: spaceId === "root" ? { ...ROOT_VP }
      : { x: -Math.max(0, H.x - padOf(byId(spaceId))) * VP_CHILD.fx, y: -Math.max(0, H.y - padOf(byId(spaceId))) * VP_CHILD.fy },
  };
}

/* ============================================================
   §2 解く順番（1フレーム）
   ============================================================ */
let frameItems = [];            // 描いた順の配置（画面座標）
let PLACE = new Map();          // id → 配置
let LAYOUT = new Map();         // spaceId → { host, ctx, V, arr }（ドラッグの逆変換に使う）
const anim = new Map();         // id → 親の中身の座標での { x, y, scale, alpha, w, h }。補間はここだけ
const EASE = 0.2;
let drag = null;

function ease(id, target, mode) {
  let a = anim.get(id);
  if (!a || mode === "snap") { a = { ...target }; anim.set(id, a); return a; }
  if (mode === "keep") return a;                 // 補間を進めずに配置だけ解く（付け替えの前後で測るため）
  for (const k in target) a[k] += (target[k] - a[k]) * EASE;
  return a;
}

/** ★ 合成はここ1回だけ。深さ n でも scale は数値1つ */
function compose(host, a) {
  const scale = host.scale * a.scale;
  const w = a.w * scale, h = a.h * scale;
  return { x: host.cx + a.x * host.scale - w / 2, y: host.cy + a.y * host.scale - h / 2, w, h, scale,
           alpha: host.alpha * a.alpha };
}
/** 空間を持つ泡の配置 → その中身の箱（子の空間の host）。vis は補間を通さないレンズの答え（見えるか） */
const contentOf = p => { const hd = headOf(p.b); return {
  cx: p.x + p.w / 2, cy: p.y + (hd + (p.box.h - hd) / 2) * p.scale,
  w: p.box.w, h: p.box.h - hd, scale: p.scale, alpha: p.alpha, vis: p.vis, depth: p.depth,
}; };
const contentRect = host => ({ x: host.cx - host.w / 2 * host.scale, y: host.cy - host.h / 2 * host.scale,
                               w: host.w * host.scale, h: host.h * host.scale });

function resolveSpace(spaceId, host, memo, sink, lifted, mode) {
  const V = viewOf(spaceId), kids = kidsOf(spaceId);
  const sizeOf = b => measure(b, memo);
  const zSeen = zSeenOf(V, kids, spaceId, { z: focusZ(spaceId) });
  const sizer = { x: sizerFor(V.x, sizeOf, zSeen), y: sizerFor(V.y, sizeOf, zSeen) };   // 比べる②
  const arr = { x: arrangeAxis(V.x, kids, "x", spaceId, sizer.x),
                y: arrangeAxis(V.y, kids, "y", spaceId, sizer.y),
                z: arrangeAxis(V.z, kids, "z", spaceId, sizeOf) };
  // 約束(2)の箱は補間を通さない答え（measure）で測る。補間中の箱で測ると、焦点が補間の進み方しだいで変わる
  const own = spaceId === "root" ? host : (m => ({ w: m.w, h: m.h - headOf(byId(spaceId)) }))(measure(byId(spaceId), memo));
  const L = { id: spaceId, host, V, arr, kids, sizeOf, sizer, H: halfOf(own) };
  // ★ 焦点はいつも約束の中にいる（fitFocus）。約束は 焦点・View・中身 の三つで決まるので、焦点を書いたときだけ当てると
  //   軸セレクタや「外から継ぐ」で View が変わったとき古い焦点が残る。写す前に、いまの View と中身で約束の中へ戻す
  const sp = spaceObj(spaceId);
  const passZ = windowOf(spaceId) !== spaceId;                      // R4：見えない親の Z は外の空間の焦点（約束も外が守る）
  for (const axis of ["x", "y", "z"]) if (!(axis === "z" && passZ)) sp.focus[axis] = fitFocus(L, axis, sp.focus[axis], sp.focus[axis]);
  L.focus = { ...sp.focus, z: focusZ(spaceId) };                    // このフレームの焦点（目を足す前）
  const ctx = L.ctx = lensCtx(spaceId, host, L.focus);
  LAYOUT.set(spaceId, L);
  const lx = LENS_XY[V.x.lens], ly = LENS_XY[V.y.lens], lz = LENS_Z[V.z.lens];

  const items = kids.map((b, i) => {
    const pos = { x: arr.x.pos.get(b.id), y: arr.y.pos.get(b.id), z: arr.z.pos.get(b.id) };
    const px = lx.project(pos.x - ctx.focus.x, ctx.H.x);          // 位置 − 焦点 → レンズ（軸ごと）
    const py = ly.project(pos.y - ctx.focus.y, ctx.H.y);
    const dz = b.implicit ? 0 : pos.z - ctx.focus.z, m = lz.mag(dz);   // そのあと Z で消失点へ寄せる（見えない親は奥行きに置かれない R4）
    const box = sizeOf(b);
    // 見かけで詰めた軸は、並べ方がもう奥行きを見込んでいるので消失点へ寄せない（寄せると2回縮む）
    const tx = seenAxis(V.x) ? px.s : ctx.vp.x + (px.s - ctx.vp.x) * m;
    const ty = seenAxis(V.y) ? py.s : ctx.vp.y + (py.s - ctx.vp.y) * m;
    const target = { x: tx, y: ty,
                     scale: m * Math.min(px.k, py.k), alpha: lz.alpha(dz), w: box.w, h: box.h };
    return { b, i, dz, m, pos, target };
  });
  // ★ 空間ごとに Z で1回だけ（奥 → 手前）。Z が同じなら大きく写るものを手前に（coverflow の中央が上に来る）。
  //   それも同じ（格子の同じマスに重なる など）なら、決まらない ── 「置いた順」という View の外の状態は持たない（raise）
  items.sort((p, q) => q.dz - p.dz || p.target.scale - q.target.scale || p.i - q.i);

  // 連続入力（焦点を引く・泡を引く・大きさ）は補間しない。大きさは pin が外の泡の座標へ書くので、その泡へ至る空間を全部

/**
 * ドラッグ中の印（離すとどうなるか）。線と枠はここで描き、字は queueLabel に預けて placeLabels が置く
 * ——「字は泡にもほかの字にも重ねない」の決まりを、ドラッグ中の札も同じに通すため（前は左上に決め打ちで、注記を隠した）
 */
function drawDragMarks() {
  if (!drag || drag.kind !== "bubble" || !drag.started || !drag.slot) return;
  const sl = drag.slot, L = LAYOUT.get(sl.space);
  // 札の置き場所の候補：箱の 上／中の上端／下 × 左／中／右（画面からはみ出す所は placeLabels が高く数える）
  const spots = box => (w, h) => {
    const top = box.y - HEADER * (L ? L.host.scale : 1);
    return [top - 4 - h, Math.max(box.y, 0) + 4, box.y + box.h + 4].flatMap(y =>
      [box.x + 2, box.x + box.w / 2 - w / 2, box.x + box.w - 2 - w].map(x =>
        ({ x: clamp(x, 4, Math.max(4, VW - w - 6)), y: clamp(y, 4, Math.max(4, VH - h - 6)) })));
  };
  g.save();
  g.strokeStyle = "#6ee7ff"; g.fillStyle = "#6ee7ff"; g.shadowColor = "rgba(110,231,255,.8)"; g.shadowBlur = 10;
  if (sl.snap) {                                 // 案1：縁へ寄せた。離すと並ぶ
    const T = PLACE.get(sl.snap.target), { axis, at, from, to } = sl.markLine;
    if (T) { g.lineWidth = 1.5; g.setLineDash([3, 3]); roundRect(T.x - 3, T.y - 3, T.w + 6, T.h + 6, 8); g.stroke(); g.setLineDash([]); }
    g.lineWidth = 4; g.beginPath();
    if (axis === "x") { g.moveTo(at, from); g.lineTo(at, to); } else { g.moveTo(from, at); g.lineTo(to, at); }
    g.stroke();
    g.restore();
    const label = sl.snap.kind === "join" ? "ここで離すと並びに加わる" : `ここで離すと${axis === "x" ? "横" : "縦"}に並ぶ（見えない親が生まれる）`;
    // 字は相手の泡のまわり（上下 × 左中右）。どこに置くかは placeLabels の1つの決まりで決める
    const near = axis === "x" ? { x: Math.min(at, T ? T.x : at), y: from, w: Math.max(4, T ? T.w : 4), h: to - from }
                              : { x: from, y: Math.min(at, T ? T.y : at), w: to - from, h: Math.max(4, T ? T.h : 4) };
    queueLabel({ text: label, size: 12, color: "#6ee7ff", alpha: 1, at: spots(near) });
    return;
  }
  if (sl.space !== drag.space) {                 // 別の空間へ移る
    const c = contentRect(L.host);
    g.lineWidth = 2; g.setLineDash([7, 5]); roundRect(c.x, c.y, c.w, c.h, 6); g.stroke(); g.setLineDash([]);
    // 置き場所は placeLabels が決める（前はここで左上に決め打ちして、泡の注記を下敷きごと隠していた）
    queueLabel({ text: `離すと ${spaceName(sl.space)}へ`, size: 12, color: "#6ee7ff", alpha: 1, at: spots(c) });
  }
  if (sl.markRect) {                             // マス移動：入るマス
    const m = sl.markRect;
    g.lineWidth = 2; g.setLineDash([5, 4]); roundRect(m.x, m.y, m.w, m.h, 5); g.stroke(); g.setLineDash([]);
    g.globalAlpha = 0.12; g.fill(); g.globalAlpha = 1;
    if (sl.occupants && sl.occupants.length) {   // 先客がいる：離すと入れ替わる（よその空間からなら重なる）
      const swap = sl.space === drag.space;
      g.shadowBlur = 0; g.strokeStyle = swap ? "#ffd479" : "#ff9db1"; g.lineWidth = 1.5; g.setLineDash([3, 3]);
      for (const o of sl.occupants) { const q = PLACE.get(o.id); if (q) { roundRect(q.x - 3, q.y - 3, q.w + 6, q.h + 6, 7); g.stroke(); } }
      g.setLineDash([]);
      queueLabel({ text: `${sl.occupants.map(o => o.title).join("・")}${swap ? "と入れ替わる" : "に重なる"}`,
                   size: 12, color: swap ? "#ffd479" : "#ff9db1", alpha: 1, at: spots(m) });
      g.strokeStyle = "#6ee7ff"; g.shadowBlur = 10;
    }
  }
  if (sl.markLine) {                             // 並べ替え：差し込まれる位置
    const { axis, at, from, to } = sl.markLine;
    g.lineWidth = 3; g.beginPath();
    if (axis === "x") { g.moveTo(at, from); g.lineTo(at, to); } else { g.moveTo(from, at); g.lineTo(to, at); }
    g.stroke();
  }
  g.restore();
}

function draw() {
  g.clearRect(0, 0, VW, VH);
  const grd = g.createRadialGradient(VW / 2, VH / 2, 0, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
  grd.addColorStop(0, "#141a2b"); grd.addColorStop(1, "#080a11");
  g.fillStyle = grd; g.fillRect(0, 0, VW, VH);
  g.strokeStyle = "rgba(110,231,255,.16)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(VW / 2 - 14, VH / 2); g.lineTo(VW / 2 + 14, VH / 2);
  g.moveTo(VW / 2, VH / 2 - 14); g.lineTo(VW / 2, VH / 2 + 14); g.stroke();

  for (const p of frameItems) drawBubble(p);

  // 選択中の泡がいる空間（軸セレクタが効く空間）の中身の箱を薄く示す
  const sp = selectedId && byId(selectedId) ? parentOf(selectedId) : "root";
  // 隠しているときは、見えない親の箱はここにも描かない（比べる①）
  if (sp !== "root" && LAYOUT.get(sp) && !(byId(sp).implicit && TOGGLE.show === "hide")) {
    const c = contentRect(LAYOUT.get(sp).host);
    g.globalAlpha = 0.45; g.strokeStyle = "#6ee7ff"; g.lineWidth = 1; g.setLineDash([2, 4]);
    roundRect(c.x + 1, c.y + 1, c.w - 2, c.h - 2, 6); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  }
  drawGapLabels();
  drawDragMarks();               // 線と枠。字は queueLabel へ
  PLACED_LABELS = placeLabels(); // 字はまとめて最後に置く（ドラッグ中の札も同じ決まりで）
}

/**
 * 並びの縁のすき間（比べる②を画面で読む）。隣り合う2つの縁が、View の隙間どおりに接していないときだけ出す。
 * 値は「いま描いた配置」の画面 px（__lab.gapBetween と同じ式）
 */
function drawGapLabels() {
  for (const q of frameItems) {
    if (!q.b.implicit || !(q.alpha > 0.5)) continue;
    const V = viewOf(q.id), axis = verbOf(V.x.dim) === "reorder" ? "x" : verbOf(V.y.dim) === "reorder" ? "y" : null;
    if (!axis || V[axis].arrange !== "pack") continue;             // 隙間の約束があるのは「詰める」だけ
    const kids = kidsOf(q.id).slice().sort((a, c) => a.order - c.order).map(k => PLACE.get(k.id)).filter(k => k && k.vis > 0);
    for (let i = 1; i < kids.length; i++) {
      const a = kids[i - 1], c = kids[i];
      if (drag && drag.started && (drag.id === a.id || drag.id === c.id)) continue;
      const gap = gapOf(a, c, axis), want = (V[axis].gap ?? GAP) * q.scale;
      if (Math.abs(gap - want) < 0.5) continue;
      const label = gap >= 0 ? `すき間 ${gap.toFixed(0)}px` : `重なり ${(-gap).toFixed(0)}px`;
      g.save(); g.font = `600 11px ${FONT}`; g.textBaseline = "middle";
      const tw = g.measureText(label).width;
      const cx = axis === "x" ? (a.x + a.w + c.x) / 2 : Math.max(a.x, c.x) + 40;
      const cy = axis === "x" ? Math.max(a.y, c.y) + Math.min(a.h, c.h) * 0.5 : (a.y + a.h + c.y) / 2;
      g.fillStyle = "rgba(8,10,17,.92)"; g.fillRect(cx - tw / 2 - 5, cy - 9, tw + 10, 18);
      g.strokeStyle = "#ff9db1"; g.lineWidth = 1; g.strokeRect(cx - tw / 2 - 5, cy - 9, tw + 10, 18);
      g.fillStyle = "#ff9db1"; g.fillText(label, cx - tw / 2, cy + 0.5);
      g.restore();
    }
  }
}
/** 並びの軸で、前の泡の縁から次の泡の縁まで（画面 px。負なら重なり） */
const gapOf = (a, c, axis) => axis === "x" ? c.x - (a.x + a.w) : c.y - (a.y + a.h);

/* ============================================================
   §3 操作 ——「操作は軸に従う」
   ============================================================ */
/** 見えない親の縁（箱の外周 RING px）。比べる③が「親の縁」のときだけ当たる */
const onRing = (p, mx, my) => mx >= p.x - RING && mx <= p.x + p.w + RING && my >= p.y - RING && my <= p.y + p.h + RING
  && !(mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h);
/**
 * 当たり判定は描いた順の逆（内側・手前が勝つ）。レンズが消した泡（dz<0 など）は、薄れていく途中でも掴めない。
 * 見えない親は箱を持たない：並びの中のすき間は外の空間の背景。縁を掴むやり方（比べる③）のときだけ外周が当たる
 */
function hitTest(mx, my, skip) {
  for (let i = frameItems.length - 1; i >= 0; i--) {
    const p = frameItems[i];
    if (!(p.vis > 0) || (skip && skip.has(p.id))) continue;
    if (p.b.implicit) { if (TOGGLE.grab === "edge" && onRing(p, mx, my)) return p; continue; }
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h) return p;
  }
  return null;
}
/** 空間を持つ泡の「中身の箱」に入っているか（ヘッダは外側の空間のもの）。見えない親は縁でしか当たらないので、いつも「掴む」 */
const inContent = (p, my) => !p.b.implicit && isHost(p.b) && my >= p.y + headOf(p.b) * p.scale;
/** カーソルの下の空間：中身の箱の上ならその空間、泡の上ならその泡がいる空間 */
function spaceAt(mx, my, skip) {
  const p = hitTest(mx, my, skip);
  return !p ? "root" : inContent(p, my) ? p.id : p.space;
}
const onHandle = (p, mx, my) => p && mx >= p.x + p.w - 12 && mx <= p.x + p.w + 3 && my >= p.y + p.h - 12 && my <= p.y + p.h + 3;
/**
 * 大きさの角。角は選択中の泡と一緒に描くので、当たり判定も同じ描いた順の逆で見る：
 * 手前に別の泡（中身も含む）が重なっていればそちらが勝ち、レンズが消した泡（vis 0）の角は掴めない。見えない親に角は無い
 */
function handleAt(mx, my) {
  for (let i = frameItems.length - 1; i >= 0; i--) {
    const p = frameItems[i];
    if (!(p.vis > 0) || p.b.implicit) continue;
    if (p.id === selectedId && onHandle(p, mx, my)) return p;
    if (mx >= p.x && mx <= p.x + p.w && my >= p.y && my <= p.y + p.h) return null;
  }
  return null;
}
const center = (p, axis) => axis === "x" ? p.x + p.w / 2 : p.y + p.h / 2;
const pt = e => { const r = cv.getBoundingClientRect(); return { mx: e.clientX - r.left, my: e.clientY - r.top }; };
let lastAlt = false;

/**
 * 比べる③：何を掴んだことになるか。
 *   親の縁   ：縁に当たれば hitTest がもう見えない親を返している。中の泡はその泡
 *   ⌥＋掴む ：⌥ を押していれば、いちばん外の見えない親まで上がる
 *   先頭の泡 ：並びの先頭（順序 0）なら、その並びへ上がる（その並びも先頭なら、さらに外へ）
 */
function grabbedOf(p, alt) {
  let b = p.b;
  if (TOGGLE.grab === "alt" && alt) for (let q = rowOf(b.id); q; q = rowOf(b.id)) b = q;
  if (TOGGLE.grab === "lead") for (let q = rowOf(b.id); q && b.order === 0; q = rowOf(b.id)) b = q;
  return PLACE.get(b.id) ?? p;
}

cv.addEventListener("pointerdown", e => {
  const { mx, my } = pt(e);
  lastAlt = e.altKey;
  cv.setPointerCapture(e.pointerId);
  const sel = handleAt(mx, my);
  if (sel) {
    // 引くのは見えている箱の角：中身で伸びた箱なら、自前の大きさではなく伸びた大きさから始める（引いた分だけ角が動く）
    drag = { kind: "resize", id: sel.id, space: sel.space, started: true, mx0: mx, my0: my, size0: { ...measure(sel.b, new Map()) },
             scale: sel.scale, x0: sel.x, y0: sel.y };
    return;
  }
  const hit = hitTest(mx, my);
  if (hit && !inContent(hit, my)) {
    const p = grabbedOf(hit, e.altKey);
    selectedId = p.id;
    raise(p.b);                      // ★ 触った泡は最前面へ（Z 軸が書けるなら）
    const V = viewOf(p.space), verbs = { x: verbOf(V.x.dim), y: verbOf(V.y.dim) };
    const vs = [verbs.x, verbs.y];
    drag = {
      kind: "bubble", id: p.id, space: p.space, verbs,
      moves: vs.some(v => v === "coord" || v === "reorder" || v === "cell"),   // 泡が動くときだけ空間を移れる
      lift: vs.some(v => v === "reorder" || v === "cell"),                     // 並べ替え・マス移動はカーソルについてくる
      snapSpace: vs.includes("focus") ? p.space : null,
      started: false, mx0: mx, my0: my, mx, my,
      fx: (mx - p.x) / p.w, fy: (my - p.y) / p.h, scale0: p.scale,
      skip: subtreeOf(p.id), slot: null,
    };
  } else {
    // 背景：カーソルの下の空間の焦点を動かす（掴んだ点がカーソルについてくるように）
    const space = hit ? hit.id : "root", L = LAYOUT.get(space);
    drag = { kind: "focus", space, snapSpace: space, started: false, mx0: mx, my0: my,
             f0: { ...L.focus }, u0: { x: unprojectLocal(L, "x", mx), y: unprojectLocal(L, "y", my) } };
  }
});

cv.addEventListener("pointermove", e => {
  const { mx, my } = pt(e);
  lastAlt = e.altKey;
  if (!drag) { showCursorHint(mx, my); return; }
  hideCursorHint();
  if (!drag.started && Math.hypot(mx - drag.mx0, my - drag.my0) < 3) return;
  drag.started = true;
  if (drag.kind === "resize") {
    const b = byId(drag.id);
    b.size.w = Math.max(40, drag.size0.w + (mx - drag.mx0) / drag.scale);
    b.size.h = Math.max(HEADER + 10, drag.size0.h + (my - drag.my0) / drag.scale);
    // pin（土台・SPEC §3）：大きさを変えた泡の左上は動かさない。どの空間にいても同じ1つの決まり（pin）：外へたどって最初に位置を書ける泡の座標へ、
    // View の逆写しで書き戻す。自由の空間なら自分の座標、詰めるの中（勤務表の格子・並び）なら、それを入れている自由な泡の座標
    pin(b.id, { x: drag.x0, y: drag.y0 });
  } else if (drag.kind === "focus") {
    const L = LAYOUT.get(drag.space);
    for (const axis of ["x", "y"]) {
      if (L.V[axis].dim === "none") continue;                 // なしの軸は何も起きない
      // 掴んだ点の u が u0 → いま に変わった分だけ焦点を戻す（掴んだ点がカーソルについてくる）
      setFocusAxis(L, axis, drag.f0[axis] + drag.u0[axis] - unprojectLocal(L, axis, axis === "x" ? mx : my));
    }
  } else {
    moveBubble(mx, my);
  }
});

/** 泡のドラッグ：軸ごとに、書けるなら書く／書けないなら焦点／なしなら何もしない */
function moveBubble(mx, my) {
  drag.mx = mx; drag.my = my;
  const p = PLACE.get(drag.id), b = p.b, L = LAYOUT.get(drag.space);
  for (const axis of ["x", "y"]) {
    const verb = drag.verbs[axis];
    // 泡の中心をどこへ持っていきたいか（掴んだ点と泡の相対位置を保つ）
    const want = axis === "x" ? mx - (drag.fx - 0.5) * p.w : my - (drag.fy - 0.5) * p.h;
    if (verb === "coord") {
      // ★ 書き込む先はその軸に刺さっている次元（free.x 決め打ちにしない）
      b.free[DIMS[L.V[axis].dim].key] = valueFromPos(L, axis, screenToAxis(L, axis, want, p.m));
    } else if (verb === "focus") {
      // 泡のいまの u（位置 − ctx の焦点）が、行きたい u になるまで焦点を動かす
      setFocusAxis(L, axis, L.focus[axis] + (p.pos[axis] - L.ctx.focus[axis]) - unprojectLocal(L, axis, want, p.m));
    }
  }
  // 印は「いま離したらどうなるか」。書いたばかりの座標で配置を解き直してから見る（前のフレームの配置で見ると、
  // 速く引いたとき縁の印が出ないまま離して、離した答えだけが並びになる＝印と答えが食い違う）
  if (drag.moves) { resolveAll("keep"); drag.slot = slotAt(mx, my); }
}

/**
 * 離したらどこへ入るか。先に土台の決まりで離す先の空間を決め、その窓の中で縁（R1・R2）を見る：
 *  - カーソルの下の空間（掴んだ泡とその中身は除く）
 *  - ただし今いる空間の外へ出るのは、中身の箱から PULL 以上離れたときだけ
 *  - くっつけるも空間への落とし込みの1つ：相手の窓（R4）が離す先の窓と同じときだけ効く
 *  - その空間の View に従って、書く値（順序の差し込み位置・マス・自由座標）を決める
 */
function slotAt(mx, my) {
  const slot = spaceSlotAt(mx, my);
  if (!slot) return null;
  slot.out = slot.space !== drag.space;          // 今いる空間の外へ引き出した（持ち上げた泡が両軸でついてくる）
  const sn = snapAt(slot);
  if (!sn) return slot;
  const T = PLACE.get(sn.target), axis = sn.axis;
  const at = sn.after ? (axis === "x" ? T.x + T.w : T.y + T.h) : (axis === "x" ? T.x : T.y);
  const [from, to] = axis === "x" ? [T.y, T.y + T.h] : [T.x, T.x + T.w];
  return { space: T.space, out: slot.out, snap: sn, order: null, cell: {}, coord: {}, markRect: null, markLine: { axis, at, from, to } };
}

/**
 * R1・R2：掴んだ泡の縁が、ほかの泡の縁に寄っているか（画面で測る。第1版 制約13「隣接は画面空間で解く」）。
 * 相手は「自由に置く空間の泡」か「見えない親の中の泡」で、窓が離す先（slot）の窓と同じもの。いちばん近い縁を返す。
 * 並びの中で並びの軸に沿って引いているあいだは、土台の並べ替え（順序の書き込み）に任せる
 */
function snapAt(slot) {
  const D = PLACE.get(drag.id), out = slot.out, win = windowOf(slot.space);
  if (!D) return null;
  const lo = (r, a) => a === "x" ? r.x : r.y, len = (r, a) => a === "x" ? r.w : r.h, hi = (r, a) => lo(r, a) + len(r, a);
  let best = null;
  for (const T of frameItems) {
    if (!(T.vis > 0) || T.b.implicit || drag.skip.has(T.id) || windowOf(T.space) !== win) continue;
    const V = viewOf(T.space), row = rowOf(T.id);
    if (!row && !(verbOf(V.x.dim) === "coord" && verbOf(V.y.dim) === "coord")) continue;
    for (const axis of ["x", "y"]) {
      const o = axis === "x" ? "y" : "x";
      const overlap = Math.min(hi(D, o), hi(T, o)) - Math.max(lo(D, o), lo(T, o));
      if (overlap < SNAP_OVERLAP * Math.min(len(D, o), len(T, o))) continue;
      const join = !!row && verbOf(V[axis].dim) === "reorder";
      if (join && T.space === drag.space && !out) continue;
      for (const after of [false, true]) {
        const dist = Math.abs(after ? lo(D, axis) - hi(T, axis) : hi(D, axis) - lo(T, axis));
        if (dist <= SNAP_EDGE && (!best || dist < best.dist)) best = { kind: join ? "join" : "born", target: T.id, axis, after, dist };
      }
    }
  }
  return best;
}

/** 土台の slotAt（縁を見ない） */
function spaceSlotAt(mx, my) {
  let space = spaceAt(mx, my, drag.skip);
  if (space !== drag.space && drag.space !== "root" && !isAncestor(drag.space, space)) {
    const c = contentRect(LAYOUT.get(drag.space).host);
    if (mx > c.x - PULL && mx < c.x + c.w + PULL && my > c.y - PULL && my < c.y + c.h + PULL) space = drag.space;
  }
  const L = LAYOUT.get(space);
  if (!L) return null;
  const p = PLACE.get(drag.id);
  const slot = { space, order: null, cell: {}, coord: {}, markLine: null, markRect: null };
  const sibs = kidsOf(space).filter(k => !drag.skip.has(k.id)).map(k => PLACE.get(k.id)).filter(Boolean);
  const box = contentRect(L.host);
  const cellRange = {};

  for (const axis of ["x", "y"]) {
    const A = L.V[axis], verb = verbOf(A.dim), cur = axis === "x" ? mx : my;
    if (verb === "reorder") {
      const sorted = sibs.slice().sort((a, c) => center(a, axis) - center(c, axis));
      const idx = sorted.filter(s => center(s, axis) < cur).length;
      const near = s => axis === "x" ? s.x : s.y, far = s => axis === "x" ? s.x + s.w : s.y + s.h;
      const half = (A.gap ?? GAP) / 2 * L.host.scale;
      const at = !sorted.length ? (axis === "x" ? L.host.cx : L.host.cy)
               : idx === 0 ? near(sorted[0]) - half
               : idx === sorted.length ? far(sorted[idx - 1]) + half
               : (far(sorted[idx - 1]) + near(sorted[idx])) / 2;
      slot.order = { idx, list: sorted.map(s => s.b) };
      slot.markLine = { axis, at, from: axis === "x" ? box.y + 4 : box.x + 4, to: axis === "x" ? box.y + box.h - 4 : box.x + box.w - 4 };
    } else if (verb === "cell") {
      const pos = screenToAxis(L, axis, cur);
      const len = axis === "x" ? p.box.w : p.box.h;
      const { value, start, end } = cellFromBands(L.arr[axis].bands, pos, len, A.gap ?? GAP);
      slot.cell[DIMS[A.dim].key] = value;
      cellRange[axis] = [axisToScreen(L, axis, start), axisToScreen(L, axis, end)];
    }
  }
  if (cellRange.x || cellRange.y) {
    const [x0, x1] = cellRange.x ?? [box.x, box.x + box.w], [y0, y1] = cellRange.y ?? [box.y, box.y + box.h];
    slot.markRect = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
    // 先客：移った先で、X・Y どちらの次元で読んでも同じ値になる兄弟（＝同じ位置に置かれて重なる泡）
    const probeB = { ...p.b, cell: { ...p.b.cell, ...slot.cell } };
    const same = k => ["x", "y"].every(ax => DIMS[L.V[ax].dim].read(k, space) === DIMS[L.V[ax].dim].read(probeB, space));
    const stay = space === drag.space && Object.keys(slot.cell).every(key => slot.cell[key] === p.b.cell[key]);
    slot.occupants = stay ? [] : sibs.map(s => s.b).filter(same);    // 元のマスのままなら誰も動かない
  }
  return slot;
}

/**
 * ★ 空いているいちばん近いマスを探す（よその空間から入ってきた泡に押し出された先客の行き先）。
 *   「同じマスに2つ入れない」を守るためだけの探索で、新しい語彙は増やさない。近さはマスの値（列・行の差）で測る
 */
function freeCellNear(spaceId, cell, exclude) {
  const keys = Object.keys(cell);
  const taken = new Set(kidsOf(spaceId).filter(k => k !== exclude)
    .map(k => keys.map(key => k.cell[key]).join(",")));
  for (let r = 1; r < 32; r++)
    for (const d of keys.length === 1 ? [[r], [-r]] : [[r, 0], [0, r], [-r, 0], [0, -r], [r, r], [-r, r], [r, -r], [-r, -r]]) {
      const cand = Object.fromEntries(keys.map((key, i) => [key, Math.max(0, cell[key] + (d[i] ?? 0))]));
      if (!taken.has(keys.map(key => cand[key]).join(","))) return cand;
    }
  return cell;
}

/** 位置 → マス。帯（と前後の隙間の半分）に入っていればその値、最後の帯より先なら新しい帯 */
function cellFromBands(bands, pos, len, gap = GAP) {
  if (!bands.length) return { value: 0, start: -len / 2, end: len / 2 };
  const first = bands[0], last = bands[bands.length - 1];
  if (pos > last.end + gap / 2) return { value: last.value + 1, start: last.end + gap, end: last.end + gap + len };
  if (pos < first.start - gap / 2 && first.value > 0)
    return { value: first.value - 1, start: first.start - gap - len, end: first.start - gap };
  const bd = bands.find(x => pos <= x.end + gap / 2) ?? last;
  return { value: bd.value, start: bd.start, end: bd.end };
}

function endDrag() {
  if (!drag) return;
  const d = drag;
  let slot = null;
  if (d.kind === "bubble" && d.started && d.moves) {
    resolveAll("keep");                 // 最後のポインタ移動までを配置に入れる（補間は進めない）
    slot = slotAt(d.mx, d.my);
  }
  drag = null;
  hoverRing = null;
  if (slot) commitDrop(d, slot);
}

const byOrder = (q, r) => q.order - r.order;
const renumber = list => list.forEach((k, i) => { k.order = i; });
/**
 * pin で留める泡（アンカー）。詰める空間に差し込むと、並びはその泡のぶんだけ必ず伸びるので、
 * 全員は留められない。留めるのは1つ ——「差し込む所より前（先頭側）」の泡。前にいなければ後ろの泡。
 * こうすると、どの縁から寄せても（買い物の左の縁＝メモ一覧の右の縁）同じ答えになり、並びは後ろへ伸びる。
 * list は差し込む前の兄弟（掴んだ泡を除く・順序どおり）、idx は差し込む位置
 */
const anchorOf = (list, idx) => list[idx - 1] ?? list[idx] ?? null;

/** 離したら確定：親を付け替えて、親の View に従って値を書く。位置は書かない（pin・奥行き は reshape が当てる） */
function commitDrop(d, slot) {
  const b = byId(d.id);
  reshape(() => {
    if (slot.snap) return snapOp(b, slot.snap);
    const moved = slot.space !== d.space;
    // 順序は「兄弟の中での順番」：親を付け替えたら、出た空間と入った空間の兄弟を 0.. に振り直す
    // （出た空間に欠番を残すと、等間隔では抜けた番号の所が穴になる）。入った先に差し込み位置が無ければ一番後ろ
    if (moved) {
      b.parent = slot.space === "root" ? null : slot.space;
      renumber(kidsOf(d.space).filter(k => k !== b).sort(byOrder));   // KIDS は付け替える前のまま
    }
    let anchor = null;
    if (slot.order) {
      const list = slot.order.list.slice();
      // よそから差し込むときだけ、前の泡を留める（並びは後ろへ伸びる）。
      // 同じ空間の中の並べ替えは付け替えではないので留めない（並びそのものが動かず、中で入れ替わる）
      if (moved) anchor = anchorOf(list, slot.order.idx);
      list.splice(slot.order.idx, 0, b);
      renumber(list);
    } else if (moved) {
      renumber([...kidsOf(slot.space).filter(k => k !== b).sort(byOrder), b]);
    }
    raise(b);                          // ★ 置いた泡も最前面へ（Z 軸が書けるなら。stack は持たない）
    // マス移動は兄弟の値の入れ替え：同じ空間の中なら、先客は掴んだ泡が空けたマスへ移る。
    // よその空間から来た泡には空けたマスが無いので、先客は空いているいちばん近いマスへ逃がす（freeCellNear）
    if (slot.occupants && slot.occupants.length) {
      const keys = Object.keys(slot.cell);
      const vacated = moved ? freeCellNear(slot.space, slot.cell, b) : Object.fromEntries(keys.map(key => [key, b.cell[key]]));
      for (const k of slot.occupants) Object.assign(k.cell, vacated);
    }
    Object.assign(b.cell, slot.cell);
    // 差し込む空間では前の泡を留める（並びが伸びても前は動かない）。そうでなければ、空間を移った泡を離した所に留める（pin）
    return anchor ? [anchor.id] : moved ? [b.id] : [];
  }, d.lift ? [b.id] : []);
}

/**
 * R1・R2 の付け替え。ドラッグでも、起動時の場面（勤務表＋希望シフト）でも、この関数だけ。
 * 位置は書かない：留める泡（相手）を返し、reshape が pin で留める
 */
function snapOp(b, sn) {
  reindex();
  const T = byId(sn.target), from = b.parent ?? "root";
  let row;
  if (sn.kind === "join") row = byId(T.parent);
  else {
    // R1：相手の席に見えない親が生まれる（親・順序・マスを相手から写す）。奥行きには置かれない（R4）
    row = add({ id: "row" + (++IMPLICIT_N), title: "並び（見えない親）", hue: 215, w: 0, h: 0, implicit: true, view: snapView(sn.axis),
                parent: T.parent, order: T.order, cell: { ...T.cell }, free: { ...T.free } });
    T.parent = row.id; T.order = 0;
  }
  b.parent = row.id;
  reindex();
  if (from !== row.id) renumber(kidsOf(from).sort(byOrder));
  const list = kidsOf(row.id).filter(k => k !== b).sort(byOrder);
  const idx = list.indexOf(T) + (sn.after ? 1 : 0);
  const anchor = anchorOf(list, idx);               // 差し込む所より前の泡（生まれたばかりの並びでは相手 T）
  list.splice(idx, 0, b);
  renumber(list);
  return [anchor ? anchor.id : T.id];
}

/**
 * 形を変える（親の付け替え）。R3 と、土台の 奥行き・pin はここで、どの操作にも同じに当たる：
 *   1. change：付け替えるだけ（位置は書かない）。留める泡の id を返す
 *   2. R3：子が1つになった見えない親は消え、残った泡が席を継ぐ（継いだ泡も留める）。子を失った並びは先頭を留める
 *   3. 奥行き：親が変わった泡は、見えていた倍率になる奥行きへ（土台）
 *   4. pin：留める泡を、前のフレームで見えていた所へ（その泡を入れている自由に置く空間の座標に、View の逆写しで書き戻す）
 *   5. 親が変わった泡の補間を、見えていた所から始める
 */
function reshape(change, animIds = []) {
  const before = new Map(frameItems.map(p => [p.id, { x: p.x, y: p.y, cx: p.x + p.w / 2, cy: p.y + p.h / 2, scale: p.scale, w: p.box.w, h: p.box.h }]));
  const parent0 = new Map(bubbles.map(b => [b.id, b.parent ?? "root"]));
  const keep = change() || [];
  const heirs = tidyRows();
  reindex();
  const moved = bubbles.filter(b => parent0.has(b.id) && parent0.get(b.id) !== (b.parent ?? "root")).map(b => b.id);
  const shrunk = [...new Set(moved.map(id => parent0.get(id)))].filter(id => id !== "root" && byId(id) && byId(id).implicit)
    .map(id => kidsOf(id).slice().sort(byOrder)[0]).filter(Boolean).map(k => k.id);
  probe();
  for (const id of moved) keepSeen(id, before.get(id));
  for (const id of [...shrunk, ...heirs, ...keep]) pin(id, before.get(id));
  // 補間は見えていた所から。親の箱（host）は次のフレームで使うもの（補間中の親）で測るので、外側から順に
  const depth = id => { let n = 0; for (let c = id; c !== "root"; c = parentOf(c)) n++; return n; };
  for (const id of [...new Set([...moved, ...animIds])].filter(byId).sort((a, c) => depth(a) - depth(c))) {
    resolveAll("keep");
    startFrom(id, before.get(id));
  }
  resolveAll("keep");
  lastSig = "";
}

/** R3：並びは2つ以上。子が1つになった見えない親は消え、残った泡が親の席を継ぐ（0 なら消えるだけ）。継いだ泡の id を返す */
function tidyRows() {
  const heirs = [];
  for (;;) {
    reindex();
    const X = bubbles.find(b => b.implicit && kidsOf(b.id).length < 2);
    if (!X) return heirs;
    const k = kidsOf(X.id)[0];
    if (k) {
      Object.assign(k, { parent: X.parent, order: X.order, cell: { ...X.cell } });
      heirs.push(k.id);
    }
    if (selectedId === X.id) selectedId = k ? k.id : null;
    removeBubble(X);
  }
}

/** 奥行き（土台）：空間を移っても見えている大きさを保つ。移った先の Z が 自由・そのまま・透視 なら、見えていた倍率になる奥行きを書く（手前へは出さない） */
function keepSeen(id, bf) {
  const b = byId(id), L = LAYOUT.get(parentOf(id));
  if (!b || !bf || !L) return;
  const A = L.V.z;
  if (verbOf(A.dim) !== "coord" || A.arrange !== "as-is" || A.lens !== "perspective") return;
  const m = bf.scale / L.host.scale;
  b.free[DIMS[A.dim].key] = focusZ(L.id) + Math.max(0, (1 / m - 1) / K_PERSP);
}

/**
 * pin（土台・SPEC §3）：id の泡の左上を、画面上の bf の所へ。書くのは、その泡から外へたどって最初に「その軸が自由に置く空間」にいる泡の座標
 * （土台のドラッグと同じ View の逆写し。並べ方が決める軸には書かない）。
 * 左上なのは、大きさを変えた泡も留められるように（付け替えでは大きさが変わらないので中心と同じ）
 */
function pin(id, bf) {
  if (!bf || !byId(id)) return;
  for (let n = 0; n < 6; n++) {
    probe();
    const q = PLACE.get(id);
    if (!q) return;
    let wrote = false;
    for (const axis of ["x", "y"]) {
      const d = (axis === "x" ? bf.x - q.x : bf.y - q.y);
      if (Math.abs(d) < 0.01) continue;
      let A = null;
      for (let cur = id; cur !== "root"; cur = parentOf(cur))
        if (verbOf(viewOf(parentOf(cur))[axis].dim) === "coord") { A = byId(cur); break; }
      if (!A) continue;
      const pa = PLACE.get(A.id), L = LAYOUT.get(parentOf(A.id)), key = DIMS[L.V[axis].dim].key, c = center(pa, axis);
      A.free[key] += valueFromPos(L, axis, screenToAxis(L, axis, c + d, pa.m)) - valueFromPos(L, axis, screenToAxis(L, axis, c, pa.m));
      wrote = true;
    }
    if (!wrote) return;
  }
  probe();
}

/** 状態から配置を解き直す（補間は進めない）。付け替えのあと、書き戻す量を測るため */
function probe() {
  const saved = new Map([...anim].map(([k, v]) => [k, { ...v }]));
  resolveAll("snap");
  anim.clear();
  for (const [k, v] of saved) anim.set(k, v);
}

/** 見えていた所から補間を始める（新しい親の中身の座標に直す） */
function startFrom(id, bf) {
  const H = LAYOUT.get(parentOf(id))?.host;
  if (!bf || !H) return;
  anim.set(id, { x: (bf.cx - H.cx) / H.scale, y: (bf.cy - H.cy) / H.scale, scale: bf.scale / H.scale, alpha: 1, w: bf.w, h: bf.h });
}

/** 比べる②：詰めるときの大きさを、すべての見えない親の View に書く（並びの先頭を留める） */
function setToggle(name, value) {
  if (!(name in TOGGLE)) throw new Error("トグルが無い: " + name);
  TOGGLE[name] = value;
  if (name === "size") {
    reshape(() => {
      for (const b of bubbles) if (b.implicit && b.view)
        for (const ax of ["x", "y"]) if (b.view[ax].arrange !== "as-is") b.view[ax].size = value;
      return bubbles.filter(b => b.implicit).map(b => kidsOf(b.id).slice().sort(byOrder)[0]).filter(Boolean).map(k => k.id);
    });
  }
  syncToggles();
}

cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("lostpointercapture", endDrag);

/** ホイール：カーソルの下の空間の焦点 Z。Z が なし なら何もしない */
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const { mx, my } = pt(e), space = windowOf(spaceAt(mx, my)), L = LAYOUT.get(space);   // R4：見えない親はホイールを外へ通す
  if (!L || L.V.z.dim === "none") return;
  // 手前へは 1 退いて全体を見られる。奥へは一番奥の泡まで（Z の約束。fitFocus）
  setFocusAxis(L, "z", spaceObj(space).focus.z + e.deltaY * 0.004);
  hintAt = { mx, my };                  // ヒントは次のフレームで、動かした焦点の配置から作る
}, { passive: false });
cv.addEventListener("pointerleave", () => { if (!drag) hideCursorHint(); });

/* ============================================================
   §5 画面の約束：ヒント行・右上の一覧・選択中の泡・カーソル脇・軸セレクタ
   ============================================================ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// R4：見えない親は体が無いので View を選べない。ツールバーが効くのは窓（並びを外へたどった空間）
const targetSpace = () => windowOf(selectedId && byId(selectedId) ? parentOf(selectedId) : "root");
const nameHtml = id => `<span class="nm" style="color:${spaceHsl(id)}">${esc(spaceName(id))}</span>`;

/**
 * 焦点を引いたら、その軸でどれだけ動けるか。setFocusAxis と同じ fitFocus の答えから言う。
 * 言い分けは幅の閾値ではなく「どちらの約束で止まるか」：
 *   並びの端まで送れる（約束(1)で止まる）            → 視点が動く
 *   箱に収まる約束(2)で、並びの端より手前で止まる     → 少しだけ視点が動く（中身が箱いっぱい）
 * （詰める・平行の軸は箱が中身ぴったりに伸びるので、余白の分しか動かない。X魚眼ビューの Y も ±17 で止まる）
 */
function focusHtml(spaceId, axis) {
  const L = LAYOUT.get(spaceId), label = DIMS[viewOf(spaceId)[axis].dim].label;
  if (!L) return `視点が動く（${label}）`;
  const room = fitFocus(L, axis, Infinity) - fitFocus(L, axis, -Infinity);
  const ps = [...L.arr[axis].pos.values()], span = ps.length ? Math.max(...ps) - Math.min(...ps) : 0;
  if (room >= 0.5 && room >= span - 0.5) return `視点が動く（${label}）`;
  const why = span <= room + 0.5 ? "並びの端まで" : "中身が箱いっぱい";
  return room < 0.5 ? `<span class="fix">動かない</span>（${label}・${why}）`
                    : `<span class="fix">少しだけ</span>視点が動く（${label}・${why}）`;
}
/** 1軸のドラッグで起きることを言葉に（その空間の View で） */
function verbHtml(spaceId, axis) {
  const dimId = viewOf(spaceId)[axis].dim, d = DIMS[dimId];
  switch (verbOf(dimId)) {
    case "coord":   return `<span class="move">動く</span>（${d.label}）`;
    case "reorder": return `<span class="move">並べ替わる</span>`;
    case "cell":    return `<span class="move">${d.label}を移る</span>`;
    case "focus":   return `<span class="fix">動かない</span>　${focusHtml(spaceId, axis)}`;
    default:        return `<span class="fix">何も起きない</span>（なし）`;
  }
}
function wheelHtml(spaceId) {
  spaceId = windowOf(spaceId);
  const V = viewOf(spaceId);
  return V.z.dim === "none"
    ? `<span class="fix">何も起きない</span>（${esc(spaceName(spaceId))}の Z が なし）`
    : `<span class="move">奥行きの視点</span>（${esc(spaceName(spaceId))}・${DIMS[V.z.dim].label}）`;
}
// 次元が なし でも並べ方とレンズは効いている（なし·詰める は上ぞろえで箱も伸びる）ので、3つとも出す
const axisText = (V, axis) => `${DIMS[V[axis].dim].label}·${ARRANGES[V[axis].arrange]}·${lensLabel(axis, V[axis].lens)}`;
/** 見えない親の Z は窓（外の空間）のもの（R4）。一覧でもそう出す */
const axisHtml = (V, axis, spaceId) => axisText(V, axis) +
  (axis === "z" && spaceId !== "root" && byId(spaceId) && byId(spaceId).implicit
    ? ` <span class="inh" style="color:${spaceHsl(windowOf(spaceId))}">←${esc(spaceName(windowOf(spaceId)))}</span>` : "");
/** 泡を掴んで空間をまたぐとき何が起きるか（泡が動く空間だけ。動かない空間では空間も移れない） */
function crossHtml(spaceId) {
  const V = viewOf(spaceId);
  if (![V.x.dim, V.y.dim].some(d => ["coord", "reorder", "cell"].includes(verbOf(d)))) return null;
  return spaceId === "root" ? ["中へ落とす", `<span class="move">その空間へ移る</span>`]
       : byId(spaceId).implicit ? ["外へ引く", `<span class="move">並びから抜ける</span>（大きく引き離す）`]
                                : ["外へ引く", `<span class="move">外の空間へ出る</span>（箱の外まで大きく引く）`];
}
/**
 * 縁へ寄せたら何が起きるか（泡が動く空間だけ）。くっつける相手は同じ窓（R4）の自由に置いた泡か並びの中の泡なので、
 * 窓が自由でない空間（格子・縦並びの中）では、箱の外へ引き出してからになる（slotAt と同じ決まり）
 */
function snapHtml(spaceId) {
  if (!crossHtml(spaceId)) return null;
  const V = viewOf(windowOf(spaceId)), here = verbOf(V.x.dim) === "coord" && verbOf(V.y.dim) === "coord";
  return ["縁へ寄せる", here ? `<span class="move">並ぶ</span>（見えない親が生まれる・並びなら加わる）`
                             : `<span class="move">並ぶ</span>（箱の外まで引き出してから）`];
}
/** 比べる③：並びごと動かすには */
function rowGrabHtml(b) {
  if (!rowOf(b.id)) return null;
  const how = TOGGLE.grab === "edge" ? "並びの外周（縁 12px）を掴む" : TOGGLE.grab === "alt" ? "⌥ を押しながら掴む" : "先頭の泡を掴む";
  return ["並びごと", `<span class="move">${how}</span>`];
}
/**
 * ★ 掴んだら何が起きるか。カーソル脇ヒントと選択パネルはここ1か所から作る。
 * 比べる③ で掴む先が変わる（「先頭の泡」なら先頭を掴んでも動くのは並び）ので、
 * 説明も grabbedOf を通した空間のものにする——選択中の泡の親空間を直に読むと、比べる先の説明が嘘になる
 */
function grabHtml(p, alt) {
  const g = grabbedOf(p, alt), rows = [["横ドラッグ", verbHtml(g.space, "x")], ["縦ドラッグ", verbHtml(g.space, "y")]];
  for (const kv of [crossHtml(g.space), snapHtml(g.space), g.id === p.id ? rowGrabHtml(g.b) : null]) if (kv) rows.push(kv);
  return { g, rows };
}

/* ── カーソルの脇：その場所でドラッグ・ホイールしたら何が起きるか ── */
const cursorHint = document.getElementById("cursor-hint");
// 出ているヒントは、毎フレームいまの配置から作り直す（ホイールで焦点が動いた・補間で泡が動いた、でも古くならない）
let hintAt = null;
function hideCursorHint() { hintAt = null; cursorHint.style.display = "none"; }
function showCursorHint(mx, my) {
  const sel = handleAt(mx, my), hit = hitTest(mx, my), lines = [];
  hoverRing = hit && hit.b.implicit ? hit.id : null;
  const line = kv => kv && lines.push(`${kv[0].padEnd(6, "　")}${kv[1]}`);
  if (sel) {
    lines.push(`<span class="who">${esc(sel.b.title)}</span>`);
    line(["ドラッグ", "大きさを変える"]);          // 行の頭ぞろえは line 1つに任せる（全角6つ分）
    cv.style.cursor = "nwse-resize";
  } else if (hit && !inContent(hit, my)) {
    const { g: p, rows } = grabHtml(hit, lastAlt);  // 比べる③：並びごと掴むなら、掴むのは見えない親
    const who = p.id !== hit.id ? `${esc(hit.b.title)} → 並びごと` : hit.b.implicit ? "並び（見えない親）の縁" : esc(p.b.title);
    lines.push(`<span class="who">${who}</span>  ${nameHtml(p.space)}`);
    for (const kv of rows) line(kv);
    cv.style.cursor = "grab";
  } else {
    const space = hit ? hit.id : "root", V = viewOf(space);
    const bg = axis => V[axis].dim === "none" ? `<span class="fix">何も起きない</span>（なし）` : focusHtml(space, axis);
    lines.push(`<span class="who">背景</span>  ${nameHtml(space)}`, `横ドラッグ  ${bg("x")}`, `縦ドラッグ  ${bg("y")}`);
    cv.style.cursor = "default";
  }
  lines.push(`ホイール    ${wheelHtml(spaceAt(mx, my))}`);
  const html = lines.join("\n");
  if (hintAt && hintAt.html === html && hintAt.mx === mx && hintAt.my === my && cursorHint.style.display === "block") return;
  hintAt = { mx, my, html };
  cursorHint.innerHTML = html;
  cursorHint.style.display = "block";
  const w = cursorHint.offsetWidth, h = cursorHint.offsetHeight;
  cursorHint.style.left = (mx + 18 + w > VW ? mx - 18 - w : mx + 18) + "px";
  cursorHint.style.top = (my + 16 + h > VH ? my - 12 - h : my + 16) + "px";
}

/* ── 右上：空間の一覧（入れ子のツリー） ── */
function spacesHtml() {
  const cur = targetSpace(), rows = [];
  const walk = (id, depth) => {
    const V = viewOf(id), S = spaceSummary(id);
    rows.push(
      `<div class="sp" style="padding-left:${depth * 12}px">${depth ? "└ " : "▸ "}${nameHtml(id)}` +
      `  <span class="${id !== "root" && byId(id).implicit ? "inh" : V.own ? "own" : "inh"}">` +
        `${id !== "root" && byId(id).implicit ? "並べるだけ（選べない）" : V.own ? "自前" : "継承"}</span>` +
      `  <span class="${S.cls}">${S.text}</span>${id === cur ? ' <span class="cur">← 選択中</span>' : ""}` +
      (id !== "root" && byId(id).implicit ? `<br><span class="inh" style="padding-left:14px">${kidsOf(id).slice().sort(byOrder).map(k => esc(k.title)).join(" ｜ ")}</span>` : "") +
      `<div class="axs">${["x", "y", "z"].map(a => `<span class="ax"><i>${a.toUpperCase()}</i>${axisHtml(V, a, id)}</span>`).join("")}</div></div>`);
    for (const k of kidsOf(id)) if (isHost(k)) walk(k.id, depth + 1);
  };
  walk("root", 0);
  return `<span class="t">空間</span>` + rows.join("");
}

/* ── その下：選択中の泡 ── */
function selectionHtml() {
  const b = byId(selectedId), p = PLACE.get(selectedId);
  if (!b || !p) return "泡をクリックすると、ここに説明が出ます。";
  const space = parentOf(b.id), V = viewOf(space);
  // 比べる③：掴んだら実際に動くのは何か。カーソル脇ヒントと同じ grabHtml を通す（⌥ は押していないときの話）
  const { g, rows } = grabHtml(p, false);
  // 合成 scale の内訳：各段の局所倍率を並べる
  const chain = [];
  for (let q = p; q; q = q.space === "root" ? null : PLACE.get(q.space)) chain.unshift(q.local);
  const k = (label, html) => `<div><span class="k">${label}</span>${html}</div>`;
  return [
    `<div><span class="t">選択</span>  <span class="nm" style="color:hsl(${b.hue} 70% 66%)">${esc(b.title)}</span>` +
      (g.id !== b.id ? `  <span class="move">→ 並びごと</span>` : "") + `</div>`,
    k("いる空間", `${nameHtml(space)}  <span class="${byId(space) && byId(space).implicit ? "inh" : V.own ? "own" : "inh"}">` +
      `${byId(space) && byId(space).implicit ? "並べるだけ（View を選べない）" : V.own ? "自前" : "継承"}</span>`),
    p.vis > 0 ? "" : k("見え方", `<span class="fix">見えない</span>（焦点 Z より手前。掴めない）`),
    g.id !== b.id ? k("掴むと", `<span class="move">並びごと</span> 動く（${nameHtml(g.space)} の中で）`) : "",
    ...rows.map(kv => k(kv[0], kv[1])),
    k("ホイール", wheelHtml(space)),
    isHost(b) ? k("中", `${nameHtml(b.id)}  <span class="${spaceSummary(b.id).cls}">${spaceSummary(b.id).text}</span>`) : "",
    k("倍率", `<b style="color:var(--accent)">${p.scale.toFixed(3)}</b>` +
      (chain.length > 1 ? `  ＝ ${chain.map(v => v.toFixed(3)).join(" × ")}` : "")),
  ].join("");
}

/* ── ツールバー：軸セレクタ・プリセット・ヒント行 ── */
const selects = [...document.querySelectorAll("select[data-axis]")];
for (const el of selects) {
  const { axis, part } = el.dataset;
  const opts = part === "dim" ? Object.entries(DIMS).map(([id, d]) => [id, d.label])
             : part === "arrange" ? Object.entries(ARRANGES)
             : Object.entries(axis === "z" ? LENS_Z : LENS_XY).map(([id, l]) => [id, l.label]);
  for (const [value, label] of opts) { const o = document.createElement("option"); o.value = value; o.textContent = label; el.appendChild(o); }
  el.onchange = () => { setAxis(targetSpace(), axis, { [part]: el.value }); lastSig = ""; };
}
let lastSig = "";
function syncToolbar() {
  const id = targetSpace(), V = viewOf(id);
  const sig = `${id}|${V.own}|${["x", "y", "z"].map(a => `${V[a].dim},${V[a].arrange},${V[a].lens}`).join("|")}`;
  if (sig === lastSig) return;
  lastSig = sig;
  for (const el of selects) el.value = V[el.dataset.axis][el.dataset.part];
  const lab = document.getElementById("axis-scope");
  lab.textContent = `${spaceName(id)}${V.own ? "" : "（継承）"} の`;
  lab.style.color = spaceHsl(id);
  document.getElementById("inherit").disabled = id === "root" || !V.own;
}
document.querySelectorAll("[data-preset]").forEach(btn => {
  btn.onclick = () => { applyPreset(btn.dataset.preset, targetSpace()); lastSig = ""; };
});
document.getElementById("inherit").onclick = () => { inheritView(targetSpace()); lastSig = ""; };
document.getElementById("refocus").onclick = () => { Object.assign(spaceObj(targetSpace()).focus, { x: 0, y: 0, z: 0 }); };
{
  const hintEl = document.getElementById("hint"), DEFAULT = hintEl.innerHTML;
  for (const el of document.querySelectorAll("[data-hint]")) {
    el.addEventListener("mouseenter", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("focus", () => { hintEl.innerHTML = el.dataset.hint; });
    el.addEventListener("mouseleave", () => { hintEl.innerHTML = DEFAULT; });
  }
}

/* ── 比べるトグル（ツールバー1行目）と、左下の「いま比べているもの」 ── */
const COMPARE = {
  show: { label: "① 見えない親", values: { hide: ["隠す", "並んだ2つだけが見える"], faint: ["うっすら枠", "並びの外周に点線と名前"] } },
  size: { label: "② 詰める大きさ", values: { own: ["自前", "奥の泡が縮んだ分、縁がずれる（すき間 にも 重なり にも・桃色の数字）"], seen: ["見かけ", "奥の泡も縁が接する（その軸は消失点へ寄せない）"] } },
  grab: { label: "③ 並びを掴む", values: { edge: ["親の縁", "並びの外周 12px を掴む"], alt: ["⌥＋掴む", "⌥ を押しながら中の泡を掴む"], lead: ["先頭の泡", "先頭を掴むと並びごと（先頭は並べ替えできない）"] } },
};
function syncToggles() {
  document.querySelectorAll("[data-toggle]").forEach(btn => btn.classList.toggle("on", TOGGLE[btn.dataset.toggle] === btn.dataset.value));
  setHtml("compare", `<span class="t">いま比べているもの</span>` + Object.entries(COMPARE).map(([k, c]) => {
    const [v, d] = c.values[TOGGLE[k]];
    return `<div><span class="k">${c.label}</span><span class="v">${v}</span>${d}</div>`;
  }).join(""));
}
document.querySelectorAll("[data-toggle]").forEach(btn => {
  btn.onclick = () => { setToggle(btn.dataset.toggle, btn.dataset.value); };
});

const panelCache = {};
function setHtml(id, html) { if (panelCache[id] !== html) { panelCache[id] = html; document.getElementById(id).innerHTML = html; } }
function updatePanels() {
  setHtml("spaces", spacesHtml()); setHtml("selection", selectionHtml()); syncToolbar();
  if (hintAt && !drag) showCursorHint(hintAt.mx, hintAt.my);
}

/* ============================================================
   ループ
   ============================================================ */
function frame() { resolveAll("step"); draw(); updatePanels(); }
function settle() { resolveAll("snap"); resolveAll("snap"); draw(); updatePanels(); }
function loop() { frame(); requestAnimationFrame(loop); }

/* ============================================================
   §6 検証用の口（座標はページのビューポート座標）
   ============================================================ */
const offset = () => { const r = cv.getBoundingClientRect(); return { x: r.left, y: r.top }; };
const outPlace = p => { const o = offset();
  return { id: p.id, x: p.x + o.x, y: p.y + o.y, w: p.w, h: p.h, scale: p.scale, local: p.local, depth: p.depth, space: p.space, alpha: p.alpha,
           implicit: p.b.implicit }; };
window.__lab = {
  select(id) { selectedId = id; lastSig = ""; },
  selectedId: () => selectedId,
  bubbles: () => JSON.parse(JSON.stringify(bubbles)),
  viewOf: id => { const v = viewOf(id); return JSON.parse(JSON.stringify({ x: v.x, y: v.y, z: v.z, focus: v.focus, own: v.own })); },
  setAxis(spaceId, axis, patch) { setAxis(spaceId, axis, patch); lastSig = ""; },
  preset(name, spaceId) { applyPreset(name, spaceId ?? targetSpace()); lastSig = ""; },
  placements: () => frameItems.map(outPlace),
  rectOf(id) { const p = PLACE.get(id); if (!p) return null; const o = outPlace(p); return { x: o.x, y: o.y, w: o.w, h: o.h }; },
  /** ヘッダの中で、実際にその泡に当たる点（手前の泡に隠れていない点）を探す */
  headerPointOf(id) {
    const p = PLACE.get(id); if (!p) return null;
    if (p.b.implicit) return window.__lab.edgePointOf(id);   // this に頼らない（__lab.headerPointOf を外して呼ばれる）
    const o = offset(), y = p.box.h <= 34 ? p.y + p.h / 2 : p.y + Math.min(12 * p.scale, p.h / 2);
    for (const t of [0.35, 0.5, 0.2, 0.65, 0.8, 0.1, 0.9]) {
      const x = p.x + p.w * t, hit = hitTest(x, y);
      if (hit && hit.id === id && !inContent(hit, y)) return { x: x + o.x, y: y + o.y };
    }
    return { x: p.x + p.w * 0.35 + o.x, y: y + o.y };
  },
  focusOf: id => ({ ...spaceObj(id).focus }),
  layoutOf(id) { const L = LAYOUT.get(id); return L && { host: L.host, H: L.ctx.H, vp: L.ctx.vp }; },
  frame() { frame(); },
  settle() { settle(); },
  // ── 案1で足したもの ──
  toggles: () => ({ ...TOGGLE }),
  setToggle(name, value) { setToggle(name, value); },
  /** R1・R2 をドラッグなしで当てる。side は "left" | "right" | "top" | "bottom"（id を target のどちら側へ） */
  snap(id, target, side) {
    const axis = side === "left" || side === "right" ? "x" : "y", after = side === "right" || side === "bottom";
    const row = rowOf(target), join = !!row && verbOf(viewOf(row.id)[axis].dim) === "reorder";
    reshape(() => snapOp(byId(id), { kind: join ? "join" : "born", target, axis, after }));
  },
  /** 見えない親の縁（外周）の点。親の縁を掴むやり方のときに当たる */
  edgePointOf(id) { const p = PLACE.get(id); if (!p) return null; const o = offset(); return { x: p.x + p.w * 0.5 + o.x, y: p.y - RING / 2 + o.y }; },
  rowOf: id => rowOf(id)?.id ?? null,
  // view はその並びで「効いている」View（Z は窓＝外の空間のもの。見えない親は Z を持たない R4）
  implicitParents: () => bubbles.filter(b => b.implicit).map(b => ({ id: b.id, parent: b.parent, kids: kidsOf(b.id).slice().sort(byOrder).map(k => k.id),
                                                                     view: JSON.parse(JSON.stringify((v => ({ x: v.x, y: v.y, z: v.z }))(viewOf(b.id)))) })),
  /** 並びの軸での縁のすき間（画面 px。a の次が c のとき） */
  gapBetween(a, c, axis = "x") { const p = PLACE.get(a), q = PLACE.get(c); return p && q ? gapOf(p, q, axis) : null; },
  /** 補間を1フレーム進めずに、いまの状態で配置だけ解き直す */
  keep() { resolveAll("keep"); },
  dragState: () => drag && drag.slot ? { id: drag.id, space: drag.space, slot: { space: drag.slot.space, out: drag.slot.out, snap: drag.slot.snap ?? null } } : null,
  hitAt(x, y) { const o = offset(), p = hitTest(x - o.x, y - o.y); return p ? p.id : null; },
  /** いま描いた字（見えない親の名前・注記）の矩形と、泡・ほかの字との重なり（cost、px²） */
  labels() { const o = offset(); return PLACED_LABELS.map(l => ({ ...l, x: l.x + o.x, y: l.y + o.y })); },
};

resize();
settle();
// 場面 2：勤務表と希望シフトは、起動時にドラッグと同じ R1（snapOp → reshape）で並べる
reshape(() => snapOp(byId("kibou"), { kind: "born", target: "kinmu", axis: "x", after: true }));
settle();
syncToggles();
requestAnimationFrame(loop);
</script>
</body>
</html>
